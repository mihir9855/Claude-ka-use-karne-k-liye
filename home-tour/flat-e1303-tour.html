<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flat E-1303 Tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: full-bleed 3D canvas with a small plan-sheet style HUD floating over it. Single dark look by choice. */
:root{
  --ink:#f3f1ea;            /* HUD text */
  --ink-dim:#b9bdb8;        /* secondary text */
  --panel:rgba(22,30,32,.78);/* HUD panels */
  --line:rgba(243,241,234,.18);
  --teal:#0f8a7c;           /* plan accent, from the furniture plan */
  --teal-ink:#ffffff;
  --sky:#cfe0ec;            /* page ground behind the canvas */
  --ui:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--ui);font-size:14px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;touch-action:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;cursor:grab}
.panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:6px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#hud{top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));padding:10px 14px;max-width:min(62vw,340px);pointer-events:none}
#hud .flat{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
#hud .room{font-size:18px;font-weight:650;line-height:1.25;margin-top:2px;text-wrap:balance}
#hud .size{font-family:var(--mono);font-size:13px;color:var(--ink-dim);margin-top:2px}
#viewBtn{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));
  font:600 14px var(--ui);color:var(--teal-ink);background:var(--teal);border:1px solid rgba(255,255,255,.25);
  border-radius:6px;padding:11px 16px;cursor:pointer}
#viewBtn:hover{filter:brightness(1.1)}
#viewBtn:focus-visible,#startBtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#help{bottom:calc(12px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));
  right:max(16px,env(safe-area-inset-right,0px));width:fit-content;max-width:calc(100% - 32px);
  padding:8px 12px;font-size:12.5px;color:var(--ink-dim);pointer-events:none;line-height:1.5}
#help b{color:var(--ink);font-weight:600}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(14,20,22,.45);
  padding:16px}
#start .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px 24px;max-width:380px;text-align:left}
#start h1{margin:0 0 4px;font-size:22px;font-weight:650}
#start p{margin:0 0 14px;color:var(--ink-dim);line-height:1.5}
#startBtn{font:600 15px var(--ui);color:var(--teal-ink);background:var(--teal);border:1px solid rgba(255,255,255,.25);
  border-radius:6px;padding:12px 18px;cursor:pointer;width:100%}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;
  background:#1a2224;color:var(--ink);font-size:15px;line-height:1.5}
</style>
</head>
<body>
<canvas id="view" tabindex="0" aria-label="3D walkthrough of Flat E-1303"></canvas>
<div id="hud" class="panel"><div class="flat">Flat E-1303 · Ahmedabad</div><div class="room" id="roomName">Foyer</div><div class="size" id="roomSize"></div></div>
<button id="viewBtn" type="button">Dollhouse view</button>
<div id="help" class="panel"></div>
<div id="start"><div class="card">
  <h1>Flat E-1303</h1>
  <p>Walk the 2-bedroom flat from the main door. Rooms, doors and windows are built to the CAD plan.</p>
  <button id="startBtn" type="button">Start walking</button>
</div></div>
<div id="err" hidden>The 3D library could not load. Check the internet connection and reload this page.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){document.getElementById('err').hidden=false;return;}
var T=THREE;
var H=2.845;                 // clear ceiling height, 9'4"
var ENV=0.2;                 // sky reflection strength on ordinary surfaces
var EYE=1.55, RADIUS=0.2;

/* ---------- renderer ---------- */
var canvas=document.getElementById('view');
var isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
var renderer=new T.WebGLRenderer({canvas:canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,isTouch?1.5:2));
renderer.outputEncoding=T.sRGBEncoding;
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.9;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=T.PCFSoftShadowMap;
var ANISO=Math.min(8,renderer.capabilities.getMaxAnisotropy());

var scene=new T.Scene();
scene.fog=new T.Fog(0xdde8f0,70,330);
var world=new T.Group(); scene.add(world);
var roof=new T.Group(); scene.add(roof);        // ceiling, beams, ceiling lights: hidden in dollhouse view
var labels=new T.Group(); labels.visible=false; scene.add(labels);

/* ---------- helpers ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function col(hex){return new T.Color(hex).convertSRGBToLinear();}
function canvasTex(w,h,draw,mw,mh){
  var c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  var t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.encoding=T.sRGBEncoding;t.anisotropy=ANISO;
  t.repeat.set(1/mw,1/mh);return t;
}
function std(hex,rough,metal,extra){
  var p={color:col(hex),roughness:rough==null?0.9:rough,metalness:metal||0,envMapIntensity:ENV};
  if(extra)for(var k in extra)p[k]=extra[k];
  return new T.MeshStandardMaterial(p);
}

/* ---------- procedural textures (UVs are in metres) ---------- */
// White marble-look tile, 2' x 4' (0.61 x 1.22 m). Canvas holds 4 different tiles.
var marbleTex=canvasTex(1024,2048,function(g){
  var R=rng(11);
  for(var ty=0;ty<2;ty++)for(var tx=0;tx<2;tx++){
    var x0=tx*512,y0=ty*1024,i,k;
    g.save();g.beginPath();g.rect(x0,y0,512,1024);g.clip();
    var b=243+(R()*6|0);g.fillStyle='rgb('+b+','+b+','+(b-2)+')';g.fillRect(x0,y0,512,1024);
    for(i=0;i<14;i++){
      var cx=x0+R()*512,cy=y0+R()*1024,r=120+R()*260,a=0.05+R()*0.08;
      var gr=g.createRadialGradient(cx,cy,0,cx,cy,r);
      gr.addColorStop(0,'rgba(150,155,165,'+a+')');gr.addColorStop(1,'rgba(150,155,165,0)');
      g.fillStyle=gr;g.fillRect(x0,y0,512,1024);
    }
    var base=R()*Math.PI;
    for(i=0;i<8;i++){
      var x=x0+R()*512,y=y0+R()*1024,ang=base+(R()-0.5)*1.2,len=25+(R()*45|0),wd=0.6+R()*R()*3.2,al=0.22+R()*0.3;
      g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(x,y);
      for(k=0;k<len;k++){ang+=(R()-0.5)*0.55;x+=Math.cos(ang)*22;y+=Math.sin(ang)*22;g.lineTo(x,y);}
      g.strokeStyle='rgba(140,144,152,'+(al*0.22)+')';g.lineWidth=wd*6;g.stroke();
      g.strokeStyle='rgba(118,122,130,'+al+')';g.lineWidth=wd;g.stroke();
    }
    g.restore();
    g.strokeStyle='rgba(178,175,168,0.95)';g.lineWidth=3;g.strokeRect(x0+0.5,y0+0.5,511,1023);
  }
},1.22,2.44);
var woodTex=canvasTex(512,512,function(g,w,h){
  var R=rng(5);g.fillStyle='#fff';g.fillRect(0,0,w,h);
  for(var i=0;i<260;i++){g.fillStyle='rgba(80,52,26,'+(0.03+R()*0.09)+')';g.fillRect(0,R()*h,w,1+R()*3);}
  for(i=0;i<5;i++){g.fillStyle='rgba(60,40,20,0.10)';g.fillRect(0,(i+0.5)*h/5,w,1.5);}
},1.0,1.0);
function gridTex(px,line,speck,mw,mh,seed){
  return canvasTex(px,px,function(g,w,h){
    var R=rng(seed);g.fillStyle='#fff';g.fillRect(0,0,w,h);
    for(var i=0;i<speck;i++){g.fillStyle='rgba(60,64,70,'+(R()*0.07)+')';g.fillRect(R()*w,R()*h,2+R()*3,2+R()*3);}
    g.strokeStyle='rgba(120,124,130,0.85)';g.lineWidth=line;g.strokeRect(0,0,w,h);
  },mw,mh);
}
var woodTexV=woodTex.clone();woodTexV.rotation=Math.PI/2;woodTexV.needsUpdate=true;
var wallTileTex=gridTex(256,4,0,0.6,0.3,1);
var antiSkidTex=gridTex(256,5,900,0.3,0.3,2);
var subwayTex=canvasTex(256,256,function(g,w,h){
  g.fillStyle='#fff';g.fillRect(0,0,w,h);g.strokeStyle='rgba(150,152,155,0.9)';g.lineWidth=3;
  g.strokeRect(0,0,w,h/2);g.strokeRect(-w/2,h/2,w,h/2);g.strokeRect(w/2,h/2,w,h/2);
},0.2,0.2);
var fabricTex=canvasTex(128,128,function(g,w,h){
  var R=rng(9);g.fillStyle='#fff';g.fillRect(0,0,w,h);
  for(var i=0;i<1600;i++){g.fillStyle='rgba(0,0,0,'+(R()*0.07)+')';g.fillRect(R()*w,R()*h,2,1);}
},0.25,0.25);

/* ---------- materials ---------- */
var EXT='#ECE9E2';
var C={DR:'#E6E1D3',KI:'#EEF0EC',CE:'#EEF0EC',ST:'#D9D0C3',B1:'#CDD3CE',B2:'#D1C6B8',WY:'#E0E2E8',BA:'#D1C6B8'};
var MAT={
  white:std('#f6f5f1',0.85),
  cap:std('#3b4144',0.9),
  ceil:std('#fbfaf7',0.95),
  frame:std('#f4f3ef',0.6),
  marble:std('#e9e7e3',0.18,0,{map:marbleTex,envMapIntensity:0.6}),
  antiskid:std('#aeb2b8',0.75,0,{map:antiSkidTex}),
  balconyFloor:std('#cfc8bb',0.8,0,{map:antiSkidTex}),
  lobbyFloor:std('#b9b4aa',0.5,0,{map:antiSkidTex}),
  TO:std('#E0E2E8',0.32,0,{map:wallTileTex,envMapIntensity:0.5}),
  subway:std('#ffffff',0.3,0,{map:subwayTex,envMapIntensity:0.5}),
  oak:std('#c49a6c',0.6,0,{map:woodTex}),
  oakDark:std('#8b5e3c',0.55,0,{map:woodTex}),
  oakV:std('#c49a6c',0.6,0,{map:woodTexV}),
  oakDarkV:std('#8b5e3c',0.55,0,{map:woodTexV}),
  walnut:std('#6f4a30',0.5,0,{map:woodTex}),
  lam:std('#f1efea',0.5),
  sage:std('#b4c2ae',0.55),
  quartz:std('#f1efeb',0.25,0,{envMapIntensity:0.6}),
  stone:std('#cfcabf',0.45),
  steel:std('#c6c9cc',0.3,0.85,{envMapIntensity:1}),
  steelDark:std('#5b5f63',0.4,0.6,{envMapIntensity:0.8}),
  brass:std('#c8a45a',0.3,0.9,{envMapIntensity:1}),
  charcoal:std('#33373a',0.35,0.2),
  screenOff:std('#15181a',0.15,0.3,{envMapIntensity:0.9}),
  ceramic:std('#fbfbf9',0.12,0,{envMapIntensity:0.7}),
  sofa:std('#cbbd9f',0.95,0,{map:fabricTex}),
  cushion:std('#5f8f8a',0.95,0,{map:fabricTex}),
  rug:std('#a9b3ac',1,0,{map:fabricTex}),
  linen:std('#f4f2ec',0.95,0,{map:fabricTex}),
  duvet:std('#8fa9a4',0.95,0,{map:fabricTex}),
  headboard:std('#bfb39c',0.95,0,{map:fabricTex}),
  cane:std('#c9a876',0.8,0,{map:woodTex}),
  terracotta:std('#b9694a',0.85),
  leaf:std('#4f7d4a',0.8),
  glass:new T.MeshStandardMaterial({color:col('#dff0f4'),transparent:true,opacity:0.16,roughness:0.04,metalness:0,envMapIntensity:1,depthWrite:false}),
  frosted:new T.MeshStandardMaterial({color:col('#f2f6f7'),transparent:true,opacity:0.6,roughness:0.6,envMapIntensity:0.4,depthWrite:false}),
  sheer:new T.MeshStandardMaterial({color:col('#ffffff'),transparent:true,opacity:0.5,roughness:1,envMapIntensity:0.2,side:T.DoubleSide,depthWrite:false}),
  mirror:std('#eef2f3',0.03,1,{envMapIntensity:1.2}),
  glowWarm:new T.MeshBasicMaterial({color:0xfff0cf}),
  glowDiya:new T.MeshBasicMaterial({color:0xffb347})
};
var paints={};
function M(k){
  if(typeof k!=='string')return k;
  if(k[0]==='#')return paints[k]||(paints[k]=std(k,0.93));
  return MAT[k];
}

/* ---------- geometry builders ---------- */
var colliders=[];   // [x1,x2,z1,z2] footprints the walker cannot enter
function wuv(g){
  var p=g.attributes.position,n=g.attributes.normal,uv=g.attributes.uv;
  for(var i=0;i<p.count;i++){
    var ax=Math.abs(n.getX(i)),ay=Math.abs(n.getY(i));
    if(ay>0.5)uv.setXY(i,p.getX(i),p.getZ(i));
    else if(ax>0.5)uv.setXY(i,p.getZ(i),p.getY(i));
    else uv.setXY(i,p.getX(i),p.getY(i));
  }
}
function box(x1,x2,y1,y2,z1,z2,mat,o){
  o=o||{};
  var g=new T.BoxGeometry(x2-x1,y2-y1,z2-z1);g.translate((x1+x2)/2,(y1+y2)/2,(z1+z2)/2);wuv(g);
  var m=new T.Mesh(g,Array.isArray(mat)?mat.map(M):M(mat));
  m.castShadow=o.cast!==false;m.receiveShadow=o.receive!==false;(o.parent||world).add(m);
  if(o.solid)colliders.push([x1,x2,z1,z2]);
  return m;
}
function F(x1,x2,y1,y2,z1,z2,mat,solid){return box(x1,x2,y1,y2,z1,z2,mat,{solid:solid!==false&&y1<1.2});}
function cyl(x,y1,y2,z,r,mat,solid,r2){
  var g=new T.CylinderGeometry(r2==null?r:r2,r,y2-y1,24);g.translate(x,(y1+y2)/2,z);
  var m=new T.Mesh(g,M(mat));m.castShadow=true;m.receiveShadow=true;world.add(m);
  if(solid)colliders.push([x-r,x+r,z-r,z+r]);
  return m;
}
function ball(x,y,z,r,mat,sy){
  var g=new T.IcosahedronGeometry(r,1);var m=new T.Mesh(g,M(mat));m.position.set(x,y,z);if(sy)m.scale.y=sy;
  m.castShadow=true;m.receiveShadow=true;world.add(m);return m;
}

// Wall along 'x' (occupies z = at..at+t; side A is north, side B is south)
// or along 'z' (occupies x = at..at+t; side A is west, side B is east).
// opens: [start, end, sill, head, kind, extra]
function wall(dir,a,b,at,t,cA,cB,opens,o){
  o=o||{};var h=o.h||H;opens=(opens||[]).slice().sort(function(p,q){return p[0]-q[0];});
  function skirtOk(c){return typeof c==='string'&&c[0]==='#'&&c!==EXT;}
  function piece(s,e,y1,y2){
    if(e-s<1e-3||y2-y1<1e-3)return;
    var top=y2>=H-1e-3?'cap':'white';
    var mats=dir==='x'?['white','white',top,'white',cB,cA]:[cB,cA,top,'white','white','white'];
    if(dir==='x')box(s,e,y1,y2,at,at+t,mats,{solid:y1<1.4});else box(at,at+t,y1,y2,s,e,mats,{solid:y1<1.4});
    if(y1===0&&h>=H-1e-3){
      var sk={cast:false};
      if(skirtOk(cA)){if(dir==='x')box(s,e,0,0.08,at-0.012,at,'white',sk);else box(at-0.012,at,0,0.08,s,e,'white',sk);}
      if(skirtOk(cB)){if(dir==='x')box(s,e,0,0.08,at+t,at+t+0.012,'white',sk);else box(at+t,at+t+0.012,0,0.08,s,e,'white',sk);}
    }
  }
  // box in wall-local terms: along [u1,u2], across [v1,v2]
  function lb(u1,u2,y1,y2,v1,v2,mat,opt){return dir==='x'?box(u1,u2,y1,y2,v1,v2,mat,opt):box(v1,v2,y1,y2,u1,u2,mat,opt);}
  var cur=a;
  opens.forEach(function(op){
    var s=op[0],e=op[1],sill=op[2],head=op[3],kind=op[4],ex=op[5]||{};
    piece(cur,s,0,h);piece(s,e,0,sill);piece(s,e,head,h);cur=e;
    if(kind==='open')return;
    var plane=at+t/2;                        // where the glass sits across the wall
    if(t>0.2){if(cB===EXT)plane=at+t-0.07;else if(cA===EXT)plane=at+0.07;}
    if(kind==='door'){
      var d1=at-0.015,d2=at+t+0.015;
      lb(s,s+0.04,0,head,d1,d2,'frame');lb(e-0.04,e,0,head,d1,d2,'frame');lb(s,e,head-0.04,head,d1,d2,'frame');
      if(ex.leaf!==false){
        var w=e-s-0.09,lh=head-0.05,sgn=ex.hinge==='e'?-1:1,sw=ex.swing||1,th=(ex.open==null?88:ex.open)*Math.PI/180;
        var hu=ex.hinge==='e'?e-0.045:s+0.045,hv=sw>0?at+t:at;
        var grp=new T.Group(),lg,hx;
        if(dir==='x'){lg=new T.BoxGeometry(w,lh,0.038);lg.translate(sgn*w/2,lh/2,0);grp.position.set(hu,0,hv);grp.rotation.y=-th*sgn*sw;
          hx=new T.BoxGeometry(0.12,0.025,0.09);hx.translate(sgn*(w-0.1),1.0,0);}
        else{lg=new T.BoxGeometry(0.038,lh,w);lg.translate(0,lh/2,sgn*w/2);grp.position.set(hv,0,hu);grp.rotation.y=th*sgn*sw;
          hx=new T.BoxGeometry(0.09,0.025,0.12);hx.translate(0,1.0,sgn*(w-0.1));}
        var leaf=new T.Mesh(lg,M(ex.mat||'oakV'));leaf.castShadow=true;leaf.receiveShadow=true;grp.add(leaf);
        grp.add(new T.Mesh(hx,MAT.brass));world.add(grp);
      }
    }else{
      var f=0.045,p1=plane-0.035,p2=plane+0.035;
      lb(s,s+f,sill,head,p1,p2,'frame');lb(e-f,e,sill,head,p1,p2,'frame');
      lb(s,e,head-f,head,p1,p2,'frame');lb(s,e,sill,sill+f,p1,p2,'frame');
      if(e-s>1.1)lb((s+e)/2-0.025,(s+e)/2+0.025,sill,head,p1,p2,'frame');
      lb(s+f,e-f,sill+f,head-f,plane-0.004,plane+0.004,kind==='vent'?'frosted':'glass',{cast:false});
      if(ex.sheer){               // sheer curtains gathered at the sides, on the room side
        var inA=cB===EXT,cv=inA?at-0.07:at+t+0.05,cw=0.34;
        lb(s-0.18,s-0.18+cw,0.04,head+0.14,cv,cv+0.02,'sheer',{cast:false});
        lb(e+0.18-cw,e+0.18,0.04,head+0.14,cv,cv+0.02,'sheer',{cast:false});
        lb(s-0.28,e+0.28,head+0.14,head+0.165,cv-0.005,cv+0.02,'brass',{cast:false});
      }
    }
  });
  piece(cur,b,0,h);
}

/* ---------- rooms: floors, labels ---------- */
var ROOMS=[
  {n:'Drawing room',s:'10\'0" × 16\'0"',r:[6.726,9.766,1.62,6.608],f:'marble'},
  {n:'Kitchen',s:'8\'0" × 9\'10"',r:[4.166,6.62,0,3.0],f:'marble'},
  {n:'Centre · Brahmasthan',s:'11\'4" × 3\'10"',r:[3.281,6.726,3.06,4.215],f:'marble'},
  {n:'Bedroom-1 · master',s:'10\'0" × 14\'7"',r:[0,3.04,3.043,7.483],f:'marble'},
  {n:'Bedroom-2 · guest + study',s:'10\'11" × 11\'6"',r:[3.281,6.62,4.32,7.818],f:'marble'},
  {n:'Toilet-A',s:'6\'9" × 4\'4"',r:[0,2.059,1.62,2.94],f:'antiskid'},
  {n:'Toilet-B',s:'6\'3" × 4\'4"',r:[2.161,4.064,1.62,2.94],f:'antiskid'},
  {n:'Wash yard',s:'7\'9" × 5\'0"',r:[1.692,4.064,0,1.516],f:'antiskid'},
  {n:'Kitchen store',s:'5\'0" × 5\'0"',r:[6.726,8.247,0,1.516],f:'marble'},
  {n:'Balcony',s:'10\'5" × 3\'8"',r:[6.726,9.901,6.711,7.818],f:'balconyFloor'}

/* ---------- walking and collision ---------- */
function blocked(x,z){
  for(var i=0;i<colliders.length;i++){var c=colliders[i];if(x>c[0]-RADIUS&&x<c[1]+RADIUS&&z>c[2]-RADIUS&&z<c[3]+RADIUS)return true;}
  return false;
}
function roomAt(x,z){for(var i=0;i<ROOMS.length;i++){var r=ROOMS[i].r;if(x>=r[0]&&x<=r[1]&&z>=r[2]&&z<=r[3])return ROOMS[i];}return null;}
var ray=new T.Raycaster(),floorPlane=new T.Plane(new T.Vector3(0,1,0),0),hit=new T.Vector3();
function jumpTo(cx,cy){
  ray.setFromCamera(new T.Vector2(cx/window.innerWidth*2-1,-(cy/window.innerHeight)*2+1),dcam);
  if(!ray.ray.intersectPlane(floorPlane,hit))return;
  var r=roomAt(hit.x,hit.z);if(!r)return;
  var x=hit.x,z=hit.z;
  if(blocked(x,z)){                      // nudge to the nearest free spot in that room
    var best=null,bd=1e9;
    for(var gx=r.r[0]+0.25;gx<r.r[1];gx+=0.15)for(var gz=r.r[2]+0.25;gz<r.r[3];gz+=0.15){
      if(!blocked(gx,gz)){var d=(gx-x)*(gx-x)+(gz-z)*(gz-z);if(d<bd){bd=d;best=[gx,gz];}}}
    if(!best)return;x=best[0];z=best[1];
  }
  var cxr=(r.r[0]+r.r[1])/2,czr=(r.r[2]+r.r[3])/2;
  player.x=x;player.z=z;player.pitch=-0.05;
  if(Math.hypot(cxr-x,czr-z)>0.3)player.yaw=Math.atan2(-(cxr-x),-(czr-z));
  setMode('walk');
}
var lastRoom=null;
function updateHud(){
  var r=roomAt(player.x,player.z),n,s;
  if(r&&r.n==='Drawing room'&&player.x>8.78&&player.z<2.7){n='Foyer';s='inside the main door';}
  else if(r){n=r.n;s=r.s;}else if(player.x>9.7){n='Main door';s='faces east';}else return;
  if(n!==lastRoom){lastRoom=n;nameEl.textContent=n;sizeEl.textContent=s;}
}

function step(dt){
  if(mode==='walk'){
    var f=0,s=0;
    if(keys.KeyW||keys.ArrowUp)f+=1;if(keys.KeyS||keys.ArrowDown)f-=1;
    if(keys.KeyD)s+=1;if(keys.KeyA)s-=1;
    if(keys.ArrowLeft)player.yaw+=1.9*dt;if(keys.ArrowRight)player.yaw-=1.9*dt;
    f-=moveVec.y;s+=moveVec.x;
    var len=Math.hypot(f,s);
    if(len>0.01){
      if(len>1){f/=len;s/=len;}
      var sp=(keys.ShiftLeft||keys.ShiftRight?3.2:1.7)*dt,sy=Math.sin(player.yaw),cy=Math.cos(player.yaw);
      var dx=(-sy*f+cy*s)*sp,dz=(-cy*f-sy*s)*sp;
      if(!blocked(player.x+dx,player.z))player.x+=dx;
      if(!blocked(player.x,player.z+dz))player.z+=dz;
    }
    cam.position.set(player.x,EYE,player.z);cam.rotation.set(player.pitch,player.yaw,0);
    updateHud();
  }else{
    var r=orbit.r*(orbit.fit||17)/17,sp2=Math.sin(orbit.phi);
    dcam.position.set(orbit.tx+r*sp2*Math.sin(orbit.theta),r*Math.cos(orbit.phi),orbit.tz+r*sp2*Math.cos(orbit.theta));
    dcam.up.set(0,1,0);dcam.lookAt(orbit.tx,0.6,orbit.tz);
    marker.position.set(player.x,0,player.z);marker.rotation.y=player.yaw;
  }
}
function frame(){
  var dt=Math.min(0.05,clock.getDelta());step(dt);
  var c=mode==='walk'?cam:dcam;sky.position.copy(c.position);
  renderer.render(scene,c);requestAnimationFrame(frame);
}
setMode('walk');resize();updateHud();
// small hook for testing and for jumping around from the console
window.flatTour={blocked:blocked,go:function(x,z,yawDeg,pitchDeg){player.x=x;player.z=z;if(yawDeg!=null)player.yaw=yawDeg*Math.PI/180;if(pitchDeg!=null)player.pitch=pitchDeg*Math.PI/180;},
  mode:setMode,orbit:orbit,exposure:function(v){renderer.toneMappingExposure=v;},start:function(){startEl.hidden=true;}};
frame();
})();
</script>
