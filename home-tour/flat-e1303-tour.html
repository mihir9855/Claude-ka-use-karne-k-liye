<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flat E-1303 Tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: full-bleed 3D canvas; plan-sheet style panels float over it. Single dark look by choice. */
:root{
  --ink:#f3f1ea; --ink-dim:#b9bdb8; --panel:rgba(22,30,32,.8); --solid:#141c1e; --line:rgba(243,241,234,.18);
  --teal:#0f8a7c; --teal-ink:#ffffff; --sky:#cfe0ec;
  --ui:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--ui);font-size:14px;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;touch-action:none}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;transition:opacity .22s ease}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
button{font:600 13.5px var(--ui);color:var(--ink);background:rgba(243,241,234,.08);border:1px solid var(--line);border-radius:6px;padding:9px 13px;cursor:pointer}
button:hover{background:rgba(243,241,234,.16)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.primary,button[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink);border-color:rgba(255,255,255,.25)}
button.primary:hover{filter:brightness(1.1)}
#hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));padding:10px 14px;max-width:min(56vw,320px);pointer-events:none}
#hud .flat{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
#hud .room{font-size:18px;font-weight:650;line-height:1.25;margin-top:2px;text-wrap:balance}
#hud .size{font-family:var(--mono);font-size:13px;color:var(--ink-dim);margin-top:2px}
#top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 32px)}
#top button{background:var(--panel)}
#top button.primary{background:var(--teal)}
#dock{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-start;pointer-events:none}
#dock .row{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;width:100%}
#dock .panel{pointer-events:auto;padding:8px 12px;display:flex;align-items:center;gap:10px;min-width:0}
#timeBox{flex:1 1 280px;max-width:520px}
#timeBox label{font-size:12.5px;color:var(--ink-dim);white-space:nowrap}
#timeLabel{font-family:var(--mono);font-size:12.5px;white-space:nowrap;min-width:9.5em;text-align:right}
#timeRange{flex:1 1 auto;min-width:60px;height:22px;accent-color:var(--teal);cursor:pointer;touch-action:pan-x}
#styleBox{flex:0 1 auto;flex-wrap:wrap}
#styleBox span{font-size:12.5px;color:var(--ink-dim)}
#styleBox button{padding:7px 10px;font-size:12.5px}
#dock #help{display:block;font-size:12.5px;color:var(--ink-dim);line-height:1.5;pointer-events:none;max-width:100%;box-sizing:border-box}
#help b{color:var(--ink);font-weight:600}
#tourCard{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(128px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100% - 32px));
  padding:14px 18px;pointer-events:none;opacity:0;transition:opacity .5s ease;box-sizing:border-box}
#tourCard.show{opacity:1}
#tourCard .n{font-size:20px;font-weight:650;text-wrap:balance}
#tourCard .a{font-family:var(--mono);font-size:13px;color:var(--ink-dim);margin-top:3px}
#tourCard .p{margin-top:8px;line-height:1.45;border-top:1px solid var(--line);padding-top:8px}
#welcome{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
  background:linear-gradient(180deg,rgba(14,20,22,.55),rgba(14,20,22,.82));transition:opacity .5s ease}
#welcome .card{max-width:440px;width:100%;text-align:left;padding:30px 30px 26px;background:var(--solid);border:1px solid var(--line);border-radius:8px;box-sizing:border-box}
#welcome .eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim)}
#welcome h1{margin:8px 0 2px;font-size:34px;line-height:1.1;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
#welcome .unit{font-family:var(--mono);font-size:15px;color:var(--ink-dim)}
#welcome dl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#welcome dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim)}
#welcome dd{margin:3px 0 0;font-size:15px;font-weight:600}
#welcome .go{display:flex;flex-direction:column;gap:8px}
#welcome .go button{padding:13px 16px;font-size:15px}
#welcome .note{margin:14px 0 0;font-size:12px;color:var(--ink-dim);line-height:1.5}
#err{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#1a2224;color:var(--ink);font-size:15px;line-height:1.5}
@media (max-width:560px){#dock #help{display:none}#hud{top:calc(58px + env(safe-area-inset-top,0px));max-width:calc(100% - 60px)}#top button{padding:8px 10px;font-size:12.5px}#welcome h1{font-size:28px}#tourCard{bottom:calc(150px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){#view,#tourCard,#welcome{transition:none}}
</style>
</head>
<body>
<canvas id="view" tabindex="0" aria-label="3D walkthrough of Flat E-1303"></canvas>
<div id="hud" class="panel"><div class="flat" id="hudFlat">Flat E-1303</div><div class="room" id="roomName">Foyer</div><div class="size" id="roomSize"></div></div>
<div id="top">
  <div id="levelBox" hidden></div>
  <button id="tourBtn" type="button" class="primary">Start tour</button>
  <button id="viewBtn" type="button">Dollhouse view</button>
  <button id="muteBtn" type="button" aria-pressed="false">Music on</button>
</div>
<div id="tourCard" class="panel" aria-live="polite"><div class="n" id="tcName"></div><div class="a" id="tcArea"></div><div class="p" id="tcPoint"></div></div>
<div id="dock">
  <div id="help" class="panel"></div>
  <div class="row"><div id="timeBox" class="panel"><label for="timeRange">Time of day</label>
    <input id="timeRange" type="range" min="7" max="21" step="0.05" value="9.5"><span id="timeLabel"></span></div>
  <div id="styleBox" class="panel"><span>Style</span></div></div>
</div>
<div id="welcome"><div class="card">
  <div class="eyebrow">3D home tour</div>
  <h1 id="wName"></h1>
  <div class="unit" id="wUnit"></div>
  <dl><div><dt>Type</dt><dd>2 BHK</dd></div><div><dt>Carpet area</dt><dd id="wArea"></dd></div><div><dt>Main door</dt><dd>East</dd></div></dl>
  <div class="go"><button id="startTourBtn" type="button" class="primary">Start guided tour</button>
  <button id="startWalkBtn" type="button">Explore on my own</button></div>
  <p class="note">The guided tour takes about two minutes and plays soft music. You can stop it at any time and walk around yourself.</p>
</div></div>
<div id="err" hidden>The 3D library could not load. Check the internet connection and reload this page.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
if(!window.THREE){document.getElementById('err').hidden=false;document.getElementById('welcome').hidden=true;return;}
var T=THREE,PI=Math.PI;
/* ---------- project details: edit these two lines for another client ---------- */
var PROJECT='Shypram Parisar', UNIT='Flat E-1303 · 13th floor · Ahmedabad';
var LEVELS=[{name:'13th floor'}];          // a level switch appears only when there is more than one
var H=2.845;                               // clear ceiling height, 9'4"
var EYE=1.55, RADIUS=0.2;
function $(id){return document.getElementById(id);}

/* ---------- renderer ---------- */
var canvas=$('view');
var isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
var renderer=new T.WebGLRenderer({canvas:canvas,antialias:true,powerPreference:'high-performance'});
var Q={dpr:Math.min(window.devicePixelRatio||1,isTouch?1.5:1.75),ema:16,n:0,lock:false};
renderer.setPixelRatio(Q.dpr);
renderer.outputEncoding=T.sRGBEncoding;
renderer.toneMapping=T.ACESFilmicToneMapping;
renderer.toneMappingExposure=0.92;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=T.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate=false;       // the home is static: shadows are redrawn only when the sun moves
var ANISO=Math.min(8,renderer.capabilities.getMaxAnisotropy());

var scene=new T.Scene();
scene.fog=new T.Fog(0xdde8f0,70,330);
var world=new T.Group();scene.add(world);
var roof=new T.Group();scene.add(roof);      // ceiling, beams, ceiling lights: hidden in dollhouse view
var flat=new T.Group();scene.add(flat);      // rugs and floor finishes lying on the marble
var labels=new T.Group();labels.visible=false;scene.add(labels);
var need=3;function inval(n){need=Math.max(need,n||2);}

/* ---------- helpers ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function col(hex){return new T.Color(hex).convertSRGBToLinear();}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function smooth(a,b,x){var t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);}
function mix(a,b,t){return a+(b-a)*t;}
function canvasTex(w,h,draw,mw,mh){
  var c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  var t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;t.anisotropy=ANISO;
  if(mw){t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(1/mw,1/mh);}
  return t;
}

/* ---------- procedural textures (repeating ones are sized in metres) ---------- */
function veined(g,x0,y0,w,h,R,nv,strong){
  var i,k;g.save();g.beginPath();g.rect(x0,y0,w,h);g.clip();
  var b=243+(R()*6|0);g.fillStyle='rgb('+b+','+b+','+(b-2)+')';g.fillRect(x0,y0,w,h);
  for(i=0;i<14;i++){var cx=x0+R()*w,cy=y0+R()*h,r=(120+R()*260)*w/512,a=0.05+R()*0.08;
    var gr=g.createRadialGradient(cx,cy,0,cx,cy,r);gr.addColorStop(0,'rgba(150,155,165,'+a+')');gr.addColorStop(1,'rgba(150,155,165,0)');
    g.fillStyle=gr;g.fillRect(x0,y0,w,h);}
  var base=R()*PI;
  for(i=0;i<nv;i++){var x=x0+R()*w,y=y0+R()*h,ang=base+(R()-0.5)*1.2,len=25+(R()*45|0),wd=0.6+R()*R()*3.2,al=(0.22+R()*0.3)*strong;
    g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(x,y);
    for(k=0;k<len;k++){ang+=(R()-0.5)*0.55;x+=Math.cos(ang)*22;y+=Math.sin(ang)*22;g.lineTo(x,y);}
    g.strokeStyle='rgba(140,144,152,'+(al*0.22)+')';g.lineWidth=wd*6;g.stroke();
    g.strokeStyle='rgba(118,122,130,'+al+')';g.lineWidth=wd;g.stroke();}
  g.restore();
}
// White marble-look tile, 2' x 4' (0.61 x 1.22 m). The canvas holds 4 different tiles.
var marbleTex=canvasTex(1024,2048,function(g){var R=rng(11);
  for(var ty=0;ty<2;ty++)for(var tx=0;tx<2;tx++){veined(g,tx*512,ty*1024,512,1024,R,8,1);
    g.strokeStyle='rgba(178,175,168,0.95)';g.lineWidth=3;g.strokeRect(tx*512+0.5,ty*1024+0.5,511,1023);}
},1.22,2.44);
var stoneTex=canvasTex(1024,1024,function(g){veined(g,0,0,1024,1024,rng(31),9,0.8);},2.4,2.4);
function woodDraw(g,w,h){
  var R=rng(5),i,x,y;g.fillStyle='#ece5d9';g.fillRect(0,0,w,h);
  for(y=0;y<h;){var bh=36+R()*60;g.fillStyle='rgba(120,80,40,'+(R()*0.12)+')';g.fillRect(0,y,w,bh);y+=bh;}
  for(i=0;i<900;i++){var y0=R()*h,a=0.03+R()*0.11,amp=0.6+R()*3.2,ph=R()*6.283,f=1+(i%3);
    g.strokeStyle='rgba(72,44,20,'+a+')';g.lineWidth=0.4+R()*1.3;g.beginPath();
    for(x=0;x<=w;x+=16){var yy=y0+Math.sin(x/w*6.283*f+ph)*amp;if(x)g.lineTo(x,yy);else g.moveTo(x,yy);}g.stroke();}
  for(i=0;i<6;i++){var cx=R()*w,cy=R()*h;for(var k=0;k<8;k++){g.strokeStyle='rgba(72,44,20,0.07)';g.lineWidth=1.1;
    g.beginPath();g.ellipse(cx,cy,50+k*28,4+k*4.5,0,0,6.283);g.stroke();}}
}
var woodTex=canvasTex(512,512,woodDraw,0.9,0.9);
var woodTexV=canvasTex(512,512,woodDraw,0.9,0.9);woodTexV.rotation=PI/2;
function gridTex(px,line,speck,mw,mh,seed){return canvasTex(px,px,function(g,w,h){var R=rng(seed);g.fillStyle='#fff';g.fillRect(0,0,w,h);
  for(var i=0;i<speck;i++){g.fillStyle='rgba(60,64,70,'+(R()*0.07)+')';g.fillRect(R()*w,R()*h,2+R()*3,2+R()*3);}
  g.strokeStyle='rgba(120,124,130,0.85)';g.lineWidth=line;g.strokeRect(0,0,w,h);},mw,mh);}
var wallTileTex=gridTex(256,3,0,0.6,1.2,1);
var antiSkidTex=gridTex(256,5,900,0.3,0.3,2);
var fabricTex=canvasTex(64,64,function(g,w,h){var R=rng(9);
  for(var y=0;y<h;y+=4)for(var x=0;x<w;x+=4){var v=((x+y)/4%2?232:252)-(R()*14|0);g.fillStyle='rgb('+v+','+v+','+v+')';g.fillRect(x,y,4,4);}
},0.05,0.05);
function rugDraw(kind){return function(g,w,h){var R=rng(40+kind),i;g.fillStyle='#fff';g.fillRect(0,0,w,h);
  for(i=0;i<h;i+=3){g.fillStyle='rgba(0,0,0,'+(0.02+R()*0.06)+')';g.fillRect(0,i,w,1.5);}
  g.strokeStyle='rgba(40,44,46,0.33)';g.lineWidth=3;
  if(kind===0){g.strokeRect(22,22,w-44,h-44);g.lineWidth=1.5;g.strokeRect(34,34,w-68,h-68);
    for(i=0;i<7;i++){g.strokeStyle='rgba(40,44,46,'+(0.10+R()*0.14)+')';g.lineWidth=2+R()*5;g.beginPath();g.arc(R()*w,R()*h,60+R()*220,R()*6,R()*6+1.2+R()*2);g.stroke();}}
  else{for(i=-h;i<w;i+=46){g.beginPath();g.moveTo(i,0);g.lineTo(i+h,h);g.stroke();g.beginPath();g.moveTo(i+h,0);g.lineTo(i,h);g.stroke();}
    g.fillStyle='rgba(255,255,255,1)';g.fillRect(0,0,w,16);g.fillRect(0,h-16,w,16);g.fillRect(0,0,16,h);g.fillRect(w-16,0,16,h);}
  for(i=0;i<w;i+=5){g.fillStyle='rgba(0,0,0,0.25)';g.fillRect(i,0,2,5);g.fillRect(i,h-5,2,5);}
};}
var rugTex=[canvasTex(512,512,rugDraw(0)),canvasTex(512,512,rugDraw(1))];
var glowTex=canvasTex(128,128,function(g){var gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.18,'rgba(255,255,255,0.55)');gr.addColorStop(0.5,'rgba(255,255,255,0.13)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);});
// plant leaves, drawn with transparency
var leafTex=canvasTex(128,192,function(g){
  var gr=g.createLinearGradient(0,0,128,0);gr.addColorStop(0,'#2f6331');gr.addColorStop(0.5,'#46853f');gr.addColorStop(1,'#2c5c2e');
  g.fillStyle=gr;g.beginPath();g.moveTo(64,190);g.bezierCurveTo(-6,150,6,46,64,3);g.bezierCurveTo(122,46,134,150,64,190);g.fill();
  g.strokeStyle='rgba(170,205,140,0.8)';g.lineWidth=2.4;g.beginPath();g.moveTo(64,190);g.lineTo(64,8);g.stroke();
  g.lineWidth=1;for(var y=165;y>30;y-=17){g.beginPath();g.moveTo(64,y);g.quadraticCurveTo(40,y-10,18+(165-y)*0.12,y-22);g.stroke();
    g.beginPath();g.moveTo(64,y);g.quadraticCurveTo(88,y-10,110-(165-y)*0.12,y-22);g.stroke();}});
var frondTex=canvasTex(160,512,function(g){var R=rng(3);
  g.strokeStyle='#6c9a4e';g.lineWidth=3;g.beginPath();g.moveTo(80,512);g.lineTo(80,8);g.stroke();
  for(var y=470;y>14;y-=11){var t=1-y/512,len=(18+62*Math.sin(PI*Math.min(1,t*1.15)))*(0.9+R()*0.2);
    for(var s=-1;s<=1;s+=2){g.fillStyle='rgb('+(60+R()*24|0)+','+(128+R()*30|0)+','+(58+R()*16|0)+')';
      g.beginPath();g.moveTo(80,y);g.quadraticCurveTo(80+s*len*0.5,y-len*0.34-5,80+s*len,y-len*0.5);g.quadraticCurveTo(80+s*len*0.5,y-len*0.16+3,80,y);g.fill();}}});
var bladeTex=canvasTex(64,512,function(g){var R=rng(6);
  g.beginPath();g.moveTo(32,3);g.bezierCurveTo(3,250,6,470,18,511);g.lineTo(46,511);g.bezierCurveTo(58,470,61,250,32,3);g.closePath();
  g.fillStyle='#2f5f3a';g.fill();g.save();g.clip();
  for(var y=10;y<512;y+=9+R()*10){g.strokeStyle='rgba(150,186,140,'+(0.25+R()*0.3)+')';g.lineWidth=2+R()*4;g.beginPath();g.moveTo(0,y);g.quadraticCurveTo(32,y-6+R()*12,64,y+R()*5);g.stroke();}
  g.restore();g.strokeStyle='rgba(214,200,112,0.95)';g.lineWidth=3.5;g.stroke();});
// wall art: six compositions, redrawn in each style's palette
function artTex(kind,p){return canvasTex(256,320,function(g,w,h){var i;g.fillStyle=p[0];g.fillRect(0,0,w,h);g.lineCap='round';
  if(kind===0){g.fillStyle=p[1];g.beginPath();g.arc(128,226,84,PI,0);g.fill();g.fillStyle=p[2];g.beginPath();g.arc(128,226,50,PI,0);g.fill();
    g.fillStyle=p[3];g.beginPath();g.arc(182,92,30,0,6.3);g.fill();g.strokeStyle=p[4];g.lineWidth=2;g.beginPath();g.moveTo(34,238);g.lineTo(222,238);g.stroke();}
  else if(kind===1){g.fillStyle=p[2];g.fillRect(36,40,108,150);g.fillStyle=p[1];g.fillRect(112,128,112,150);g.fillStyle=p[3];g.fillRect(60,214,70,60);
    g.strokeStyle=p[4];g.lineWidth=2;g.strokeRect(150,54,62,52);}
  else if(kind===2){g.fillStyle=p[2];g.fillRect(0,170,w,150);g.fillStyle=p[1];g.fillRect(0,214,w,106);g.fillStyle=p[3];g.beginPath();g.arc(128,150,44,0,6.3);g.fill();
    g.strokeStyle=p[4];g.lineWidth=1.5;for(i=0;i<5;i++){g.beginPath();g.moveTo(20,232+i*16);g.lineTo(236,232+i*16);g.stroke();}}
  else if(kind===3){g.strokeStyle=p[4];g.lineWidth=2.5;g.beginPath();g.moveTo(128,296);g.bezierCurveTo(120,220,140,140,124,40);g.stroke();
    for(i=0;i<7;i++){var y=262-i*32,s=i%2?1:-1;g.fillStyle=i%3?p[1]:p[3];g.beginPath();g.moveTo(127,y);g.quadraticCurveTo(127+s*52,y-34,127+s*70,y-56);g.quadraticCurveTo(127+s*22,y-48,127,y);g.fill();}}
  else if(kind===4){var cs=[p[2],p[1],p[4]];for(i=0;i<3;i++){g.fillStyle=cs[i];g.beginPath();g.moveTo(0,320);g.lineTo(0,190+i*36);

/* ---------- merge the static home into a few large meshes (keeps it fast on a laptop) ---------- */
function mergeGroup(root){
  root.updateMatrixWorld(true);var buckets={},list=[],v=new T.Vector3(),nm=new T.Matrix3();
  root.traverse(function(m){if(m.isMesh)list.push(m);});
  list.forEach(function(m){
    var g=m.geometry,idx=g.index?g.index.array:null,pos=g.attributes.position,nor=g.attributes.normal,uv=g.attributes.uv;
    nm.getNormalMatrix(m.matrixWorld);
    function add(mat,start,count){
      var key=mat.uuid+(m.castShadow?'c':'n'),b=buckets[key]||(buckets[key]={mat:mat,cast:m.castShadow,p:[],n:[],u:[]});
      for(var i=start;i<start+count;i++){var vi=idx?idx[i]:i;
        v.fromBufferAttribute(pos,vi).applyMatrix4(m.matrixWorld);b.p.push(v.x,v.y,v.z);
        v.fromBufferAttribute(nor,vi).applyMatrix3(nm).normalize();b.n.push(v.x,v.y,v.z);
        b.u.push(uv?uv.getX(vi):0,uv?uv.getY(vi):0);}
    }
    var total=idx?idx.length:pos.count;
    if(Array.isArray(m.material)){if(g.groups.length)g.groups.forEach(function(gr){add(m.material[gr.materialIndex],gr.start,gr.count);});else add(m.material[0],0,total);}
    else add(m.material,0,total);
    m.parent.remove(m);g.dispose();
  });
  var tris=0;
  Object.keys(buckets).forEach(function(k){var b=buckets[k],g=new T.BufferGeometry();
    g.setAttribute('position',new T.Float32BufferAttribute(b.p,3));g.setAttribute('normal',new T.Float32BufferAttribute(b.n,3));g.setAttribute('uv',new T.Float32BufferAttribute(b.u,2));
    var m=new T.Mesh(g,b.mat);m.castShadow=b.cast;m.receiveShadow=true;if(b.mat.userData.depth)m.customDepthMaterial=b.mat.userData.depth;
    if(b.mat.transparent)m.renderOrder=2;root.add(m);tris+=b.p.length/9;});
  return tris;
}

      if(len>0.01){if(len>1){f/=len;s/=len;}
        var sp=(keys.ShiftLeft||keys.ShiftRight?3.2:1.7)*dt,sy=Math.sin(player.yaw),cy=Math.cos(player.yaw),dx=(-sy*f+cy*s)*sp,dz=(-cy*f-sy*s)*sp;
        if(!blocked(player.x+dx,player.z))player.x+=dx;if(!blocked(player.x,player.z+dz))player.z+=dz;moving=true;}
    }
    cam.position.set(player.x,EYE,player.z);cam.rotation.set(player.pitch,player.yaw,0);updateHud();
  }else{
    var r=orbit.r*orbit.fit/17,sp2=Math.sin(orbit.phi);
    v3a.set(orbit.tx+r*sp2*Math.sin(orbit.theta),r*Math.cos(orbit.phi),orbit.tz+r*sp2*Math.cos(orbit.theta));v3b.set(orbit.tx,0.6,orbit.tz);
    if(rise){rise.t=Math.min(1,rise.t+dt/4.5);var e=rise.t*rise.t*(3-2*rise.t);
      dcam.position.copy(rise.from).lerp(v3a,e);v3b.copy(rise.look).lerp(v3b,Math.min(1,e*1.6));moving=true;
      if(rise.t>=1){rise=null;labels.visible=true;marker.visible=true;}}
    else dcam.position.copy(v3a);
    dcam.up.set(0,1,0);dcam.lookAt(v3b);marker.position.set(player.x,0,player.z);marker.rotation.y=player.yaw;
  }
}
var lastT=0;
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,clock.getDelta());step(dt);
  if(!moving&&need<=0){lastT=0;return;}
  if(need>0)need--;
  var c=mode==='walk'?cam:dcam;c.updateMatrixWorld();sky.position.copy(c.position);
  var useRefl=refl.on&&mode==='walk';refl.u.uReflStr.value=useRefl?0.45:0;
  if(useRefl)renderReflection(c);
  renderer.render(scene,c);
  if(moving&&lastT&&!Q.lock){                      // step quality down if the laptop is struggling
    Q.ema=Q.ema*0.92+(now-lastT)*0.08;Q.n++;
    if(Q.n>50&&Q.ema>38){if(Q.dpr>1){Q.dpr=Math.max(1,Q.dpr-0.25);resize();}else if(refl.on){refl.on=false;}else if(Q.dpr>0.75){Q.dpr=0.75;resize();}Q.n=0;Q.ema=22;}
  }
  lastT=moving?now:0;
}
applyStyle(0,true);setMode('walk');resize();updateHud();
window.flatTour={blocked:blocked,go:function(x,z,yawDeg,pitchDeg){stopTour();player.x=x;player.z=z;if(yawDeg!=null)player.yaw=yawDeg*D2R;if(pitchDeg!=null)player.pitch=pitchDeg*D2R;inval(4);},
  mode:function(m){rise=null;setMode(m);},orbit:orbit,time:function(h){timeTarget=timeShown=h;$('timeRange').value=h;applyTime(h);},style:function(i){applyStyle(i,true);},
  start:function(){$('welcome').hidden=true;},lockQuality:function(){Q.lock=true;},tour:TOUR,rooms:ROOMS,startTour:startTour,skipTo:function(i){tour.i=i;tour.held=false;},info:function(){return{tris:triCount,calls:renderer.info.render.calls,dpr:Q.dpr,refl:refl.on};},inval:inval};
requestAnimationFrame(frame);
})();
</script>
