<title>મંદિર માપ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;600;700&display=swap">
<style>
/* Layout: one column. Total on top, drawing with part boxes, editor for the tapped part, parts table. */
:root{--bg:#f6f6f4;--panel:#ffffff;--ink:#141414;--mute:#6a6a66;--line:#dcdcd6;--accent:#141414;--accent-ink:#ffffff;--box:#d6204f;--warn-bg:#fff4cf;--warn-ink:#5c4300;--font:'Noto Sans Gujarati',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101112;--panel:#1a1c1e;--ink:#f0f0ec;--mute:#9a9a94;--line:#303336;--accent:#f0f0ec;--accent-ink:#101112;--box:#ff5c85;--warn-bg:#3a3012;--warn-ink:#f3dc9b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101112;--panel:#1a1c1e;--ink:#f0f0ec;--mute:#9a9a94;--line:#303336;--accent:#f0f0ec;--accent-ink:#101112;--box:#ff5c85;--warn-bg:#3a3012;--warn-ink:#f3dc9b;color-scheme:dark}
:root[data-pal="safed"]{--bg:#ffffff;--panel:#f3f3f1;--ink:#141414;--mute:#6a6a66;--line:#dcdcd6;--accent:#141414;--accent-ink:#fff;--box:#d6204f;--warn-bg:#fff4cf;--warn-ink:#5c4300;color-scheme:light}
:root[data-pal="kalo"]{--bg:#000000;--panel:#161616;--ink:#f2f2f2;--mute:#9a9a9a;--line:#333;--accent:#f2f2f2;--accent-ink:#000;--box:#ff5c85;--warn-bg:#3a3012;--warn-ink:#f3dc9b;color-scheme:dark}
:root[data-pal="lakdu"]{--bg:#2a1d14;--panel:#3a291d;--ink:#f3e6d6;--mute:#c2a98d;--line:#5a4230;--accent:#e9c48f;--accent-ink:#2a1d14;--box:#7fe0c0;--warn-bg:#5a4230;--warn-ink:#f3e6d6;color-scheme:dark}
:root[data-pal="lilo"]{--bg:#eef3ee;--panel:#ffffff;--ink:#12261b;--mute:#587062;--line:#cfdcd2;--accent:#1f6b43;--accent-ink:#fff;--box:#c2410c;--warn-bg:#fff4cf;--warn-ink:#5c4300;color-scheme:light}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--font);padding-inline:16px;padding-block:18px}
main{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font:700 1.7rem/1.3 var(--font);margin:0}
h2{font:700 1rem/1.3 var(--font);margin:0 0 10px}
p{margin:0}.sub{color:var(--mute);font-size:.9rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pal{display:flex;gap:8px;flex-shrink:0;padding-top:6px}
.pal button{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);padding:0}
.pal button[aria-pressed=true]{border-color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px;min-width:0}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mute)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;box-sizing:border-box;min-width:0}
input[type=range]{padding:0}
button.b{font:600 1rem var(--font);background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px 14px;cursor:pointer}
button.b.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.b.on{outline:3px solid var(--box)}
:focus-visible{outline:2px solid var(--box);outline-offset:2px}
.total{font:700 2.3rem/1.15 var(--font);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:10px}
.k{font-size:.8rem;color:var(--mute)}.v{font-size:1.1rem;font-weight:600;font-variant-numeric:tabular-nums}
.note{background:var(--warn-bg);color:var(--warn-ink);border-radius:8px;padding:10px 12px;font-size:.9rem}
.zoomwrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff;max-height:78vh}
#stage{position:relative;width:100%}
#img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
#ov{position:absolute;inset:0}
#ov.draw{touch-action:none;cursor:crosshair;background:rgba(0,0,0,.04)}
.box{position:absolute;border:1.5px solid var(--box);background:color-mix(in srgb,var(--box) 8%,transparent);box-sizing:border-box}
#ov.draw .box{pointer-events:none}
.box.sel{border-width:3px;background:color-mix(in srgb,var(--box) 18%,transparent);touch-action:none}
.box i{position:absolute;left:0;top:0;background:var(--box);color:#fff;font:600 11px/1 var(--font);font-style:normal;padding:2px 5px}
.h{position:absolute;width:26px;height:26px;background:var(--box);border-radius:50%;touch-action:none;border:2px solid #fff;box-sizing:border-box}
.h.tl{left:-13px;top:-13px}.h.br{right:-13px;bottom:-13px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600}
tbody tr{cursor:pointer}tbody tr.sel{background:color-mix(in srgb,var(--box) 14%,transparent)}
td.n{white-space:normal;min-width:9rem}
td.r,th.r{text-align:right}
</style>
<main>
<header class="top"><div><h1>મંદિર માપ</h1><p class="sub">મંદિરના દરેક ભાગનું માપ અને લાકડું ઘન ફૂટમાં</p></div>
<div class="pal" id="pal" aria-label="રંગ પસંદ કરો"></div></header>

<section class="panel hero"><p class="k">કુલ લાકડું (બધા ભાગ)</p><p class="total" id="tot">-</p>
<div class="grid" id="tgrid"></div></section>

<div id="notes" style="display:contents"></div>

<section class="panel">
<h2>ડ્રોઇંગ</h2>
<div class="row" style="margin-bottom:10px">
<button class="b" id="open" type="button">DXF / PDF / ફોટો ખોલો</button>
<button class="b alt" id="draw" type="button">નવો ભાગ દોરો</button>
<button class="b alt" id="demo" type="button">રાજકોટ મંદિર ડ્રોઇંગ</button>
</div>
<input id="file" type="file" hidden>
<label style="margin-bottom:10px">ઝૂમ <input id="zoom" type="range" min="100" max="300" value="100"></label>
<div class="zoomwrap"><div id="stage"><img id="img" alt="મંદિરનું ડ્રોઇંગ"><div id="ov"></div></div></div>
<p class="sub" style="margin-top:8px">લાલ ચોકઠા પર ટેપ કરો, પછી ખૂણાના ગોળ બટનથી ખેંચીને બરાબર બેસાડો.</p>
</section>

<section class="panel" id="editor"></section>

<section class="panel">
<h2>માપ (સ્કેલ) સેટ કરો</h2>
<p class="sub" id="scaleinfo" style="margin-bottom:10px"></p>
<div class="row">
<label>જે ભાગની અસલી પહોળાઈ ખબર છે<select id="refpart"></select></label>
<label>તેની અસલી પહોળાઈ (ઇંચ)<input id="refval" type="number" inputmode="decimal" step="any"></label>
</div>
<button class="b" id="setscale" type="button" style="margin-top:10px;width:100%">સ્કેલ સેટ કરો</button>
</section>

<section class="panel"><h2>બધા ભાગ</h2><div class="tw" id="list"></div>
<div class="row" style="margin-top:12px"><button class="b" id="copy" type="button">રિપોર્ટ કોપી કરો</button></div></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const BUILTIN="__IMG__";
const BW=1242,BH=1557;
const FT={mm:0.00328084,cm:0.0328084,m:3.28084,in:1/12,ft:1};
const UCODE={1:'in',2:'ft',4:'mm',5:'cm',6:'m'};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f2=x=>(Math.round(x*100)/100).toLocaleString('en-IN');
const f1=x=>(Math.round(x*10)/10).toLocaleString('en-IN');

/* example parts for the Rajkot drawing: x,y,w,h in image pixels. Depth/fill are example guesses. */
const DEMO=[
["મોર અને ઉપરનું શિખર",192,93,855,270,2,60,'solid',0],
["ઉપરની છત પટ્ટી",132,364,977,42,12,100,'solid',0],
["ડાબો થાંભલો (ઉપરનો નકશીદાર ભાગ)",207,394,66,255,2.5,70,'solid',0],
["જમણો થાંભલો (ઉપરનો નકશીદાર ભાગ)",969,394,66,255,2.5,70,'solid',0],
["તોરણ (કમાન)",270,424,703,225,2,60,'solid',0],
["ડાબી થાંભલી",210,649,63,376,2.5,100,'solid',0],
["જમણી થાંભલી",969,649,66,376,2.5,100,'solid',0],
["વચ્ચેની જાળી (ફૂલ)",463,565,315,309,1,55,'solid',0],
["નીચેની વેલ",472,886,293,98,1,55,'solid',0],
["ડાબો હાથી",141,1022,195,218,5,80,'solid',0],
["જમણો હાથી",905,1022,195,218,5,80,'solid',0],
["નીચેની કોતરણી પટ્ટી",144,1244,953,96,1.5,60,'solid',0],
["સ્ટોરેજ ખાનું (5 પાટિયા)",132,1345,978,128,12,100,'box',0.75],
["ડાબું ડ્રોઅર",147,1360,464,98,10,100,'box',0.5],
["જમણું ડ્રોઅર",630,1360,464,98,10,100,'box',0.5],
["પાયાની પટ્ટી",120,1472,1001,20,12.5,100,'solid',0]];
const mk=a=>({id:Math.random().toString(36).slice(2),name:a[0],x:a[1],y:a[2],w:a[3],h:a[4],depth:a[5],fill:a[6],kind:a[7],t:a[8]});

const S={src:BUILTIN,w:BW,h:BH,parts:DEMO.map(mk),sel:null,s:30/977,ref:null,refval:30,example:true,note:''};
S.ref=S.parts[1].id;S.sel=S.parts[1].id;

function wood(p){
  const W=p.w*S.s,H=p.h*S.s,D=p.depth;
  if(p.kind==='box'){const t=p.t,out=W*H*D,inn=Math.max(0,W-2*t)*Math.max(0,H-2*t)*Math.max(0,D-t);return {W,H,D,out:out/1728,wood:(out-inn)/1728}}
  return {W,H,D,out:W*H*D/1728,wood:W*H*D*p.fill/100/1728};
}
const cur=()=>S.parts.find(p=>p.id===S.sel);

/* ---------- persistence ---------- */
function save(){try{if(S.example)localStorage.setItem('mandir-v3',JSON.stringify({parts:S.parts,s:S.s,ref:S.ref,refval:S.refval}))}catch(e){}}
function load(){try{const j=JSON.parse(localStorage.getItem('mandir-v3')||'null');if(j&&j.parts&&j.parts.length){S.parts=j.parts;S.s=j.s;S.ref=j.ref;S.refval=j.refval;S.sel=S.parts[0].id}}catch(e){}}

/* ---------- palette ---------- */
const PALS=[['','સિસ્ટમ','linear-gradient(90deg,#fff 50%,#111 50%)'],['safed','સફેદ','#ffffff'],['kalo','કાળો','#000000'],['lakdu','લાકડું','#7a4a26'],['lilo','લીલો','#1f6b43']];
function setPal(p){const r=document.documentElement;if(p)r.setAttribute('data-pal',p);else r.removeAttribute('data-pal');try{localStorage.setItem('mandir-pal',p)}catch(e){}
  document.querySelectorAll('#pal button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===p))}
$('#pal').innerHTML=PALS.map(p=>`<button type="button" data-p="${p[0]}" title="${p[1]}" aria-label="${p[1]}" style="background:${p[2]}"></button>`).join('');
$('#pal').onclick=e=>{const b=e.target.closest('button');if(b)setPal(b.dataset.p)};
try{setPal(localStorage.getItem('mandir-pal')||'')}catch(e){setPal('')}

/* ---------- drawing + boxes ---------- */
const ov=$('#ov'),img=$('#img');
function setImage(){img.src=S.src}
function pos(e){const r=ov.getBoundingClientRect();return [(e.clientX-r.left)/r.width*S.w,(e.clientY-r.top)/r.height*S.h]}
function placeBox(el,p){el.style.left=p.x/S.w*100+'%';el.style.top=p.y/S.h*100+'%';el.style.width=p.w/S.w*100+'%';el.style.height=p.h/S.h*100+'%'}
function drawBoxes(){
  ov.innerHTML='';
  S.parts.forEach((p,i)=>{
    const d=document.createElement('div');d.className='box'+(p.id===S.sel?' sel':'');d.dataset.id=p.id;placeBox(d,p);
    d.innerHTML=`<i>${i+1}</i>`+(p.id===S.sel?'<span class="h tl" data-m="tl"></span><span class="h br" data-m="br"></span>':'');
    ov.appendChild(d);
  });
}
let drag=null;
ov.addEventListener('pointerdown',e=>{
  if(drawMode){const [x,y]=pos(e);drag={m:'new',x0:x,y0:y,el:document.createElement('div')};drag.el.className='box sel';ov.appendChild(drag.el);ov.setPointerCapture(e.pointerId);e.preventDefault();return}
  const h=e.target.closest('.h'),b=e.target.closest('.box');if(!b)return;
  const p=S.parts.find(q=>q.id===b.dataset.id);
  if(p.id!==S.sel){select(p.id);return}
  const [x,y]=pos(e);drag={m:h?h.dataset.m:'mv',p,x0:x,y0:y,o:{...p}};ov.setPointerCapture(e.pointerId);e.preventDefault();
});
ov.addEventListener('pointermove',e=>{
  if(!drag)return;const [x,y]=pos(e);
  if(drag.m==='new'){const p={x:Math.min(x,drag.x0),y:Math.min(y,drag.y0),w:Math.abs(x-drag.x0),h:Math.abs(y-drag.y0)};placeBox(drag.el,p);drag.r=p;return}
  const p=drag.p,o=drag.o,dx=x-drag.x0,dy=y-drag.y0;
  if(drag.m==='mv'){p.x=o.x+dx;p.y=o.y+dy}
  else if(drag.m==='br'){p.w=Math.max(6,o.w+dx);p.h=Math.max(6,o.h+dy)}
  else{p.x=Math.min(o.x+dx,o.x+o.w-6);p.y=Math.min(o.y+dy,o.y+o.h-6);p.w=Math.max(6,o.w-dx);p.h=Math.max(6,o.h-dy)}
  const el=ov.querySelector('.box.sel');if(el)placeBox(el,p);refresh(true);
});
function endDrag(){
  if(!drag)return;
  if(drag.m==='new'){const r=drag.r;drag.el.remove();
    if(r&&r.w>8&&r.h>8){const p=mk(['નવો ભાગ '+(S.parts.length+1),r.x,r.y,r.w,r.h,2,100,'solid',0]);S.parts.push(p);S.sel=p.id;setDraw(false);full()}}
  drag=null;save();
}
ov.addEventListener('pointerup',endDrag);ov.addEventListener('pointercancel',endDrag);
let drawMode=false;
function setDraw(v){drawMode=v;ov.classList.toggle('draw',v);$('#draw').classList.toggle('on',v);$('#draw').textContent=v?'ડ્રોઇંગ પર ખેંચીને ચોકઠું બનાવો':'નવો ભાગ દોરો'}
$('#draw').onclick=()=>setDraw(!drawMode);
$('#zoom').oninput=e=>{$('#stage').style.width=e.target.value+'%'};

/* ---------- panels ---------- */
function select(id){S.sel=id;full()}
function totals(){
  let v=0,x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,d=0;
  S.parts.forEach(p=>{v+=wood(p).wood;x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x+p.w);y1=Math.max(y1,p.y+p.h);d=Math.max(d,p.depth)});
  return S.parts.length?{v,W:(x1-x0)*S.s,H:(y1-y0)*S.s,D:d}:{v:0,W:0,H:0,D:0};
}
function renderTotals(){
  const t=totals();$('#tot').textContent=f2(t.v)+' ઘન ફૂટ';
  $('#tgrid').innerHTML=`<div><div class="k">આખા મંદિરની પહોળાઈ</div><div class="v">${f1(t.W)}″ (${f2(t.W/12)} ફૂટ)</div></div>
  <div><div class="k">ઊંચાઈ</div><div class="v">${f1(t.H)}″ (${f2(t.H/12)} ફૂટ)</div></div>
  <div><div class="k">ઊંડાઈ (સૌથી વધુ)</div><div class="v">${f1(t.D)}″</div></div>
  <div><div class="k">બાઉન્ડિંગ બોક્સ</div><div class="v">${f2(t.W*t.H*t.D/1728)} ઘન ફૂટ</div></div>`;
  $('#notes').innerHTML=(S.example?'<div class="note">આ રાજકોટ મંદિરનું ડ્રોઇંગ ઉદાહરણ તરીકે છે. ડ્રોઇંગમાં માપ લખેલા નથી, એટલે પહોળાઈ 30″ અને ઊંડાઈ-જાડાઈ અંદાજથી મૂકી છે. નીચે સાચા માપ ભરો.</div>':'')+(S.note?`<div class="note">${esc(S.note)}</div>`:'');
  $('#scaleinfo').textContent=`અત્યારનો સ્કેલ: 1 પિક્સેલ = ${S.s.toFixed(4)} ઇંચ`+(S.fileScale?' (ફાઇલના એકમમાંથી મળ્યો)':'');
}
function renderList(){
  $('#list').innerHTML=`<table><thead><tr><th>#</th><th>ભાગ</th><th class="r">ઘન ફૂટ</th><th class="r">પહોળાઈ″</th><th class="r">ઊંચાઈ″</th><th class="r">ઊંડાઈ″</th></tr></thead><tbody>`+
  S.parts.map((p,i)=>{const w=wood(p);return `<tr data-id="${p.id}" class="${p.id===S.sel?'sel':''}"><td>${i+1}</td><td class="n">${esc(p.name)}</td><td class="r"><b>${f2(w.wood)}</b></td><td class="r">${f1(w.W)}</td><td class="r">${f1(w.H)}</td><td class="r">${f1(w.D)}</td></tr>`}).join('')+`</tbody></table>`;
  $('#refpart').innerHTML=S.parts.map(p=>`<option value="${p.id}"${p.id===S.ref?' selected':''}>${esc(p.name)}</option>`).join('');
  $('#refval').value=S.refval;
}
$('#list').onclick=e=>{const r=e.target.closest('tr[data-id]');if(r)select(r.dataset.id)};
function renderEditor(){
  const p=cur(),ed=$('#editor');
  if(!p){ed.innerHTML='<h2>ભાગ</h2><p class="sub">ડ્રોઇંગમાં કોઈ ચોકઠા પર ટેપ કરો અથવા “નવો ભાગ દોરો” દબાવો.</p>';return}
  const w=wood(p);
  ed.innerHTML=`<h2>પસંદ કરેલો ભાગ: ${S.parts.indexOf(p)+1}</h2>
  <div class="row">
   <label style="flex-basis:100%">નામ<input id="e-name" value="${esc(p.name)}"></label>
   <label>ઊંડાઈ (ઇંચ)<input id="e-depth" type="number" inputmode="decimal" step="any" value="${p.depth}"></label>
   <label>પ્રકાર<select id="e-kind"><option value="solid"${p.kind==='solid'?' selected':''}>ઠોસ લાકડું</option><option value="box"${p.kind==='box'?' selected':''}>ખાનું (પાટિયાનું)</option></select></label>
   <label id="l-fill">કોતરણી પછી લાકડું (%)<input id="e-fill" type="number" inputmode="decimal" step="any" value="${p.fill}"></label>
   <label id="l-t">પાટિયાની જાડાઈ (ઇંચ)<input id="e-t" type="number" inputmode="decimal" step="any" value="${p.t}"></label>
  </div>
  <div class="grid"><div><div class="k">પહોળાઈ</div><div class="v" id="o-w"></div></div><div><div class="k">ઊંચાઈ</div><div class="v" id="o-h"></div></div>
  <div><div class="k">આગળનો ભાગ</div><div class="v" id="o-a"></div></div><div><div class="k">લાકડું</div><div class="v" id="o-v"></div></div></div>
  <div class="row" style="margin-top:12px"><button class="b alt" id="e-del" type="button">આ ભાગ કાઢી નાખો</button></div>`;
  const num=id=>Math.max(0,parseFloat($(id).value)||0);
  $('#e-name').oninput=e=>{p.name=e.target.value;refresh()};
  $('#e-depth').oninput=()=>{p.depth=num('#e-depth');refresh()};
  $('#e-fill').oninput=()=>{p.fill=Math.min(100,num('#e-fill'));refresh()};
  $('#e-t').oninput=()=>{p.t=num('#e-t');refresh()};
  $('#e-kind').onchange=e=>{p.kind=e.target.value;if(p.kind==='box'&&!p.t)p.t=0.75;full()};
  $('#e-del').onclick=()=>{S.parts=S.parts.filter(q=>q!==p);S.sel=S.parts.length?S.parts[0].id:null;if(S.ref===p.id)S.ref=S.sel;full();save()};
  $('#l-fill').hidden=p.kind==='box';$('#l-t').hidden=p.kind!=='box';
  refresh(true);
}

function loadCanvas(c,inPerPx,note){
  S.src=c.toDataURL('image/png');S.w=c.width;S.h=c.height;S.parts=[];S.sel=null;S.example=false;S.ref=null;S.note=note||'';
  if(inPerPx){S.s=inPerPx;S.fileScale=true}else{S.s=0.03;S.fileScale=false}
  setImage();full();
}
function parseDxf(text){
  const L=text.split(/\r?\n/),pr=[];for(let i=0;i+1<L.length;i+=2)pr.push([parseInt(L[i].trim(),10),L[i+1].trim()]);
  const hdr={},ents=[];let sec='',cur=null,pv=null,poly=null;
  for(let i=0;i<pr.length;i++){const [c,v]=pr[i];
    if(c===0&&v==='SECTION'){sec=(pr[i+1]||[])[1];continue}
    if(c===0&&v==='ENDSEC'){cur=null;sec='';continue}
    if(sec==='HEADER'){if(c===9)pv=v;else if(pv&&c===70){hdr[pv]=+v;pv=null}continue}
    if(sec!=='ENTITIES')continue;
    if(c===0){
      if(v==='VERTEX'&&poly){cur={t:'VERTEX',x:[],y:[]};poly.verts.push(cur);continue}
      if(v==='SEQEND'){poly=null;cur=null;continue}
      cur={t:v,x:[],y:[],flags:0};if(v==='POLYLINE'){poly=cur;cur.verts=[]}ents.push(cur);continue}
    if(!cur)continue;const f=parseFloat(v);
    if(c===10)cur.x.push(f);else if(c===20)cur.y.push(f);else if(c===11)cur.x2=f;else if(c===21)cur.y2=f;
    else if(c===40)cur.r=f;else if(c===50)cur.a0=f;else if(c===51)cur.a1=f;else if(c===70)cur.flags=+v;
  }
  return {hdr,ents};
}
function dxfToCanvas(text,unitSel){
  const {hdr,ents}=parseDxf(text);if(!ents.length)throw new Error('DXF માં કંઈ મળ્યું નથી. ફાઇલ ASCII DXF તરીકે સેવ કરો.');
  const segs=[];let skipped=0;
  const arc=(cx,cy,r,a0,a1,out)=>{let s=a0*Math.PI/180,e=a1*Math.PI/180;if(e<=s)e+=2*Math.PI;const n=Math.max(8,Math.ceil((e-s)/0.1));for(let i=0;i<=n;i++){const a=s+(e-s)*i/n;out.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}};
  const paths=[];
  for(const e of ents){
    if(e.t==='LINE'&&e.x2!=null)paths.push([[e.x[0],e.y[0]],[e.x2,e.y2]]);
    else if(e.t==='LWPOLYLINE'){const P=e.x.map((x,i)=>[x,e.y[i]]);if(e.flags&1)P.push(P[0]);paths.push(P)}
    else if(e.t==='POLYLINE'){const P=e.verts.map(v=>[v.x[0],v.y[0]]);if(e.flags&1)P.push(P[0]);paths.push(P)}
    else if(e.t==='CIRCLE'){const P=[];arc(e.x[0],e.y[0],e.r,0,360,P);paths.push(P)}
    else if(e.t==='ARC'){const P=[];arc(e.x[0],e.y[0],e.r,e.a0,e.a1,P);paths.push(P)}
    else if(['SPLINE','ELLIPSE','INSERT','HATCH','3DFACE'].includes(e.t))skipped++;
  }
  let x0=1e30,y0=1e30,x1=-1e30,y1=-1e30;paths.forEach(P=>P.forEach(([x,y])=>{x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}));
  if(!(x1>x0))throw new Error('ડ્રોઇંગની રેખાઓ મળી નથી.');
  const m=24,W=1400,k=(W-2*m)/(x1-x0),H=Math.round((y1-y0)*k+2*m);
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);g.strokeStyle='#111';g.lineWidth=1.4;
  paths.forEach(P=>{g.beginPath();P.forEach(([x,y],i)=>{const X=m+(x-x0)*k,Y=H-m-(y-y0)*k;i?g.lineTo(X,Y):g.moveTo(X,Y)});g.stroke()});
  let u=unitSel&&unitSel!=='auto'?unitSel:UCODE[hdr.$INSUNITS];
  const inPerUnit=u?FT[u]*12:null;
  return {c,inPerPx:inPerUnit?inPerUnit/k:null,u,skipped};
}
async function pdfToCanvas(buf){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:buf}).promise,page=await pdf.getPage(1);
  const v0=page.getViewport({scale:1}),v=page.getViewport({scale:1400/v0.width});
  const c=document.createElement('canvas');c.width=v.width;c.height=v.height;
  await page.render({canvasContext:c.getContext('2d'),viewport:v}).promise;return c;
}

$('#file').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;const ext=f.name.split('.').pop().toLowerCase();
  S.note='ફાઇલ વાંચી રહ્યું છે...';renderTotals();
  try{
    if(ext==='dxf'){const r=await dxfToCanvas(await f.text(),'auto');
      loadCanvas(r.c,r.inPerPx,r.inPerPx?`DXF નું એકમ ${r.u} મળ્યું, એટલે સ્કેલ આપોઆપ સેટ છે.${r.skipped?' '+r.skipped+' વળાંકવાળી/બ્લોક વસ્તુઓ દોરી શકાઈ નથી.':''} હવે દરેક ભાગ પર ચોકઠું દોરો.`:'DXF માં એકમ નથી. એક ભાગની અસલી પહોળાઈ આપીને સ્કેલ સેટ કરો, પછી દરેક ભાગ પર ચોકઠું દોરો.')}
    else if(ext==='pdf'){if(typeof pdfjsLib==='undefined')throw new Error('PDF રીડર લોડ થયું નથી. ઇન્ટરનેટ તપાસો.');
      loadCanvas(await pdfToCanvas(new Uint8Array(await f.arrayBuffer())),null,'PDF માં માપ નથી. એક ભાગની અસલી પહોળાઈ આપીને સ્કેલ સેટ કરો. કોઈ ભાગ ન હોય ત્યાં સુધી “નવો ભાગ દોરો” થી ચોકઠા બનાવો.')}
    else if(/^(png|jpe?g|webp)$/.test(ext)){const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const k=Math.min(1,1600/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);loadCanvas(c,null,'ફોટો ખુલ્યો. એક ભાગની અસલી પહોળાઈ આપીને સ્કેલ સેટ કરો.')};im.src=URL.createObjectURL(f)}
    else S.note='ફક્ત DXF, PDF કે ફોટો ચાલશે. DWG ને AutoCAD માં DXF તરીકે સેવ કરો.';
  }catch(err){S.note='ફાઇલ વાંચી શકાઈ નથી: '+err.message}
  renderTotals();e.target.value='';
};
