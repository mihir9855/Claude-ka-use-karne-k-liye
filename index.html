<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Arthaly – Expense & Budget Tracker</title>
<style>
:root{
  --bg:#f6f7f5;--card:#fff;--ink:#14201d;--mute:#6b7773;--line:#e6e9e6;
  --brand:#0f766e;--brand-soft:#d9efec;--debit:#d1495b;--credit:#1a9f6b;--warn:#d98e04;
  --shadow:0 1px 2px rgba(20,32,29,.05),0 6px 20px rgba(20,32,29,.06);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0e1514;--card:#16201e;--ink:#e8efed;--mute:#8fa09b;--line:#233230;
  --brand:#2bb5a8;--brand-soft:#17332f;--debit:#ef6f7f;--credit:#3ccf93;--warn:#f0b43a;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom));min-height:100vh}
h1{font-size:20px;margin:0}h2{font-size:13px;margin:22px 0 10px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.mute{color:var(--mute)}.small{font-size:12px}.num{font-variant-numeric:tabular-nums}
.debit{color:var(--debit)}.credit{color:var(--credit)}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.month{display:flex;align-items:center;gap:6px}
.icon-btn{border:0;background:var(--card);color:var(--ink);width:34px;height:34px;border-radius:50%;box-shadow:var(--shadow);font-size:16px;cursor:pointer}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand);font-size:11px;font-weight:600}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;border-radius:9px;background:var(--brand)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:18px;margin-top:2px}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding:0 16px;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;touch-action:pan-x pan-y;cursor:grab}
.hscroll.drag{cursor:grabbing;scroll-snap-type:none}.hscroll.drag *{pointer-events:none}
.hscroll::-webkit-scrollbar{display:none}
.acc{flex:0 0 66%;scroll-snap-align:start;border-radius:16px;padding:9px 13px;color:#fff;position:relative;overflow:hidden;cursor:pointer}
.acc small{opacity:.85;font-size:11.5px}.acc b{display:block;font-size:19px;margin:2px 0 4px}
.acc .io{display:flex;gap:14px;font-size:12px;opacity:.95}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tx:last-child{border:0}
.dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:17px;background:var(--brand-soft);flex:none}
.tx .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr 54px 1fr 1fr 1fr;align-items:center}
nav button{border:0;background:none;color:var(--mute);padding:6px 0;font:inherit;font-size:10.5px;min-width:0;cursor:pointer}
nav button span{display:block;font-size:19px;line-height:1.2}nav button.on{color:var(--brand);font-weight:600}
.fab{width:54px;height:54px;border-radius:50%;background:var(--brand)!important;color:#fff!important;font-size:28px!important;margin:-26px auto 0;box-shadow:0 6px 16px color-mix(in srgb,var(--brand) 45%,transparent);display:grid;place-items:center;padding:0!important}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font:inherit;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
label{display:block;font-size:12px;color:var(--mute);margin:12px 0 5px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
textarea{min-height:130px;resize:vertical}
.btn{width:100%;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:600;background:var(--btn,var(--brand));color:var(--btn-ink,#fff);margin-top:16px;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}.btn.red{background:none;color:var(--debit);margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#14201d;color:#fff;padding:10px 16px;border-radius:12px;z-index:20;max-width:90%;font-size:13px}
.legend{display:grid;gap:8px;margin-top:12px}.legend div{display:flex;align-items:center;gap:8px}.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
svg text{fill:var(--mute);font-size:9px}

.hero{background:linear-gradient(140deg,var(--hero1,#16322e) 0%,var(--hero2,#0f766e) 70%,var(--hero3,#2bb5a8) 130%);color:#fff;border-radius:26px;padding:18px;box-shadow:0 14px 30px -14px var(--hero2,#0f766e)}
.hero .big{color:#fff}.hero .sub{opacity:.75;font-size:12px}
.hero .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.hero .chips span{background:rgba(255,255,255,.14);border-radius:12px;padding:6px 10px;font-size:12px;white-space:nowrap}
.eye{display:grid;place-items:center;padding:0;border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:50%;width:34px;height:34px;font-size:15px;cursor:pointer}
.eye svg{display:block}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.qa button{border:0;border-radius:18px;padding:14px 2px 12px;color:#fff;font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.qa button span{font-size:20px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;overflow:hidden;border-radius:22px;padding:14px;color:#fff;min-height:138px;cursor:pointer}
.tile .wm{position:absolute;right:-4px;bottom:-12px;font-size:64px;opacity:.2}
.tile h3{margin:0;font-size:14px;font-weight:700}.tile .pc{position:absolute;right:12px;top:12px;font-size:11px;font-weight:700;background:rgba(255,255,255,.22);border-radius:99px;padding:2px 8px}
.tile .amt{font-size:18px;font-weight:700;margin-top:16px}.tile .of{font-size:11px;opacity:.85}
.tile .tb{height:6px;background:rgba(255,255,255,.3);border-radius:9px;margin-top:10px;overflow:hidden}.tile .tb i{display:block;width:var(--p,0%);height:100%;background:#fff;border-radius:9px}
.tile.over{outline:2px solid #ff4d6d;outline-offset:-2px}
.tile.add{background:var(--card)!important;color:var(--mute);border:2px dashed var(--line);display:grid;place-items:center;box-shadow:none;text-align:center}
.tile.nolim{opacity:.72}
.seg-bar{display:flex;height:10px;border-radius:9px;overflow:hidden;gap:2px;background:rgba(255,255,255,.18)}
.seg-bar i{display:block;height:100%}
.alert{background:#f97316;color:#fff;border-radius:16px;padding:11px 14px;font-size:13px;margin-top:12px}
.alert.ok{background:var(--credit)}
.chips2{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--c,var(--brand));border-color:transparent;color:#fff}
.amt-in{font-size:30px;font-weight:700;border:0;background:var(--card);text-align:center;padding:14px}
.hint{background:#fff7e0;color:#7a5a00;border-radius:12px;padding:8px 12px;font-size:12px;margin-top:8px}
.search{margin-top:10px}
#tip{position:absolute;pointer-events:none;background:#14201d;color:#fff;border-radius:8px;padding:4px 8px;font-size:11px;white-space:nowrap;display:none;z-index:2}

/* appearance: plain option rows */
.opt{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.opt:last-child{border:0}
.rad{width:22px;height:22px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;flex:none}
.rad.on{border-color:var(--ink)}
.rad.on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink)}
.ic{display:block;flex:none}
nav button span{display:flex;justify-content:center}
.qa button span{display:flex}
.icon-btn{display:inline-grid;place-items:center;padding:0}
.chip{display:inline-flex;align-items:center;gap:6px}
.legend .ic{display:inline-block}
.picker{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.picker button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;height:46px;display:grid;place-items:center;cursor:pointer;padding:0}
.picker button.on{border-color:var(--brand);color:var(--brand)}
.bh{border-radius:12px;padding:8px 12px;font-size:12px;margin-top:8px}
.bh.ok{background:var(--brand-soft);color:var(--ink)}
.bh.warn{background:rgba(251,191,36,.16);color:var(--warn)}
.bh.over{background:rgba(255,107,107,.16);color:var(--debit)}
.alert.soft{background:rgba(251,191,36,.18);color:var(--warn)}
.attn{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.attn:last-child{border:0}
.chart{position:relative}
.gtip{position:absolute;background:#14201d;color:#fff;font-size:11px;padding:3px 8px;border-radius:8px;pointer-events:none;white-space:nowrap;z-index:3}
.pb{margin:12px 0}
.hb{display:grid;grid-template-columns:86px 1fr auto;gap:8px;align-items:center;margin:9px 0;font-size:12px}
.hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.htr{position:relative;height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.htr i{display:block;height:100%;border-radius:9px}
.htr u{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.75}
.ctitle{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.ctitle b{font-size:15px}

/* ===== Emerald Clean: flat, bright white (light) / graphite (dark), small corners, no gradients or glow ===== */
:root[data-theme=sage]{color-scheme:light;--bg:#ffffff;--card:#ffffff;--ink:#101828;--mute:#667085;--line:#e9edf1;--brand:#1f9a57;--brand-soft:#e6f6ed;--btn:#1f9a57;--btn-ink:#fff;--on-brand:#fff;--debit:#e5484d;--credit:#1e9d56;--warn:#e8890c;--heroflat:#1f9a57;--field:#f6f8f7;--shadow:0 1px 2px rgba(16,24,40,.05)}
:root[data-theme=cocoa]{color-scheme:dark;--bg:#0c120f;--card:#141c17;--ink:#f1f5f2;--mute:#93a39a;--line:#212d25;--brand:#34c076;--brand-soft:rgba(52,192,118,.14);--btn:#34c076;--btn-ink:#04210f;--on-brand:#04210f;--debit:#f0686d;--credit:#3fcf82;--warn:#f2b04a;--heroflat:#17794a;--field:#1a241e;--shadow:none}
[data-theme] body{background:var(--bg)}
[data-theme] #app{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
[data-theme] h1{font-size:24px;letter-spacing:-.02em;font-weight:800}
[data-theme] h2{font-size:12px;letter-spacing:.09em;margin:22px 2px 10px}
[data-theme] .card,[data-theme] .stat{border-radius:12px;border:1px solid var(--line);box-shadow:var(--shadow)}
[data-theme] .hero{background:var(--heroflat);border-radius:12px;border:0;box-shadow:none}
[data-theme] .big{letter-spacing:-.03em}
[data-theme] .seg{border-radius:10px;background:var(--line);padding:3px}
[data-theme] .seg button{border-radius:8px;white-space:nowrap}
[data-theme] .seg button.on{background:var(--brand);color:var(--on-brand);box-shadow:none;font-weight:700}
[data-theme] .chip{border-radius:8px;white-space:nowrap}
[data-theme] .chip.on{color:var(--on-brand)}
[data-theme] .pill{background:var(--brand-soft);color:var(--brand);border-radius:6px;padding:3px 9px;white-space:nowrap;flex:none}
[data-theme] .btn{border-radius:10px;font-weight:700}
[data-theme] .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
[data-theme] .btn.red{background:none;color:var(--debit);border:0}
[data-theme] .icon-btn,[data-theme] .eye{border-radius:10px}
[data-theme] .icon-btn{border:1px solid var(--line);box-shadow:none;background:var(--card)}
[data-theme] .eye{background:rgba(255,255,255,.18)}
[data-theme] nav{left:50%;right:auto;width:min(456px,calc(100% - 24px));transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));border-radius:16px;background:var(--card);border:1px solid var(--line);padding:7px 8px;box-shadow:0 1px 2px rgba(16,24,40,.06)}
[data-theme] nav button{white-space:nowrap}
[data-theme] nav button.on{color:var(--brand)}
[data-theme] .fab{background:var(--brand)!important;color:#fff!important;border-radius:14px;margin:0 auto;width:46px;height:46px;box-shadow:none}
:root[data-theme=cocoa] .fab{color:#04210f!important}
[data-theme] .sheet{background:var(--bg);border-radius:16px 16px 0 0}
[data-theme] .dlg{border-radius:14px}
[data-theme] .toast{background:#101828;color:#fff;border-radius:10px}
:root[data-theme=cocoa] .toast{background:#f1f5f2;color:#0c120f}
[data-theme] input,[data-theme] select,[data-theme] textarea{background:var(--field);border:1px solid var(--line);border-radius:10px;color:var(--ink)}
[data-theme] input:focus,[data-theme] select:focus,[data-theme] textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
[data-theme] .amt-in{background:var(--field)}
[data-theme] .dot{border-radius:10px}
[data-theme] .bar,[data-theme] .bar>i{border-radius:4px}
[data-theme] .bar{background:var(--line);height:8px}
[data-theme] .qa{gap:8px}
[data-theme] .qa button{flex-direction:row;justify-content:center;gap:6px;border-radius:10px;padding:11px 4px;font-size:13px;font-weight:700;background:var(--brand-soft)!important;color:var(--brand)!important}
[data-theme] .qa button span{font-size:16px}
[data-theme] .acc{border-radius:12px}
[data-theme] .acc:nth-child(3n+1){background:#1f9a57!important}
[data-theme] .acc:nth-child(3n+2){background:#2f8b9c!important}
[data-theme] .acc:nth-child(3n){background:#5b82bf!important}
[data-theme] .tile{border-radius:12px}
[data-theme] .tile .pc{border-radius:6px}
[data-theme] .seg-bar,[data-theme] .seg-bar i{border-radius:4px}
[data-theme] .alert{border-radius:10px}
[data-theme] .alert.soft{background:#fff4e0;color:#9a5b00}
:root[data-theme=cocoa] .alert.soft{background:rgba(242,176,74,.14);color:#f2b04a}
[data-theme] .hint{background:#fff4e0;color:#8a5200;border-radius:10px}
:root[data-theme=cocoa] .hint{background:rgba(242,176,74,.14);color:#f2b04a}
[data-theme] #intro{background:var(--bg)}
[data-theme] #intro b{color:var(--ink)}[data-theme] #intro small{color:var(--mute)}
[data-theme] .sec{border:1px solid var(--line);box-shadow:none;border-radius:12px}
[data-theme] .search{border-radius:10px}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);padding:14px 0!important}
.sumrow>div{padding:0 14px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.sumrow>div:first-child{border-left:0}.sumrow b{font-size:17px;white-space:nowrap}
.crows{display:grid;gap:14px}.crow{display:flex;gap:12px;align-items:center}
.cic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.ctr{height:5px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden}.ctr i{display:block;height:100%;border-radius:3px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:10px 0 6px;background:var(--line)}.stack i{display:block;height:100%}
.dual{display:grid;gap:3px;margin-top:6px}.dual i{display:block;height:4px;border-radius:2px;min-width:2px}
.cprev{display:flex;justify-content:space-between;align-items:center;border-radius:12px;padding:12px 14px;color:#fff;font-weight:700;font-size:14px;margin:4px 0 10px}
.cprev span:last-child{font-weight:500;font-size:12px;opacity:.85}
.cpick{display:flex;flex-wrap:wrap;gap:10px}
.cs{width:36px;height:36px;border-radius:10px;border:2px solid transparent;padding:0;margin:0;cursor:pointer;position:relative;display:grid;place-items:center;flex:none}
.cs.on{border-color:var(--ink)}
.cs.on:not(.cust)::after{content:"✓";color:#fff;font-size:16px;font-weight:800}
.cs.cust{background:var(--field);border:1.5px dashed var(--mute);overflow:hidden}
.cs.cust b{color:var(--mute);font-size:20px;font-weight:600;line-height:1}
.cs.cust.on{border:2px solid var(--ink)}.cs.cust.on b{color:#fff}
.cs.cust input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0;margin:0}

.dlg-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{background:var(--card);color:var(--ink);border-radius:22px;padding:18px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.btn.danger{background:var(--debit)!important;color:#fff!important}

#intro{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#6a402d,#2b170f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;pointer-events:none;transition:opacity .45s ease,transform .45s ease}
#intro.out{opacity:0;transform:scale(1.04)}
#intro img{width:120px;height:120px;transform:scale(0) rotate(-200deg);animation:ilogo .9s .1s cubic-bezier(.3,1.4,.5,1) forwards,iglow 1.2s 1s ease-out}
#intro .r{fill:none;stroke-linecap:round;transform:rotate(-90deg);transform-origin:256px 256px}
#intro .r1{stroke:#9bb35c;stroke-width:46;stroke-dasharray:1080;stroke-dashoffset:1080;animation:idraw 1.1s .15s cubic-bezier(.5,0,.2,1) forwards}
#intro .r2{stroke:#f08a24;stroke-width:40;stroke-dasharray:730;stroke-dashoffset:730;animation:idraw2 1s .35s cubic-bezier(.5,0,.2,1) forwards}
#intro .dot{opacity:0;animation:ipop .4s 1s forwards}
#intro .core{transform-origin:256px 256px;transform:scale(0);animation:ipop2 .5s .2s cubic-bezier(.3,1.6,.5,1) forwards}
#intro b{font:700 30px/1 Roboto,system-ui,sans-serif;letter-spacing:.06em;color:#101828;opacity:0;animation:itxt .6s .75s forwards}
#intro small{font:400 13px/1 Roboto,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#c9b6a8;opacity:0;animation:itxt .6s 1s forwards}
@keyframes idraw{to{stroke-dashoffset:300}}
@keyframes idraw2{to{stroke-dashoffset:300}}
@keyframes ipop{to{opacity:1}}
@keyframes ipop2{to{transform:scale(1)}}
@keyframes ilogo{60%{transform:scale(1.12) rotate(8deg)}to{transform:scale(1) rotate(0)}}
@keyframes iglow{0%{filter:drop-shadow(0 0 0 rgba(224,170,90,.7))}60%{filter:drop-shadow(0 0 28px rgba(224,170,90,.8))}100%{filter:drop-shadow(0 0 0 rgba(224,170,90,0))}}
@keyframes itxt{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#intro *{animation-duration:.01s!important;animation-delay:0s!important}}
.txscroll{max-height:min(720px,78vh);overflow-y:auto;overscroll-behavior:auto;-webkit-overflow-scrolling:touch}
.acc.sel{outline:3px solid var(--brand);outline-offset:2px}
[data-theme] .acc.cc:nth-child(n){background:var(--cc)!important}

const ICONS={

 plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',

 phone:'<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/>',
 car:'<path d="M5 17H3v-4l2-5a2 2 0 0 1 2-1h10a2 2 0 0 1 2 1l2 5v4h-2"/><path d="M7 17h10M3 12h18"/><circle cx="7.5" cy="17" r="1.8"/><circle cx="16.5" cy="17" r="1.8"/>',
 film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16M3 9h5M3 15h5M16 9h5M16 15h5"/>',
 coffee:'<path d="M4 8h13v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5V8z"/><path d="M17 10h2a2 2 0 0 1 0 4h-2M7 3v2M11 3v2M14 3v2"/>',
 star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>'
};
const ICON_PICK=['cart','food','coffee','fuel','car','train','home','bulb','phone','bag','gift','film','book','heart','medical','card','wallet','trend','swap','receipt','user','star'];
const ic=(k,sz=20)=>ICONS[k]?`<svg class="ic" viewBox="0 0 24 24" width="${sz}" height="${sz}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`:`<span style="font-size:${sz-2}px;line-height:1">${esc(k||'')}</span>`;
const CATS={Card:'card',EMI:'card',Food:'food',Groceries:'cart',Fuel:'fuel',Rent:'home',Shopping:'bag',Bills:'bulb',Medical:'medical',Travel:'train',Investment:'trend',Transfer:'swap',Other:'receipt'};
const CATCOL={Card:'#e11d48',EMI:'#0ea5e9',Food:'#d97706',Groceries:'#16a34a',Fuel:'#0369a1',Rent:'#7c3aed',Shopping:'#be185d',Bills:'#0891b2',Medical:'#dc2626',Travel:'#4f46e5',Investment:'#0f766e',Transfer:'#64748b',Other:'#94a3b8'};
const ICATS={Salary:'wallet',Freelance:'star',Business:'trend',Refund:'swap',Gift:'gift',Other:'receipt'};
const ICATCOL={Salary:'#16a34a',Freelance:'#8b5cf6',Business:'#0891b2',Refund:'#f59e0b',Gift:'#ec4899',Other:'#94a3b8'};
const KINDS_OUT=['expense','transfer','pass'],KINDS_IN=['income','other','pass'];
const kindsFor=ty=>Object.entries(KINDS).filter(([k])=>(ty==='credit'?KINDS_IN:KINDS_OUT).includes(k));
const KINDS={expense:'Expense',transfer:'Transfer / card bill / ATM',income:'Income (salary)',other:'Other income',pass:'Party / pass-through'};
const defaults=()=>({
  accounts:[{id:'cash',name:'Cash',type:'cash',last4:'',open:0}],
  people:[],sources:[],tx:[],budget:0,seen:[],cats:[],hide:false,name:'',salary:0,
  budgets:{}
});
let S;
try{S=JSON.parse(localStorage.getItem(KEY))||defaults()}catch(e){S=defaults()}
const EARTH=['#22a45d','#3b82f6','#f59e0b','#ef5b5b','#8b5cf6','#06b6d4','#ec4899','#84cc16','#14b8a6','#f97316','#6366f1','#64748b'];
function paintCats(){Object.keys(CATCOL).forEach((k,i)=>{CATCOL[k]=EARTH[i%EARTH.length]})}
const mqDark=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
/* Appearance: 'auto' follows the phone; light = bright white Emerald, dark = graphite Emerald */
function applyTheme(){
  const a=S.appearance;
  S.theme=a==='light'?'sage':a==='dark'?'cocoa':(mqDark&&mqDark.matches?'cocoa':'sage');
  document.documentElement.dataset.theme=S.theme;paintCats();
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=S.theme==='cocoa'?'#0c120f':'#ffffff';
}
if(mqDark)mqDark.addEventListener('change',()=>{if(S.appearance==='auto')applyTheme()});
/* fills in anything missing (old backups, reset) and re-applies saved look */
function normalize(){
  S.accounts.forEach(a=>{a.type=a.type||'bank'});
  if(!S.accounts.length)S.accounts.push({id:'cash',name:'Cash',type:'cash',last4:'',open:0});
  S.emis=S.emis||[];S.smsPending=S.smsPending||[];S.salary=0;S.name=S.name||'';S.ignored=S.ignored||[];S.notify=!!S.notify;S.notified=S.notified||{};
  S.cats=S.cats||[];S.icons=S.icons||{};S.sources=S.sources||[];S.hide=!!S.hide;S.appearance=['light','dark'].includes(S.appearance)?S.appearance:'auto';
  if(!S.budgets)S.budgets=defaults().budgets;
  S.cats.forEach(c=>{CATS[c.k]=c.e;CATCOL[c.k]=c.c});
  Object.entries(S.icons).forEach(([k,v])=>{if(CATS[k])CATS[k]=v});
  applyTheme();
}
normalize();
const totalBudget=()=>{const v=Object.values(S.budgets).reduce((a,b)=>a+b,0);return v>0?v:S.budget};
const cname=k=>k==='Other'?'Misc':k;
const NEWCOL=['#14b8a6','#8b5cf6','#f59e0b','#ec4899','#06b6d4','#84cc16'];
function addCategory(name,icon){
  name=name.trim();if(!name)return null;
  if(!CATS[name]){const c={k:name,e:icon||'star',c:NEWCOL[S.cats.length%NEWCOL.length]};S.cats.push(c);CATS[c.k]=c.e;CATCOL[c.k]=c.c;save()}
  paintCats();
  return name;
}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let q='',catTouched=false,newIcon='star';
let view='home',month=new Date().toISOString().slice(0,7),seg='people',accFilter='',homeRange='w';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- helpers ---------- */
const inrH=n=>S.hide?'₹ ••••':inr(n);
const compact=n=>n>=1e5?(n/1e5).toFixed(1)+'L':n>=1e3?(n/1e3).toFixed(1)+'k':String(Math.round(n));
const inr=(n,sign)=>{const a=Math.abs(n);const s='₹'+a.toLocaleString('en-IN',{maximumFractionDigits:a%1?2:0,minimumFractionDigits:a%1?2:0});return (sign?(n<0?'−':'+'):'')+s};
const acc=id=>S.accounts.find(a=>a.id===id);
const accColor=id=>COLORS[Math.max(0,S.accounts.findIndex(a=>a.id===id))%COLORS.length];
const person=id=>S.people.find(p=>p.id===id);
const mlabel=m=>new Date(m+'-01T00:00').toLocaleDateString('en-IN',{month:'short',year:'numeric'});
const shiftMonth=(m,d)=>{const [y,mo]=m.split('-').map(Number);const dt=new Date(y,mo-1+d,1);return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')};
const signed=t=>t.type==='credit'?t.amt:-t.amt;

/* ---------- SMS parser ---------- */
const CAT_RULES=[
  ['Groceries',/dmart|blinkit|bigbasket|zepto|instamart|grocer|kirana|supermarket|reliance fresh/],
  ['Food',/zomato|swiggy|restaurant|pizza|cafe|food|momo|caterer|dhaba|hotel|bakery/],
  ['Fuel',/petrol|fuel|hpcl|bpcl|iocl|indian oil|bharat petroleum|gas agency|lpg/],
  ['Rent',/\brent\b|society|maintenance/],
  ['Shopping',/amazon|flipkart|myntra|westside|ajio|beardo|meesho|nykaa/],
  ['Bills',/jio|airtel|vodafone|\bvi\b|recharge|electric|torrent|bescom|broadband|dth|bill/],
  ['Medical',/hospital|pharm|medical|apollo|clinic|lab|medplus/],
  ['Travel',/irctc|uber|ola\b|redbus|metro|railway|makemytrip|rapido/],
  ['Investment',/zerodha|groww|upstox|\bsip\b|mutual fund|nippon|hdfc amc|coin/]
];
const guessCat=s=>{const l=s.toLowerCase();for(const [c,r] of CAT_RULES)if(r.test(l))return c;return 'Other'};
/* amount in many bank styles: Rs.100, Rs:100, Rs 100, INR 1,000.50, ₹100, 100.00 INR */
function smsAmount(s){
  const m=s.match(/(?:rs|inr|₹|rupees?)\s*[.:\-]*\s*([\d,]+(?:\.\d{1,2})?)/i)||s.match(/([\d,]*\d(?:\.\d{1,2})?)\s*(?:rs|inr|₹)(?![a-z])/i)||s.match(/\b(?:dr|cr|debited|credited|withdrawn|paid|spent|received|deposited)\b[^\d]{0,14}([\d,]*\d\.\d{2})/i);
  return m?parseFloat(m[1].replace(/,/g,'')):0;
}
function parseSms(raw,fallbackIso){
  const s=raw.replace(/\s+/g,' ').trim();
  const amt=smsAmount(s);
  if(!(amt>0))return null;
  const low=s.toLowerCase().replace(/\b(credit|debit) cards?\b/g,' card ');
  const d=low.search(/\b(debited|debit|dr|spent|withdrawn|withdrawal|withdrew|paid|purchase|purchased|sent|deducted|used|transferred to|trf to)\b/);
  const c=low.search(/\b(credited|credit|cr|received|deposited|deposit|refund|reversal|added|transferred from|trf from)\b/);
  let type;
  if(d<0&&c<0)return null;
  type=(c<0||(d>=0&&d<c))?'debit':'credit';
  let last4='';
  const m1=s.match(/[xX*]{2,}\s*(\d{3,4})\b/)||s.match(/(?:a\/c|acct?|account|card)(?:\s*(?:no\.?|number|ending(?: with)?))?\s*[:.]?\s*(\d{4})\b/i);
  if(m1)last4=m1[1].slice(-4);
  const mm=[...s.matchAll(/(?:\bto\b|\bat\b|towards|VPA|Info:?|\bfrom\b|\bby\b)\s+([A-Za-z][A-Za-z0-9@._&\- ]{2,30}?)(?=\s+(?:on|ref|upi|via|avl|bal|not|if|a\/c|ac|\d{2}[-/])|[.,;]|$)/gi)]
    .map(x=>x[1].trim()).filter(x=>!/^(a\/c|ac|acct|account|your|bank|card|rs|inr)\b/i.test(x));
  const party=mm[0]||'';
  let date=fallbackIso?new Date(fallbackIso+'T12:00'):new Date();
  const dm=s.match(/(\d{1,2})[-\/ ](\d{1,2}|[A-Za-z]{3})[-\/ ](\d{2,4})/);
  if(dm){
    const mo=isNaN(dm[2])?['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(dm[2].toLowerCase()):dm[2]-1;
    const y=+dm[3]<100?2000+ +dm[3]:+dm[3];
    if(mo>=0){const t=new Date(y,mo,+dm[1],12);if(!isNaN(t))date=t}
  }
  const iso=new Date(date.getTime()-date.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  return {type,amt,last4,note:party||'SMS',date:iso,cat:type==='debit'?guessCat(s):'Other',kind:type==='credit'?'income':'expense',raw:s};
}
const isoDay=ms=>{const d=new Date(ms);return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
function addFromSms(text,fallbackIso,msgTs){
  const out=[],bad=[];
  for(const chunk of text.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean)){
    const key=chunk.replace(/\s+/g,' ');
    if(S.seen.includes(key)){bad.push('duplicate');continue}
    const p=parseSms(chunk,fallbackIso);
    if(!p){bad.push('unreadable');const am=smsAmount(chunk);if(am&&!S.smsPending.some(x=>x.text===key)){S.smsPending.push({id:uid(),text:key.slice(0,400),amt:am,date:fallbackIso||isoDay(Date.now()),ts:msgTs||Date.now(),key});if(S.smsPending.length>200)S.smsPending.shift()}continue}
    const a=p.last4&&S.accounts.find(a=>a.last4&&a.last4===p.last4);
    const low=p.raw.toLowerCase(),isCard=a&&accType(a)==='card';
    let kind=p.kind,to='',cat=p.cat;
    if(p.type==='debit'&&/\batm\b|cash withdrawal|cash wdl/.test(low)){const c=S.accounts.find(x=>accType(x)==='cash');if(c){kind='transfer';to=c.id;cat='Other'}}
    else if(p.type==='debit'&&!isCard&&/credit card|card bill|cc bill|card payment|card outstanding/.test(low)){const cs=S.accounts.filter(x=>accType(x)==='card');if(cs.length===1){kind='transfer';to=cs[0].id;cat='Other'}}
    else if(p.type==='credit'&&isCard){
      if(/refund|reversal/.test(low)){kind='expense';cat='Shopping'}
      else{S.seen.push(key);bad.push('card payment');continue}
    }
    const t={id:uid(),date:p.date,type:p.type,amt:p.amt,acc:a?a.id:'',to,kind,cat,note:p.note,party:'',pool:false,src:'sms',raw:key.slice(0,400),ts:msgTs||Date.now()};
    if(!a&&p.last4)t.hint4=p.last4;      // remembered so assigning one SMS can teach the account its last 4 digits
    S.tx.push(t);S.seen.push(key);out.push({t,last4:p.last4,matched:!!a});
  }
  if(S.seen.length>2000)S.seen=S.seen.slice(-2000);
  save();return {out,bad};
}

/* ---------- Android SMS bridge (Capacitor) ---------- */
const sms=()=>window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()?Capacitor.Plugins.PaisaSms:null;
function ingest(msgs){
  let n=0,un=0;
  for(const m of msgs){const r=addFromSms(m.body,isoDay(m.ts),m.ts);n+=r.out.length;un+=r.out.filter(o=>!o.matched).length}
  if(n){render();toast(`${n} new from SMS${un?` · ${un} need an account`:''}`);checkBudgetNotify()}
  return n;
}
async function drainSms(){const p=sms();if(!p)return;try{const r=await p.drain();if(r.messages.length)ingest(r.messages)}catch(e){}}
async function enableSms(){
  const p=sms();if(!p)return toast('Only in the Android app');
  const r=await p.requestPermissions();
  if(r.sms!=='granted')return toast('Permission denied. Allow SMS in app settings.');
  toast('SMS capture is on');render();
}
async function importInbox(days){
  const p=sms();if(!p)return;
  try{const before=S.smsPending.length,r=await p.readInbox({days:days||30}),n=ingest(r.messages),np=S.smsPending.length-before;
    if(!n&&!np)toast(r.messages.length?'Nothing new. All of them were already added.':'No money SMS found in the last '+(days||30)+' days');
    else if(np>0){toast(`${n} added · ${np} need your help`);render()}
    if(view==='sms')render()}
  catch(e){toast('Enable SMS capture first (Settings → Bank SMS)')}
}
let smsCap=false;
if(sms()){
  if(sms().capabilities)sms().capabilities().then(c=>{smsCap=!!c.sms;if(view==='accounts')render()}).catch(()=>{});
  sms().addListener('smsReceived',drainSms);
  setTimeout(()=>note.sync(),0);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)drainSms()});
}

/* ---------- notifications ---------- */
const note={
  async ask(){
    const p=sms();
    if(p){try{const r=await p.requestPermissions({permissions:['notif']});return r.notif==='granted'}catch(e){return false}}
    if(!('Notification' in window))return false;
    return (await Notification.requestPermission())==='granted';
  },
  send(title,body,id){
    if(!S.notify)return;
    const p=sms();
    if(p&&p.showNotification){p.showNotification({title,body,id:id||1}).catch(()=>{});return}
    if('Notification' in window&&Notification.permission==='granted'){try{new Notification(title,{body})}catch(e){}}
  },
  sync(){const p=sms();if(p&&p.setNotify)p.setNotify({enabled:!!S.notify}).catch(()=>{})}
};
function checkBudgetNotify(){
  if(!S.notify)return;
  const mk=new Date().toISOString().slice(0,7),st=mstats(mk),tb=totalBudget();
  S.notified=S.notified||{};
  Object.keys(S.notified).forEach(k=>{if(!k.startsWith(mk))delete S.notified[k]});
  const items=alertsFor(mk).map(a=>({key:a.k,name:cname(a.k),used:a.used,lim:a.lim,pct:a.pct,lo:80}));
  if(tb>0&&st.exp/tb>=.9)items.push({key:'ALL',name:'Overall budget',used:st.exp,lim:tb,pct:st.exp/tb*100,lo:90});
  let id=10;
  for(const it of items){
    const lvl=it.pct>100?100:it.lo,key=mk+'|'+it.key+'|'+lvl;
    if(S.notified[key])continue;
    S.notified[key]=1;if(lvl===100)S.notified[mk+'|'+it.key+'|'+it.lo]=1;

/* ---------- bank statement import (CSV) ---------- */
const MON=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
const isoYMD=(y,m,d)=>(m>=1&&m<=12&&d>=1&&d<=31)?y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'):null;
function parseAnyDate(x){
  x=String(x||'').trim();let m;
  if(m=x.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return isoYMD(+m[1],+m[2],+m[3]);
  if(m=x.match(/^(\d{1,2})[\/\-. ](\d{1,2})[\/\-. ](\d{2,4})/)){let y=+m[3];if(y<100)y+=2000;return isoYMD(y,+m[2],+m[1])}

const numOf=x=>{const m=String(x||'').replace(/[,₹\s]/g,'').match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):0};
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');

  const cnt=d=>head.split(d).length-1;
  const delim=[',',';','\t'].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;
    else if(c===delim){row.push(cell);cell=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(x=>x.trim()))rows.push(row);row=[]}
    else cell+=c}

}
function shortNote(d){

  return (u?u[1].trim():d).slice(0,42)||'Statement entry';

function parseStatement(text){
  const rows=parseCSV(text);

  for(let i=0;i<Math.min(rows.length,40);i++){
    const c=rows[i].map(x=>x.trim().toLowerCase());
    if(c.some(x=>/date/.test(x))&&c.some(x=>/debit|credit|withdrawal|deposit|amount|^dr\.?$|^cr\.?$/.test(x))){hi=i;cells=c;break}
  }
  if(hi<0)return [];
  const idx=f=>cells.findIndex(f);
  let di=idx(c=>/^(tran(saction)?|txn|posting)\s*date/.test(c));if(di<0)di=idx(c=>/date/.test(c)&&!/value/.test(c));if(di<0)di=idx(c=>/date/.test(c));

  const split=c=>/dr\s*\/\s*cr|cr\s*\/\s*dr/.test(c);
  const dbi=idx(c=>!split(c)&&(/debit|withdrawal|paid out/.test(c)||/^dr\.?$/.test(c)));
  const cri=idx(c=>!split(c)&&(/credit|deposit|paid in/.test(c)||/^cr\.?$/.test(c)));
  const ami=idx(c=>/^amount/.test(c)),ti=idx(c=>split(c)||/^(txn |transaction )?type$/.test(c));
  const out=[];
  for(const r of rows.slice(hi+1)){
    const date=parseAnyDate(r[di]);if(!date)continue;
    let type,amt;
    if(dbi>=0||cri>=0){const d=numOf(r[dbi]),c=numOf(r[cri]);if(d>0){type='debit';amt=d}else if(c>0){type='credit';amt=c}else continue}
    else if(ami>=0){const a=numOf(r[ami]);if(!a)continue;const t=(r[ti]||'')+' '+(r[ami]||'');type=(/\bcr\b|credit/i.test(t)&&!/\bdr\b|debit/i.test(t))?'credit':(a<0||/\bdr\b|debit/i.test(t))?'debit':'credit';amt=Math.abs(a)}
    else continue;
    const desc=r[de]||'';
    out.push({date,type,amt:Math.round(amt*100)/100,desc,note:shortNote(desc)});
  }

}
let stmt=null;
const dayDiff=(x,y)=>Math.abs((new Date(x+'T12:00')-new Date(y+'T12:00'))/864e5);
function buildStmt(accId,rows){
  const a=acc(accId),isCard=accType(a)==='card',used=new Set(),pairedUsed=new Set(),out=[];let dup=0;
  const cash=S.accounts.find(x=>accType(x)==='cash'),cards=S.accounts.filter(x=>accType(x)==='card');
  for(const r of rows){
    const ex=S.tx.find(t=>!used.has(t.id)&&((t.acc===accId&&t.date===r.date&&t.amt===r.amt&&t.type===r.type)||(r.type==='credit'&&t.to===accId&&t.amt===r.amt&&dayDiff(t.date,r.date)<=2)));
    if(ex){used.add(ex.id);dup++;continue}
    const low=r.desc.toLowerCase();
    const c={...r,on:true,kind:r.type==='credit'?'income':'expense',to:'',cat:r.type==='credit'?(/salary/.test(low)?'Salary':'Other'):guessCat(r.desc),pair:'',mergeInto:'',tag:''};
    if(r.type==='debit'&&/\batm\b|cash withdrawal|cash wdl|\bnwd\b|\bnfs\b/.test(low)&&cash&&cash.id!==accId){c.kind='transfer';c.to=cash.id;c.cat='Other';c.tag='ATM → '+cash.name}
    else if(r.type==='debit'&&!isCard&&/credit card|card bill|cc bill|card payment|card outstanding|cred club/.test(low)&&cards.length===1){c.kind='transfer';c.to=cards[0].id;c.cat='Other';c.tag='Card bill → '+cards[0].name}
    else if(r.type==='credit'&&isCard){c.kind='transfer';c.cat='Other';c.tag='Card payment received'}
    if(c.kind==='expense'||c.kind==='income'){
      if(r.type==='debit'){
        const m=S.tx.find(t=>!pairedUsed.has(t.id)&&t.type==='credit'&&(t.kind==='income'||t.kind==='other')&&t.acc&&t.acc!==accId&&t.amt===r.amt&&dayDiff(t.date,r.date)<=2);
        if(m){pairedUsed.add(m.id);c.pair=m.id;c.kind='transfer';c.to=m.acc;c.cat='Other';c.tag='Internal transfer → '+acc(m.acc).name}
      }else{
        const m=S.tx.find(t=>!pairedUsed.has(t.id)&&t.type==='debit'&&t.kind==='expense'&&t.acc&&t.acc!==accId&&t.amt===r.amt&&dayDiff(t.date,r.date)<=2);
        if(m){pairedUsed.add(m.id);c.mergeInto=m.id;c.tag='Same as '+acc(m.acc).name+' debit: becomes a transfer'}
      }
    }
    out.push(c);
  }
  return {accId,rows:out,dup};
}
/* ---- PDF statements (pdf.js is bundled in the Android app; loaded from a CDN in a plain browser) ---- */
const PDF_CDN='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
async function loadPdfJs(){
  if(window.pdfjsLib)return window.pdfjsLib;
  const add=src=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=no;document.head.appendChild(e)});
  let base='pdfjs/';
  try{await add(base+'pdf.min.js')}catch(e){base=PDF_CDN;await add(base+'pdf.min.js')}
  const code=await (await fetch(base+'pdf.worker.min.js')).text();
  pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
  return pdfjsLib;
}
const AMT_TOKEN=/^\(?-?[\d,]*\d\.\d{2}\)?(?:\s?(?:Dr|Cr)\.?)?$/i;
async function pdfRows(buf){
  const lib=await loadPdfJs();
  let doc,pw;
  for(;;){
    try{doc=await lib.getDocument({data:new Uint8Array(buf.slice(0)),password:pw}).promise;break}
    catch(e){
      if(e&&e.name==='PasswordException'){
        pw=await askText(e.code===2?'Wrong password. Try again':'This PDF is password protected. Enter its password (banks often use customer ID, date of birth or a mix)','','Password','password');
        if(pw==null)throw new Error('cancelled');continue;
      }
      throw e;
    }
  }
  const lines=[];
  for(let n=1;n<=doc.numPages;n++){
    const tc=await (await doc.getPage(n)).getTextContent();
    const items=[];
    tc.items.forEach(i=>{
      const t=(i.str||'').trim();if(!t)return;
      const parts=t.split(/\s+/),w=i.width||0,len=t.length;let off=0;
      parts.forEach(pt=>{const at=t.indexOf(pt,off);items.push({s:pt,x:i.transform[4]+(len?w*at/len:0),y:i.transform[5]-(n-1)*10000});off=at+pt.length});
    });
    items.sort((a,b)=>b.y-a.y||a.x-b.x);
    let cur=null;
    for(const it of items){
      if(cur&&Math.abs(cur.y-it.y)<=2.5)cur.items.push(it);
      else{cur={y:it.y,items:[it]};lines.push(cur)}
    }
    lines.forEach(l=>{l.items.sort((a,b)=>a.x-b.x);
      // glue a lone Dr/Cr token onto the amount before it
      const m=[];l.items.forEach(it=>{if(/^(dr|cr)\.?$/i.test(it.s)&&m.length&&AMT_TOKEN.test(m[m.length-1].s))m[m.length-1].s+=' '+it.s;else m.push(it)});l.items=m;

}
/* fallback for layouts where the date, narration and amounts sit on different lines:

function blocksToRows(lines){
  const DATE=/^(?:\d{1,2}[\/\-. ](?:\d{1,2}|[A-Za-z]{3})[\/\-. ]\d{2,4}|\d{4}-\d{1,2}-\d{1,2})$/;
  const JUNK=/page \d|opening balance|b\/f|brought forward|closing balance|statement summary|generated/i;
  const blocks=[];let cur=null,dx=null,cx=null;
  for(const ln of lines){
    const txt=ln.items.map(i=>i.s).join(' ');
    if(/debit|withdrawal/i.test(txt)&&/credit|deposit/i.test(txt)){
      const d=ln.items.find(i=>/debit|withdrawal|^dr$/i.test(i.s)),c=ln.items.find(i=>/credit|deposit|^cr$/i.test(i.s));
      if(d&&c){dx=d.x;cx=c.x;continue}
    }
    let date=null,used=0;
    for(let st=0;st<=2&&!date;st++)for(let k=1;k<=3&&!date;k++){const t=ln.items.slice(st,st+k).map(i=>i.s).join(' ');if(DATE.test(t)){date=parseAnyDate(t);if(date)used=st+k}}
    if(date&&!(cur&&!cur.items.some(i=>AMT_TOKEN.test(i.s))&&cur.date===date)){cur={date,items:[],texts:[]};blocks.push(cur);ln.items.slice(used).forEach(i=>cur.items.push(i));continue}
    if(date){ln.items.slice(used).forEach(i=>cur.items.push(i));continue}
    if(cur&&!JUNK.test(txt))ln.items.forEach(i=>cur.items.push(i));
  }
  const rows=[];let prevBal=null;
  for(const b of blocks){
    const amts=b.items.filter(i=>AMT_TOKEN.test(i.s));if(!amts.length)continue;
    let txn=amts[0],bal=null;if(amts.length>=2){bal=amts[amts.length-1];txn=amts[amts.length-2]}
    const amt=Math.abs(numOf(txn.s));if(!(amt>0))continue;
    let type=null;const suf=txn.s.match(/(dr|cr)\.?$/i);if(suf)type=suf[1].toLowerCase()==='cr'?'credit':'debit';
    if(!type&&dx!=null&&cx!=null)type=Math.abs(txn.x-dx)<=Math.abs(txn.x-cx)?'debit':'credit';
    if(bal&&prevBal!=null){const delta=numOf(bal.s)-prevBal;if(Math.abs(Math.abs(delta)-amt)<0.02)type=delta>0?'credit':'debit'}
    if(bal)prevBal=numOf(bal.s);
    const desc=b.items.filter(i=>!AMT_TOKEN.test(i.s)&&!DATE.test(i.s)).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim();
    type=type||(/salary|credit|received|deposit|refund|interest|\bcr\b/i.test(desc)?'credit':'debit');

  }

}
function linesToRows(lines){
  const rows=[];let dx=null,cx=null,prevBal=null,pending=[];
  const DATE=/^(?:\d{1,2}[\/\-. ](?:\d{1,2}|[A-Za-z]{3})[\/\-. ]\d{2,4}|\d{4}-\d{1,2}-\d{1,2})$/;
  const JUNK=/page \d|statement|total|closing|summary|branch|ifsc|customer|a\/c|account no|generated|computer|opening/i;
  // a wrapped narration line may sit above or below the amounts line: give it to the nearer row
  const flush=(next)=>{
    for(const L of pending){
      const prev=rows[rows.length-1];
      const dp=prev?prev.y-L.y:Infinity,dn=next?L.y-next.y:Infinity;
      if(next&&dn<dp)next.pre.push(L.t);else if(prev)prev.post.push(L.t);
    }
    pending=[];
  };
  for(const ln of lines){
    const txt=ln.items.map(i=>i.s).join(' ');
    if(/debit|withdrawal/i.test(txt)&&/credit|deposit/i.test(txt)){
      const d=ln.items.find(i=>/debit|withdrawal|^dr$/i.test(i.s)),c=ln.items.find(i=>/credit|deposit|^cr$/i.test(i.s));
      if(d&&c){dx=d.x;cx=c.x;continue}
    }
    let date=null,used=0;
    for(let st=0;st<=2&&!date;st++){
      for(let k=1;k<=3&&!date;k++){
        const t=ln.items.slice(st,st+k).map(i=>i.s).join(' ');
        if(DATE.test(t)){date=parseAnyDate(t);if(date)used=st+k}
      }
    }
    const amts=ln.items.slice(used).filter(i=>AMT_TOKEN.test(i.s));
    if(!date){
      if(/opening balance|b\/f|brought forward/i.test(txt)&&amts.length)prevBal=numOf(amts[amts.length-1].s);
      else if(!amts.length&&txt.length<90&&!JUNK.test(txt))pending.push({y:ln.y,t:txt});
      continue;
    }
    if(!amts.length)continue;
    const rest=ln.items.slice(used).filter(i=>!AMT_TOKEN.test(i.s));
    const skip=rest.length&&DATE.test(rest[0].s)?1:0;                      // value-date column
    const desc=rest.slice(skip).map(i=>i.s).join(' ');
    if(/opening balance|b\/f|brought forward/i.test(desc)){prevBal=numOf(amts[amts.length-1].s);continue}
    let txn=amts[0],bal=null;
    if(amts.length>=2){bal=amts[amts.length-1];txn=amts[amts.length-2]}
    const amt=Math.abs(numOf(txn.s));if(!(amt>0))continue;
    let type=null;
    const suf=txn.s.match(/(dr|cr)\.?$/i);if(suf)type=suf[1].toLowerCase()==='cr'?'credit':'debit';
    if(!type&&dx!=null&&cx!=null)type=Math.abs(txn.x-dx)<=Math.abs(txn.x-cx)?'debit':'credit';
    if(bal&&prevBal!=null){const delta=numOf(bal.s)-prevBal;if(Math.abs(Math.abs(delta)-amt)<0.02)type=delta>0?'credit':'debit'}
    if(bal)prevBal=numOf(bal.s);
    const row={date,amt:Math.round(amt*100)/100,y:ln.y,desc,type,pre:[],post:[]};
    flush(row);

  }
  flush(null);

    const desc=[...r.pre,r.desc,...r.post].join(' ').replace(/\s+/g,' ').trim();
    const type=r.type||(/salary|credit|received|deposit|refund|interest|\bcr\b/i.test(desc)?'credit':'debit');

}

/* ---------- EMI on a credit card ---------- */
function addMonthsISO(iso,n){
  const [y,m,d]=iso.split('-').map(Number),t=new Date(y,m-1+n,1),last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(Math.min(d,last)).padStart(2,'0');
}
const todayISO=()=>isoDay(Date.now());
/* paid = instalments already paid before using the app + those whose date has passed. The purchase amount blocks
   the card limit and is released month by month (straight-line approximation). */
/* instalment k (0-based) is paid if it is within the 'already paid' count, or it fell due after the EMI was entered */
const emiIdxPaid=(p,k,today)=>k<(p.before||0)||(addMonthsISO(p.first,k)<=today&&addMonthsISO(p.first,k)>(p.addedOn||''));
function emiState(p){
  const today=todayISO();let paid=0;
  if(p.closed)paid=p.closedPaid;
  else for(let i=0;i<p.months;i++)if(emiIdxPaid(p,i,today))paid++;
  const left=p.closed?0:p.months-paid;
  return {paid,left,next:left>0?addMonthsISO(p.first,paid):null,remainingAmt:left*p.monthly,blocked:left*(p.amount/p.months),done:left===0};
}
/* each instalment that has fallen due becomes an expense on the card (category EMI), once */
function applyEmis(){
  const today=todayISO();let changed=false;
  S.emis.forEach(p=>{
    if(p.closed)return;
    for(let i=0;i<p.months;i++){
      const date=addMonthsISO(p.first,i),pre=i<(p.before||0);
      if(date>today)break;
      if(!pre&&date<=(p.addedOn||''))continue;
      if(!S.tx.some(t=>t.emiId===p.id&&t.emiNo===i+1)){
        // pre = paid before the EMI was added: shown in the account's history but it does not change the card balance
        S.tx.push({id:uid(),date,type:'debit',amt:p.monthly,acc:p.card,to:'',kind:'expense',cat:'EMI',note:`${p.name} EMI ${i+1}/${p.months}${pre?' (paid earlier)':''}`,party:'',pool:false,src:'emi',emiId:p.id,emiNo:i+1,prepaid:pre||undefined});
        changed=true;
      }
    }
  });
  if(changed)save();
}
const emiBlocked=accId=>S.emis.filter(p=>p.card===accId).reduce((a,p)=>a+emiState(p).blocked,0);
function emiBody(){
  const cards=S.accounts.filter(a=>accType(a)==='card');
  const all=S.emis.map(p=>({p,s:emiState(p)})),live=all.filter(x=>!x.s.done);
  const perMonth=live.reduce((a,x)=>a+x.p.monthly,0),rem=live.reduce((a,x)=>a+x.s.remainingAmt,0),blk=live.reduce((a,x)=>a+x.s.blocked,0);
  const today=todayISO(),t0=new Date(),vals=[],labs=[],tips=[];
  for(let i=0;i<12;i++){
    const d=new Date(t0.getFullYear(),t0.getMonth()+i,1),mk=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    let v=0;live.forEach(({p})=>{for(let k=p.before||0;k<p.months;k++){const dt=addMonthsISO(p.first,k);if(dt>today&&dt.slice(0,7)===mk)v+=p.monthly}});
    vals.push(v);labs.push(mlabel(mk).slice(0,3));tips.push(mlabel(mk)+' · '+inr(v));
  }
  const summary=live.length?`<div class="grid2"><div class="stat"><span class="small mute">EMI per month</span><b class="num">${inr(perMonth)}</b></div><div class="stat"><span class="small mute">Still to pay</span><b class="num">${inr(rem)}</b></div></div>
    <div class="card" style="margin-top:10px"><div class="row sp"><span class="small mute">Credit limit blocked by EMIs</span><b class="num">${inr(Math.round(blk))}</b></div></div>
    <h2>Next 12 months</h2><div class="card">${barChart(vals,labs,{tips})}<div class="small mute">Instalments still to come, month by month.</div></div>`:'';
  const cardsHtml=all.map(({p,s})=>{
    const pct=Math.round(s.paid/p.months*100),a=acc(p.card);
    return `<div class="card" style="margin-bottom:10px;cursor:pointer" data-a="emi" data-id="${p.id}">
      <div class="row sp"><b>${esc(p.name)}</b><span class="pill">${s.done?(p.closed?'Closed':'Done'):s.paid+' of '+p.months+' paid'}</span></div>
      <div class="small mute" style="margin:2px 0 8px">${esc(a?a.name:'card')} · ${inr(p.monthly)}/month</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="row sp small mute" style="margin-top:6px"><span>${s.done?'No instalments left':s.left+' left · next '+new Date(s.next+'T00:00').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</span><b class="num" style="color:var(--ink)">${s.done?'':inr(s.remainingAmt)+' to pay'}</b></div></div>`}).join('');
  return `${summary}
  ${all.length?`<h2>Your EMIs</h2>${cardsHtml}`:`<div class="card empty">No EMIs yet.<br>Add something you bought on EMI to track instalments and your card limit.</div>`}

function removeAccount(id,target){
  const gone=new Set(S.emis.filter(p=>p.card===id).map(p=>p.id));
  S.emis=S.emis.filter(p=>!gone.has(p.id));
  S.tx=S.tx.filter(t=>!gone.has(t.emiId));
  if(target){
    S.tx.forEach(t=>{if(t.acc===id)t.acc=target;if(t.to===id)t.to=target});
    S.tx=S.tx.filter(t=>!(t.kind==='transfer'&&t.acc&&t.acc===t.to));   // a transfer into itself means nothing
  }else S.tx=S.tx.filter(t=>t.acc!==id&&t.to!==id);
  S.accounts=S.accounts.filter(x=>x.id!==id);
  if(accFilter===id)accFilter='';
  save();closeSheet();render();toast('Account deleted');
}

/* ---------- person statement as a PDF (tiny built-in PDF writer, Helvetica, ASCII only) ---------- */
function pdfFile(pages){
  const objs=[];const add=t=>{objs.push(t);return objs.length};
  add('<< /Type /Catalog /Pages 2 0 R >>');
  add('PAGES');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  const kids=[];
  pages.forEach(c=>{
    const cid=objs.length+2,pid=add(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${cid} 0 R >>`);
    add(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`);kids.push(pid+' 0 R');
  });
  objs[1]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${kids.length} >>`;
  let out='%PDF-1.4\n',off=[];
  objs.forEach((o,i)=>{off.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
  const x=out.length;
  out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+off.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
  return out;
}
const pdfTxt=t=>String(t==null?'':t).replace(/₹/g,'Rs.').replace(/[^\x20-\x7e]/g,'?').replace(/([\\()])/g,'\\$1');
const pdfW=(t,sz)=>[...String(t)].reduce((a,c)=>a+(/[0-9]/.test(c)?.556:/[ ,.:]/.test(c)?.278:/[A-Z]/.test(c)?.67:.52),0)*sz;
const money=n=>Math.abs(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
function personStatement(pid,per){
  const p=person(pid),now=new Date(),y=now.getFullYear(),mo=now.getMonth(),pad=n=>String(n).padStart(2,'0');
  let from='',to='',label='All time';
  if(per==='m'){from=y+'-'+pad(mo+1)+'-01';to=isoDay(new Date(y,mo+1,0).getTime());label='This month'}
  else if(per==='3'){from=isoDay(new Date(y,mo-2,1).getTime());to=isoDay(new Date(y,mo+1,0).getTime());label='Last 3 months'}
  else if(per==='y'){from=y+'-01-01';to=y+'-12-31';label='This year'}
  const idx=new Map(S.tx.map((t,i)=>[t,i])),all=S.tx.filter(t=>t.kind==='pass'&&t.party===pid).sort((a,b)=>a.date.localeCompare(b.date)||(a.ts||0)-(b.ts||0)||idx.get(a)-idx.get(b));
  const sg=t=>t.type==='debit'?t.amt:-t.amt;
  let bal=all.filter(t=>from&&t.date<from).reduce((a,t)=>a+sg(t),0);
  const open=bal,rows=all.filter(t=>(!from||t.date>=from)&&(!to||t.date<=to));
  const dr=rows.filter(t=>t.type==='debit').reduce((a,t)=>a+t.amt,0),cr=rows.filter(t=>t.type==='credit').reduce((a,t)=>a+t.amt,0),close=open+dr-cr;
  const fd=iso=>new Date(iso+'T00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
  const balTxt=b=>money(b)+(b>0?' Dr':b<0?' Cr':'');
  const pages=[];let c='',yy=0,pn=0;
  const T=(x,y,t,sz,b,right)=>{const w=right?pdfW(t,sz):0;c+=`BT /${b?'F2':'F1'} ${sz} Tf ${(x-w).toFixed(1)} ${y} Td (${pdfTxt(t)}) Tj ET\n`};
  const L=(y,g)=>{c+=`${g||.82} G 0.5 w 40 ${y} m 555 ${y} l S\n`};
  const head=()=>{pn++;c='';yy=800;
    T(40,yy,'ARTHALY',9,1);T(555,yy,'Page '+pn,9,0,1);yy-=26;
    T(40,yy,'Statement of account',18,1);yy-=22;
    T(40,yy,p.name,13,1);yy-=16;
    T(40,yy,'Period: '+(from?fd(from)+' to '+fd(to):'All time')+'    Generated: '+fd(todayISO()),9,0);yy-=22;
    if(pn===1){
      c+='0.95 g 40 '+(yy-46)+' 515 54 re f 0 g\n';
      T(52,yy-8,'Total debit (you gave)',8,0);T(52,yy-26,'Rs. '+money(dr),12,1);
      T(230,yy-8,'Total credit (they gave)',8,0);T(230,yy-26,'Rs. '+money(cr),12,1);
      T(410,yy-8,close>0?p.name+' owes you':close<0?'You owe '+p.name:'All settled',8,0);T(410,yy-26,'Rs. '+money(close),12,1);
      yy-=70;
    }
    c+='0.92 g 40 '+(yy-5)+' 515 18 re f 0 g\n';
    T(46,yy,'Date',8.5,1);T(112,yy,'Details',8.5,1);T(375,yy,'Debit',8.5,1,1);T(450,yy,'Credit',8.5,1,1);T(551,yy,'Balance',8.5,1,1);yy-=18;
  };
  const foot=()=>{L(60);T(40,48,'Debit = money you gave or paid for them.  Credit = money they gave or paid you.  Balance Dr = they owe you, Cr = you owe them.',7,0);pages.push(c)};
  head();
  if(from&&open!==0){T(112,yy,'Opening balance',9,0);T(551,yy,balTxt(open),9,0,1);yy-=16;L(yy+11)}
  rows.forEach(t=>{
    if(yy<85){foot();head()}
    bal+=sg(t);
    const a=acc(t.acc),d=(t.note||'Entry')+(a?'  ('+a.name+')':'');
    T(46,yy,fd(t.date),8.5,0);
    let dd=d;while(dd.length>3&&pdfW(dd,8.5)>235)dd=dd.slice(0,-1);if(dd!==d)dd=dd.slice(0,-1)+'...';
    T(112,yy,dd,8.5,0);
    if(t.type==='debit')T(375,yy,money(t.amt),8.5,0,1);else T(450,yy,money(t.amt),8.5,0,1);
    T(551,yy,balTxt(bal),8.5,0,1);yy-=16;L(yy+11,.9);
  });

  if(yy<90){foot();head()}
  yy-=6;T(112,yy,'Closing balance',9,1);T(375,yy,money(dr),9,1,1);T(450,yy,money(cr),9,1,1);T(551,yy,balTxt(close),9,1,1);
  foot();
  return {pdf:pdfFile(pages),name:'Statement-'+p.name.replace(/[^A-Za-z0-9]+/g,'_')+'-'+todayISO()+'.pdf',n:rows.length};
}

function mstats(mk){
  const r={inc:0,oth:0,exp:0,cat:{},day:{}};
  for(const t of S.tx){
    if(!t.date.startsWith(mk))continue;
    const v=t.type==='debit'?t.amt:-t.amt;
    if(t.kind==='income')r.inc-=v;
    else if(t.kind==='other')r.oth-=v;

}

function spendSeries(r){
  const net=t=>t.type==='debit'?t.amt:-t.amt,ex=t=>t.kind==='expense';
  const out=[],now=new Date(),y=now.getFullYear(),mo=now.getMonth(),fmt=d=>d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  const day=d=>S.tx.filter(t=>t.date===isoDay(d.getTime())&&ex(t)).reduce((a,t)=>a+net(t),0);
  if(r==='y'){                                   // January to December of this year
    for(let m=0;m<12;m++){
      const key=y+'-'+String(m+1).padStart(2,'0'),v=S.tx.filter(t=>t.date.slice(0,7)===key&&ex(t)).reduce((a,t)=>a+net(t),0);
      const nm=new Date(y,m,1).toLocaleDateString('en-IN',{month:'short'});
      out.push({v,l:nm.slice(0,1),tip:nm+' '+y+' · '+inr(v)});
    }

  }
  if(r==='m'){                                   // 1st to last day of this month
    const n=new Date(y,mo+1,0).getDate();
    for(let i=1;i<=n;i++){const d=new Date(y,mo,i),v=day(d);out.push({v,l:(i===1||i%5===0)?String(i):'',tip:fmt(d)+' · '+inr(v)})}
    return out;
  }
  const mon=new Date(y,mo,now.getDate()-((now.getDay()+6)%7));   // Monday of this week
  for(let i=0;i<7;i++){const d=new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i),v=day(d);out.push({v,l:d.toLocaleDateString('en-IN',{weekday:'short'}).slice(0,2),tip:fmt(d)+' · '+inr(v)})}

}

  else if(a==='stmtgo')doStmt();

  else if(a==='pairmerge'){const [d,c]=id.split('|');mergePair(d,c);save();pairsSheet();render()}
  else if(a==='pairskip'){S.ignored.push(id.replace('|',''));save();pairsSheet();render()}
  else if(a==='pairall'){findPairs().forEach(({d,c})=>mergePair(d.id,c.id));save();closeSheet();render();toast('Merged')}
  else if(a==='fix')fixSheet(id);
  else if(a==='fxmove'){
    const [k,from]=id.split('|'),st=mstats(month),left=(S.budgets[from]||0)-(st.cat[from]||0);
    const amt=Math.min(parseFloat($('#fx-amt').value)||0,left);if(!(amt>0)){toast('Enter an amount');return}
    S.budgets[from]-=amt;S.budgets[k]=(S.budgets[k]||0)+amt;save();closeSheet();render();toast(`Moved ${inr(amt)} from ${cname(from)} to ${cname(k)}`);
  }
  else if(a==='fxbuf'){
    const buf=bufferLeft(month),amt=Math.min(parseFloat($('#fx-amt').value)||0,buf);
    if(!(amt>0)){toast(buf>0?'Enter an amount':'No buffer left');return}
    S.budgets[id]=(S.budgets[id]||0)+amt;save();closeSheet();render();toast(`Added ${inr(amt)} from buffer to ${cname(id)}`);
  }
  else if(a==='notifon'){
    (async()=>{
      if(S.notify){S.notify=false;save();note.sync();render();return}
      if(await note.ask()){S.notify=true;save();note.sync();render();toast('Notifications are on')}
      else toast('Permission denied. Allow notifications in phone settings.');
    })();
  }
  else if(a==='notiftest'){if(!S.notify)return toast('Turn notifications on first');note.send('Arthaly','Notifications are working.',99)}
  else if(a==='addperson'){askText('Add person / party','','Name').then(n=>{if(n&&n.trim()){S.people.push({id:uid(),name:n.trim()});save();render()}})}
  else if(a==='person'){personSheet(id)}
  else if(a==='unassigned')unassignedSheet();
  else if(a==='assignall'){const to=$('#ua-acc').value;let n=0;const hs=new Set(S.tx.filter(t=>!t.acc&&t.hint4).map(t=>t.hint4));if(hs.size===1)learnAcc(to,[...hs][0]);S.tx.forEach(t=>{if(!t.acc){t.acc=to;delete t.hint4;n++}});save();closeSheet();render();toast(`${n} transaction${n>1?'s':''} assigned`)}
  else if(a==='padir'){paDir=id;document.querySelectorAll('#pa-seg button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));$('#pa-acc-l').textContent=id==='debit'?'Paid from which account':'Received in which account'}
  else if(a==='personpdf'){const r=personStatement(id,$('#ps-per').value);sharePdf(r.name,r.pdf)}
  else if(a==='personadd'){
    const amt=parseFloat($('#pa-amt').value);if(!(amt>0)){toast('Enter an amount');return}
    S.tx.push({id:uid(),date:$('#pa-date').value||todayISO(),type:paDir,amt,acc:$('#pa-acc').value,to:'',kind:'pass',cat:'Other',note:$('#pa-note').value.trim(),party:id,pool:false});
    save();render();personSheet(id);toast('Entry added');
  }
  else if(a==='smson')enableSms();
  else if(a==='smsflt'){smsFilter=id;render()}
  else if(a==='smspaste')txSheet(null,{tab:'s'});
  else if(a==='smsscan')importInbox(parseInt(id,10)||30);
  else if(a==='pendx'){S.smsPending=S.smsPending.filter(x=>x.id!==id);save();render()}
  else if(a==='pendas'){const pd=S.smsPending.find(x=>x.id===id);if(pd){const cr=el.dataset.d==='credit';txSheet(null,{type:cr?'credit':'debit',kind:cr?'income':'expense',amt:pd.amt,note:pd.text.slice(0,60),date:pd.date,resolve:pd})}}
  else if(a==='smsimport')importInbox(30);
  else if(a==='addacc'){S.accounts.push({id:uid(),name:id==='cash'?'Cash':id==='card'?'Credit card':'Account '+(S.accounts.length+1),type:id||'bank',last4:'',open:0,limit:0});save();render()}
  else if(a==='export')exportBackup();
  else if(a==='import'){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>i.files[0].text().then(x=>{try{S=JSON.parse(x);normalize();save();render();toast('Imported')}catch(e){toast('Invalid file')}});i.click()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='dlg-in'){e.preventDefault();dlgClose(e.target.value)}});
document.addEventListener('change',e=>{if(e.target.type==='date')refreshDates()});
document.addEventListener('input',e=>{if(e.target.type==='date')refreshDates();
  if(e.target.id==='e-mon')emiMonTouched=true;
  if((e.target.id==='e-amt'||e.target.id==='e-mo')&&!emiMonTouched){
    const am=parseFloat($('#e-amt').value),mo=parseInt($('#e-mo').value,10);
    if(am>0&&mo>0)$('#e-mon').value=Math.round(am/mo);
  }
  if(e.target.id==='f-amt')updateBHint();

  if(e.target.id==='tx-month'){txMonth=e.target.value;txLimit=100;render()}
  if(e.target.id==='tx-acc'){accFilter=e.target.value;txLimit=100;render()}
  else if(e.target.id==='f-note'&&!catTouched&&$('#f-kind').value==='expense'){

  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='f-date')updateBHint();
  if(e.target.id==='f-pool')$('#w-poolsrc').hidden=!e.target.checked;
  if((e.target.id==='f-source'||e.target.id==='f-poolsrc')&&e.target.value==='__new'){
    const sel=e.target;
    askText('Income source name','','e.g. a client or project').then(n=>{
      if(n&&n.trim()){const id=uid();S.sources.push({id,name:n.trim()});save();['f-source','f-poolsrc'].forEach(i=>{const el=$('#'+i);if(el)el.innerHTML=srcOptions(id)})}
      else sel.value=S.sources[0]?S.sources[0].id:'';
    });
  }
  if(e.target.id==='b-cat')$('#b-new').hidden=e.target.value!=='__new';
  if(e.target.id==='f-kind'){
    const v=e.target.value,want=(v==='income'||v==='other')?'credit':(v==='expense'||v==='transfer')?'debit':tt;
    if(want!==tt){tt=want;document.querySelectorAll('#typeseg button').forEach(b=>b.classList.toggle('on',b.dataset.id===want))}
    syncKind();
  }
  const f=e.target.dataset.f;if(!f)return;
  if(f==='budget'){S.budget=parseFloat(e.target.value)||0}
  else if(f==='salary'){S.salary=parseFloat(e.target.value)||0}
  else if(f==='yourname'){S.name=e.target.value.trim()}
  else{const a=acc(e.target.dataset.id),v=e.target.value;if(f==='opendue')a.open=-(parseFloat(v)||0);else if(f==='open'||f==='limit')a[f]=parseFloat(v)||0;else a[f]=v.trim()}
  save();render();
});
function sourceSheet(id){
  const name=srcName(id),st=srcStats(id);
  const list=S.tx.filter(t=>(t.kind==='other'&&(t.source||'')===id)||(t.pool&&t.kind==='expense'&&(t.poolSrc||'')===id)).sort((a,b)=>b.date.localeCompare(a.date));
  openSheet(`<div class="row sp"><h1>${esc(name)}</h1><button class="icon-btn" data-a="close">✕</button></div>
   <div class="card" style="margin-top:14px"><div class="big ${st.left<0?'debit':'credit'}">${inr(st.left)}</div><div class="small mute">left to use</div><div class="row sp small mute" style="margin-top:6px"><span>Earned ${inr(st.inc)}</span><span>Used ${inr(st.used)}</span></div></div>
   <button class="btn" data-a="srcadd" data-id="${esc(id)}">+ Add income to ${esc(name)}</button>
   <button class="btn ghost" data-a="srcren" data-id="${esc(id)}">${id?'Edit name':'Give this a name'}</button>${id?`<button class="btn red" data-a="srcdel" data-id="${esc(id)}">Delete source</button>`:''}
   <h2>History</h2><div class="small mute" style="margin:-4px 0 8px">Tap an entry to edit or delete it.</div><div class="card" style="padding:4px 16px">${list.length?list.map(txRow).join(''):'<div class="empty">No entries yet</div>'}</div>`);
}
/* the account now knows its last 4 digits: every other SMS from the same digits goes to it too */
function learnAcc(accId,h4){
  const a=acc(accId);if(!a||!h4)return 0;let n=0;
  if(!a.last4)a.last4=h4;
  if(a.last4===h4)S.tx.forEach(t=>{if(!t.acc&&t.hint4===h4){t.acc=accId;delete t.hint4;n++}});
  return n;
}
function unassignedSheet(){
  const list=S.tx.filter(t=>!t.acc).sort((a,b)=>b.date.localeCompare(a.date));
  if(!list.length){closeSheet();render();return}
  openSheet(`<div class="row sp"><h1>Not matched to an account</h1><button class="icon-btn" data-a="close">✕</button></div>
  <div class="card" style="margin-top:14px"><b>${list.length} transaction${list.length>1?'s':''}</b><div class="small mute" style="margin:4px 0 8px">Pick the account they belong to and assign all at once, or tap a row to fix one by one.</div>
  <select id="ua-acc">${opts(S.accounts.map(a=>[a.id,a.name+(a.last4?' ••'+a.last4:'')]),S.accounts[0].id)}</select>
  <button class="btn" data-a="assignall">Assign all ${list.length} to this account</button></div>
  <h2>Transactions</h2><div class="card" style="padding:4px 16px;max-height:45vh;overflow:auto">${list.map(txRow).join('')}</div>`);
}
let paDir='debit';

  const p=person(id),list=S.tx.filter(t=>t.kind==='pass'&&t.party===id).sort((a,b)=>b.date.localeCompare(a.date)),b=personBal(id);
  openSheet(`<div class="row sp"><h1>${esc(p.name)}</h1><button class="icon-btn" data-a="close">✕</button></div>
   <div class="card" style="margin-top:14px"><div class="big ${b>0?'debit':'credit'}">${inr(Math.abs(b))}</div><div class="small mute">${b>0?'owes you':b<0?'you owe':'all settled'}</div></div>
   <h2>Add entry</h2><div class="card">
   <div class="seg" id="pa-seg"><button data-a="padir" data-id="debit" class="on">I gave / paid them</button><button data-a="padir" data-id="credit">They gave / paid me</button></div>
   <label>Amount (₹)</label><input id="pa-amt" inputmode="decimal" placeholder="₹ 0">
   <label id="pa-acc-l">Paid from which account</label><select id="pa-acc">${opts(S.accounts.map(a=>[a.id,a.name+(a.last4?' ••'+a.last4:'')]),S.accounts[0]?S.accounts[0].id:'')}</select>
   <label>Date</label><input id="pa-date" type="date" value="${todayISO()}">
   <label>Note</label><input id="pa-note" placeholder="optional">
   <button class="btn" data-a="personadd" data-id="${p.id}">Save entry</button>
   <div class="small mute">This only changes this person's balance and the account. It is not counted as income or spending, so your graphs and budgets stay as they are.</div></div>
   <h2>Statement (PDF)</h2><div class="card"><div class="small mute">A bank-style statement of this person: every debit, credit and the running balance.</div>
   <select id="ps-per" style="margin-top:8px"><option value="all">All time</option><option value="m">This month</option><option value="3">Last 3 months</option><option value="y">This year</option></select>
   <button class="btn" data-a="personpdf" data-id="${p.id}">Download statement PDF</button></div>
   <h2>History</h2><div class="card" style="padding:4px 16px">${list.length?list.map(txRow).join(''):'<div class="empty">No entries yet.</div>'}</div>`);
  paDir='debit';refreshDates();
}

/* ---------- demo data ---------- */
function demo(){
  if(!S.accounts.some(a=>a.type==='bank'))S.accounts.unshift({id:'a1',name:'Bank 1',type:'bank',last4:'',open:0},{id:'a2',name:'Bank 2',type:'bank',last4:'',open:0});
  if(!S.accounts.some(a=>a.type==='card'))S.accounts.push({id:'cc1',name:'Credit card',type:'card',last4:'',open:0,limit:0});
  if(!S.people.length)S.people.push({id:'p1',name:'Papa'});
  if(!Object.keys(S.budgets).length)S.budgets={Rent:15000,Card:4680,Investment:5000,Groceries:5000,Fuel:2000,Other:2000};
  if(!S.salary)S.salary=48000;
  const rnd=(a,b)=>Math.round(a+Math.random()*(b-a));const ids=S.accounts.map(a=>a.id);const out=[];
  for(let k=5;k>=0;k--){
    const m=shiftMonth(new Date().toISOString().slice(0,7),-k);const d=n=>m+'-'+String(Math.min(n,28)).padStart(2,'0');
    out.push({date:d(4),type:'credit',amt:48000,acc:ids[0],kind:'income',cat:'Other',note:'Salary'});
    out.push({date:d(5),type:'debit',amt:13500,acc:ids[0],kind:'expense',cat:'Rent',note:'Rent'});
    out.push({date:d(5),type:'debit',amt:1500,acc:ids[0],kind:'expense',cat:'Rent',note:'Society maintenance'});
    out.push({date:d(6),type:'debit',amt:5000,acc:ids[0],kind:'expense',cat:'Investment',note:'Mutual fund SIP'});
    [['DMart',rnd(1800,2600),'Groceries'],['Blinkit',rnd(900,1500),'Groceries'],['Zomato',rnd(250,600),'Food'],['RPS Pizzeria',rnd(500,800),'Food'],['Petrol pump',rnd(900,1200),'Fuel'],['Jio recharge',rnd(299,749),'Bills'],['Amazon',rnd(400,1800),'Shopping']].forEach(([n,a,c],i)=>out.push({date:d(8+i*3),type:'debit',amt:a,acc:ids[i%2],kind:'expense',cat:c,note:n}));
    out.push({date:d(12),type:'debit',amt:rnd(3000,6000),acc:ids[0],kind:'pass',cat:'Other',note:'UPI for business',party:'p1'});
    out.push({date:d(16),type:'credit',amt:rnd(3000,6000),acc:ids[0],kind:'pass',cat:'Other',note:'Papa deposit',party:'p1'});
    if(k%2===0)out.push({date:d(20),type:'credit',amt:rnd(3000,9000),acc:ids[1],kind:'other',cat:'Other',note:'Freelance project'});
  }
  const cashId=(S.accounts.find(x=>accType(x)==='cash')||{}).id,cardId=(S.accounts.find(x=>accType(x)==='card')||{}).id;
  if(cashId&&cardId)for(let k=5;k>=0;k--){
    const m=shiftMonth(new Date().toISOString().slice(0,7),-k);const d=n=>m+'-'+String(Math.min(n,28)).padStart(2,'0');
    out.push({date:d(9),type:'debit',amt:2000,acc:ids[0],to:cashId,kind:'transfer',cat:'Other',note:'ATM withdrawal'});
    out.push({date:d(10),type:'debit',amt:rnd(150,350),acc:cashId,kind:'expense',cat:'Groceries',note:'Vegetables'});
    out.push({date:d(14),type:'debit',amt:rnd(80,200),acc:cashId,kind:'expense',cat:'Travel',note:'Auto'});
    out.push({date:d(11),type:'debit',amt:rnd(500,1800),acc:cardId,kind:'expense',cat:'Shopping',note:'Flipkart'});
    out.push({date:d(18),type:'debit',amt:rnd(300,700),acc:cardId,kind:'expense',cat:'Food',note:'Swiggy'});
    out.push({date:d(25),type:'debit',amt:rnd(1500,2500),acc:ids[0],to:cardId,kind:'transfer',cat:'Other',note:'Credit card bill'});
  }
  out.push({date:new Date().toISOString().slice(0,10),type:'debit',amt:4660,acc:ids[0],kind:'expense',cat:'Medical',note:'Medical',pool:true});
  const today=new Date().toISOString().slice(0,10);
  const dcard=S.accounts.find(a=>a.type==='card');
  if(dcard&&!S.emis.length){if(!dcard.limit)dcard.limit=100000;S.emis.push({id:uid(),name:'Phone',card:dcard.id,amount:24000,months:12,monthly:2200,first:addMonthsISO(todayISO(),-2),before:0,closed:false})}
  out.filter(t=>t.date<=today).forEach(t=>S.tx.push({id:uid(),pool:false,party:'',to:'',src:'manual',...t}));save();

document.addEventListener('pointermove',e=>{
  const sv=e.target.closest&&e.target.closest('svg.pace');if(!sv||!window.__pace)return;
  const P=__pace,r=sv.getBoundingClientRect(),f=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
  const d=Math.min(P.upto,Math.max(1,Math.round(f*(P.dim-1))+1)),pt=P.pts[d-1];if(!pt)return;
  const x=(d-1)/(P.dim-1)*(P.W-10)+5,cur=sv.querySelector('#cur');cur.setAttribute('x1',x);cur.setAttribute('x2',x);cur.setAttribute('opacity',.5);
  const tip=$('#tip');tip.style.display='block';tip.textContent=`Day ${d} · ${inr(pt[1])} so far`;
  tip.style.left=Math.min(r.width-120,Math.max(0,x/P.W*r.width-50))+'px';tip.style.top='-6px';
});

{const i=document.getElementById('intro');if(i){setTimeout(()=>i.classList.add('out'),2300);setTimeout(()=>i.remove(),2800)}}

/* text shared to the installed web app (e.g. a bank SMS: Share -> Arthaly) arrives as ?text=... */
(function(){
  const q=new URLSearchParams(location.search),sh=q.get('text')||q.get('title')||q.get('url');
  if(!sh)return;
  hrep({k:'view',v:'home'},location.pathname);
  const r=addFromSms(sh);
  if(r.out.length){render();toast(`Added ${r.out.length}: ${r.out[0].t.type==='debit'?'−':'+'}${inr(r.out[0].t.amt)}${r.out[0].matched?'':' (assign account)'}`)}
  else if(r.bad[0]==='duplicate')toast('Already added');
  else smsFallback(sh);
})();
/* installable web app: works offline after the first load (skipped inside the Android app and for local files) */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&location.hostname!=='localhost'&&!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())){navigator.serviceWorker.register('sw.js').catch(()=>{})}
