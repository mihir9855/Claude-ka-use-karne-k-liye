<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f1ee">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Arthaly – Expense & Budget Tracker</title>
<style>
:root{
  --bg:#f6f7f5;--card:#fff;--ink:#14201d;--mute:#6b7773;--line:#e6e9e6;
  --brand:#0f766e;--brand-soft:#d9efec;--debit:#d1495b;--credit:#1a9f6b;--warn:#d98e04;
  --shadow:0 1px 2px rgba(20,32,29,.05),0 6px 20px rgba(20,32,29,.06);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0e1514;--card:#16201e;--ink:#e8efed;--mute:#8fa09b;--line:#233230;
  --brand:#2bb5a8;--brand-soft:#17332f;--debit:#ef6f7f;--credit:#3ccf93;--warn:#f0b43a;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom));min-height:100vh}
h1{font-size:20px;margin:0}h2{font-size:13px;margin:22px 0 10px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.mute{color:var(--mute)}.small{font-size:12px}.num{font-variant-numeric:tabular-nums}
.debit{color:var(--debit)}.credit{color:var(--credit)}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.month{display:flex;align-items:center;gap:6px}
.icon-btn{border:0;background:var(--card);color:var(--ink);width:34px;height:34px;border-radius:50%;box-shadow:var(--shadow);font-size:16px;cursor:pointer}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand);font-size:11px;font-weight:600}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;border-radius:9px;background:var(--brand)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:18px;margin-top:2px}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.acc{flex:0 0 78%;scroll-snap-align:start;border-radius:18px;padding:14px 16px;color:#fff;position:relative;overflow:hidden;cursor:pointer}
.acc small{opacity:.85}.acc b{display:block;font-size:22px;margin:6px 0 8px}
.acc .io{display:flex;gap:14px;font-size:12px;opacity:.95}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tx:last-child{border:0}
.dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:17px;background:var(--brand-soft);flex:none}
.tx .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center}
nav button{border:0;background:none;color:var(--mute);padding:6px 0;font:inherit;font-size:11px;cursor:pointer}
nav button span{display:block;font-size:19px;line-height:1.2}nav button.on{color:var(--brand);font-weight:600}
.fab{width:54px;height:54px;border-radius:50%;background:var(--brand)!important;color:#fff!important;font-size:28px!important;margin:-26px auto 0;box-shadow:0 6px 16px color-mix(in srgb,var(--brand) 45%,transparent);display:grid;place-items:center;padding:0!important}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font:inherit;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
label{display:block;font-size:12px;color:var(--mute);margin:12px 0 5px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
textarea{min-height:130px;resize:vertical}
.btn{width:100%;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:600;background:var(--btn,var(--brand));color:var(--btn-ink,#fff);margin-top:16px;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}.btn.red{background:none;color:var(--debit);margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#14201d;color:#fff;padding:10px 16px;border-radius:12px;z-index:20;max-width:90%;font-size:13px}
.legend{display:grid;gap:8px;margin-top:12px}.legend div{display:flex;align-items:center;gap:8px}.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
svg text{fill:var(--mute);font-size:9px}

.hero{background:linear-gradient(140deg,var(--hero1,#16322e) 0%,var(--hero2,#0f766e) 70%,var(--hero3,#2bb5a8) 130%);color:#fff;border-radius:26px;padding:18px;box-shadow:0 14px 30px -14px var(--hero2,#0f766e)}
.hero .big{color:#fff}.hero .sub{opacity:.75;font-size:12px}
.hero .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.hero .chips span{background:rgba(255,255,255,.14);border-radius:12px;padding:6px 10px;font-size:12px;white-space:nowrap}
.eye{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:50%;width:34px;height:34px;font-size:15px;cursor:pointer}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.qa button{border:0;border-radius:18px;padding:14px 2px 12px;color:#fff;font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.qa button span{font-size:20px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;overflow:hidden;border-radius:22px;padding:14px;color:#fff;min-height:138px;cursor:pointer;box-shadow:0 10px 24px -10px var(--c)}
.tile .wm{position:absolute;right:-4px;bottom:-12px;font-size:64px;opacity:.2}
.tile h3{margin:0;font-size:14px;font-weight:700}.tile .pc{position:absolute;right:12px;top:12px;font-size:11px;font-weight:700;background:rgba(255,255,255,.22);border-radius:99px;padding:2px 8px}
.tile .amt{font-size:18px;font-weight:700;margin-top:16px}.tile .of{font-size:11px;opacity:.85}
.tile .tb{height:6px;background:rgba(255,255,255,.3);border-radius:9px;margin-top:10px;overflow:hidden}.tile .tb i{display:block;width:var(--p,0%);height:100%;background:#fff;border-radius:9px}
.tile.over{outline:2px solid #ff4d6d;outline-offset:-2px}
.tile.add{background:var(--card)!important;color:var(--mute);border:2px dashed var(--line);display:grid;place-items:center;box-shadow:none;text-align:center}
.tile.nolim{opacity:.72}
.seg-bar{display:flex;height:10px;border-radius:9px;overflow:hidden;gap:2px;background:rgba(255,255,255,.18)}
.seg-bar i{display:block;height:100%}
.alert{background:#f97316;color:#fff;border-radius:16px;padding:11px 14px;font-size:13px;margin-top:12px}
.alert.ok{background:var(--credit)}
.chips2{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--c,var(--brand));border-color:transparent;color:#fff}
.amt-in{font-size:30px;font-weight:700;border:0;background:var(--card);text-align:center;padding:14px}
.hint{background:#fff7e0;color:#7a5a00;border-radius:12px;padding:8px 12px;font-size:12px;margin-top:8px}
.search{margin-top:10px}
#tip{position:absolute;pointer-events:none;background:#14201d;color:#fff;border-radius:8px;padding:4px 8px;font-size:11px;white-space:nowrap;display:none;z-index:2}

/* appearance: plain option rows */
.opt{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.opt:last-child{border:0}
.rad{width:22px;height:22px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;flex:none}
.rad.on{border-color:var(--ink)}
.rad.on::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink)}
.ic{display:block;flex:none}
nav button span{display:flex;justify-content:center}
.qa button span{display:flex}
.icon-btn{display:inline-grid;place-items:center;padding:0}
.chip{display:inline-flex;align-items:center;gap:6px}
.legend .ic{display:inline-block}
.picker{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.picker button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;height:46px;display:grid;place-items:center;cursor:pointer;padding:0}
.picker button.on{border-color:var(--brand);color:var(--brand)}
.bh{border-radius:12px;padding:8px 12px;font-size:12px;margin-top:8px}
.bh.ok{background:var(--brand-soft);color:var(--ink)}
.bh.warn{background:rgba(251,191,36,.16);color:var(--warn)}
.bh.over{background:rgba(255,107,107,.16);color:var(--debit)}
.alert.soft{background:rgba(251,191,36,.18);color:var(--warn)}
.attn{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.attn:last-child{border:0}
.chart{position:relative}
.gtip{position:absolute;background:#14201d;color:#fff;font-size:11px;padding:3px 8px;border-radius:8px;pointer-events:none;white-space:nowrap;z-index:3}
.pb{margin:12px 0}
.hb{display:grid;grid-template-columns:86px 1fr auto;gap:8px;align-items:center;margin:9px 0;font-size:12px}
.hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.htr{position:relative;height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.htr i{display:block;height:100%;border-radius:9px}
.htr u{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.75}
.ctitle{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.ctitle b{font-size:15px}

/* ===== Earthy themes from the reference: Sage (light) and Cocoa (dark) ===== */
:root[data-theme=sage]{color-scheme:light;--bg:#f6f1ee;--card:#fffdfb;--ink:#4a2c1f;--mute:#9a8a82;--line:#eadfd9;--brand:#7f9a45;--brand-soft:#e7edd8;--btn:#4a2c1f;--btn-ink:#fff;--on-brand:#fff;--debit:#c4573a;--credit:#5f7d2e;--warn:#c9871a;--hero1:#3a2218;--hero2:#5b3a2a;--hero3:#8da35a;--shadow:0 2px 4px rgba(74,44,31,.05),0 12px 28px -8px rgba(74,44,31,.14)}
:root[data-theme=cocoa]{color-scheme:dark;--bg:#1c120e;--card:#2a1c16;--ink:#f6ece6;--mute:#b3a096;--line:#3c2a22;--brand:#a3b86c;--brand-soft:#33401f;--btn:#f1e4d8;--btn-ink:#3a2218;--on-brand:#1c120e;--debit:#ef8a6a;--credit:#a3c46a;--warn:#f2b84b;--hero1:#3a2218;--hero2:#58392a;--hero3:#8da35a;--shadow:none}
[data-theme=sage] body{background:#f6f1ee}[data-theme=cocoa] body{background:#1c120e}
[data-theme=sage] .card,[data-theme=sage] .stat,[data-theme=sage] .hero,[data-theme=cocoa] .card,[data-theme=cocoa] .stat,[data-theme=cocoa] .hero{border-radius:26px}
[data-theme=cocoa] .card,[data-theme=cocoa] .stat{border:1px solid #33241d}
[data-theme=sage] h1,[data-theme=cocoa] h1{font-size:24px;letter-spacing:-.02em}
[data-theme=sage] .big,[data-theme=cocoa] .big{letter-spacing:-.03em}
[data-theme=sage] .seg,[data-theme=cocoa] .seg{border-radius:99px;background:var(--line)}
[data-theme=sage] .seg button,[data-theme=cocoa] .seg button{border-radius:99px}
[data-theme=sage] .seg button.on,[data-theme=cocoa] .seg button.on{background:var(--brand);color:var(--on-brand);box-shadow:none}
[data-theme=sage] .chip.on,[data-theme=cocoa] .chip.on{color:var(--on-brand)}
[data-theme=sage] .pill,[data-theme=cocoa] .pill{background:var(--brand-soft);color:var(--ink)}
[data-theme=sage] .btn,[data-theme=cocoa] .btn{border-radius:99px}
[data-theme=sage] .btn.ghost,[data-theme=cocoa] .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
[data-theme=sage] .btn.red,[data-theme=cocoa] .btn.red{background:none;color:var(--debit);border:0}
[data-theme=sage] .icon-btn,[data-theme=cocoa] .icon-btn{border:1.5px solid var(--line);box-shadow:none;background:transparent}
[data-theme=sage] nav,[data-theme=cocoa] nav{left:50%;right:auto;width:min(456px,calc(100% - 24px));transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));border-radius:34px;background:var(--card);border:1px solid var(--line);padding:8px 10px;box-shadow:0 14px 30px -12px rgba(74,44,31,.4)}
[data-theme=sage] .fab,[data-theme=cocoa] .fab{background:var(--btn)!important;color:var(--btn-ink)!important;margin:0 auto;width:50px;height:50px;box-shadow:none}
[data-theme=sage] #app,[data-theme=cocoa] #app{padding-bottom:calc(112px + env(safe-area-inset-bottom))}
[data-theme=sage] .sheet{background:#f6f1ee}[data-theme=cocoa] .sheet{background:#1c120e}
[data-theme=sage] .toast{background:#4a2c1f;color:#fff}[data-theme=cocoa] .toast{background:#f1e4d8;color:#3a2218}
[data-theme=cocoa] input,[data-theme=cocoa] select,[data-theme=cocoa] textarea{background:#2a1c16;border-color:#3c2a22}
[data-theme=sage] .qa button,[data-theme=cocoa] .qa button{border-radius:22px}
[data-theme=sage] .qa button:nth-child(1),[data-theme=cocoa] .qa button:nth-child(1){background:#8da35a!important}
[data-theme=sage] .qa button:nth-child(2),[data-theme=cocoa] .qa button:nth-child(2){background:#ef8a2a!important}
[data-theme=sage] .qa button:nth-child(3),[data-theme=cocoa] .qa button:nth-child(3){background:#7a4b34!important}
[data-theme=sage] .qa button:nth-child(4),[data-theme=cocoa] .qa button:nth-child(4){background:#d99a1e!important}
[data-theme=sage] .qa button:nth-child(5),[data-theme=cocoa] .qa button:nth-child(5){background:#8f7bd6!important}
[data-theme=sage] .acc:nth-child(3n+1),[data-theme=cocoa] .acc:nth-child(3n+1){background:linear-gradient(135deg,#7a4b34,#5b3a2a)!important}
[data-theme=sage] .acc:nth-child(3n+2),[data-theme=cocoa] .acc:nth-child(3n+2){background:linear-gradient(135deg,#8da35a,#6f8a3a)!important}
[data-theme=sage] .acc:nth-child(3n),[data-theme=cocoa] .acc:nth-child(3n){background:linear-gradient(135deg,#ef8a2a,#c9701a)!important}
[data-theme=sage] .alert.soft{background:#f7e9c8;color:#8a5a0a}[data-theme=cocoa] .alert.soft{background:rgba(242,184,75,.16)}
[data-theme=sage] .hint{background:#f7ecd0;color:#7a5a00}

.dlg-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{background:var(--card);color:var(--ink);border-radius:22px;padding:18px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.btn.danger{background:var(--debit)!important;color:#fff!important}

#intro{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#6a402d,#2b170f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;pointer-events:none;transition:opacity .45s ease,transform .45s ease}
#intro.out{opacity:0;transform:scale(1.04)}
#intro img{width:120px;height:120px;transform:scale(0);animation:ipop2 .6s .1s cubic-bezier(.3,1.6,.5,1) forwards}
#intro .r{fill:none;stroke-linecap:round;transform:rotate(-90deg);transform-origin:256px 256px}
#intro .r1{stroke:#9bb35c;stroke-width:46;stroke-dasharray:1080;stroke-dashoffset:1080;animation:idraw 1.1s .15s cubic-bezier(.5,0,.2,1) forwards}
#intro .r2{stroke:#f08a24;stroke-width:40;stroke-dasharray:730;stroke-dashoffset:730;animation:idraw2 1s .35s cubic-bezier(.5,0,.2,1) forwards}
#intro .dot{opacity:0;animation:ipop .4s 1s forwards}
#intro .core{transform-origin:256px 256px;transform:scale(0);animation:ipop2 .5s .2s cubic-bezier(.3,1.6,.5,1) forwards}
#intro b{font:700 30px/1 Roboto,system-ui,sans-serif;letter-spacing:.06em;color:#f6f1ee;opacity:0;animation:itxt .6s .75s forwards}
#intro small{font:400 13px/1 Roboto,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#c9b6a8;opacity:0;animation:itxt .6s 1s forwards}
@keyframes idraw{to{stroke-dashoffset:300}}
@keyframes idraw2{to{stroke-dashoffset:300}}
@keyframes ipop{to{opacity:1}}
@keyframes ipop2{to{transform:scale(1)}}
@keyframes itxt{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#intro *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div id="intro"><img src="icons/icon-192.png" alt=""><b>Arthaly</b><small>Know where it goes</small></div>
<div id="app"></div>
<nav><div class="in" id="nav"></div></nav>
<div id="layer"></div>
<div id="dlg"></div>
<script>
/* ---------- storage ---------- */
const KEY='arthaly.v1'; // fresh storage: nothing from earlier test versions is carried over
const COLORS=['#0f766e','#6366f1','#d97706','#be185d','#0369a1','#7c3aed'];
const ICONS={
 home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
 target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
 chart:'<path d="M5 20V11M12 20V4M19 20v-6"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14c2.9 0 4.8 1.9 4.8 4.5"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',
 swap:'<path d="M7 7h13l-3-3M17 17H4l3 3"/>',
 message:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
 sliders:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
 palette:'<path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.8 2-1.8 0-.5-.2-.9-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4C21 6.4 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7.5" r="1"/><circle cx="14.5" cy="7.5" r="1"/>',
 eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 eyeoff:'<path d="M3 3l18 18"/><path d="M10.6 6.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1"/>',
 food:'<path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10"/><path d="M17 3c-2 1.5-3 4-3 7h3v11"/>',

function smsAmount(s){
  const m=s.match(/(?:rs|inr|₹|rupees?)\s*[.:\-]*\s*([\d,]+(?:\.\d{1,2})?)/i)||s.match(/([\d,]*\d(?:\.\d{1,2})?)\s*(?:rs|inr|₹)(?![a-z])/i)||s.match(/\b(?:dr|cr|debited|credited|withdrawn|paid|spent|received|deposited)\b[^\d]{0,14}([\d,]*\d\.\d{2})/i);
  return m?parseFloat(m[1].replace(/,/g,'')):0;
}
function parseSms(raw,fallbackIso){
  const s=raw.replace(/\s+/g,' ').trim();
  const amt=smsAmount(s);
  if(!(amt>0))return null;
  const low=s.toLowerCase().replace(/\b(credit|debit) cards?\b/g,' card ');
  const d=low.search(/\b(debited|debit|dr|spent|withdrawn|withdrawal|withdrew|paid|purchase|purchased|sent|deducted|used|transferred to|trf to)\b/);
  const c=low.search(/\b(credited|credit|cr|received|deposited|deposit|refund|reversal|added|transferred from|trf from)\b/);
  let type;
  if(d<0&&c<0)return null;
  type=(c<0||(d>=0&&d<c))?'debit':'credit';
  let last4='';
  const m1=s.match(/[xX*]{2,}\s*(\d{3,4})\b/)||s.match(/(?:a\/c|acct?|account|card)(?:\s*(?:no\.?|number|ending(?: with)?))?\s*[:.]?\s*(\d{4})\b/i);
  if(m1)last4=m1[1].slice(-4);
  const mm=[...s.matchAll(/(?:\bto\b|\bat\b|towards|VPA|Info:?|\bfrom\b|\bby\b)\s+([A-Za-z][A-Za-z0-9@._&\- ]{2,30}?)(?=\s+(?:on|ref|upi|via|avl|bal|not|if|a\/c|ac|\d{2}[-/])|[.,;]|$)/gi)]
    .map(x=>x[1].trim()).filter(x=>!/^(a\/c|ac|acct|account|your|bank|card|rs|inr)\b/i.test(x));
  const party=mm[0]||'';
  let date=fallbackIso?new Date(fallbackIso+'T12:00'):new Date();
  const dm=s.match(/(\d{1,2})[-\/ ](\d{1,2}|[A-Za-z]{3})[-\/ ](\d{2,4})/);
  if(dm){
    const mo=isNaN(dm[2])?['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(dm[2].toLowerCase()):dm[2]-1;
    const y=+dm[3]<100?2000+ +dm[3]:+dm[3];
    if(mo>=0){const t=new Date(y,mo,+dm[1],12);if(!isNaN(t))date=t}
  }
  const iso=new Date(date.getTime()-date.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  return {type,amt,last4,note:party||'SMS',date:iso,cat:type==='debit'?guessCat(s):'Other',kind:type==='credit'?'income':'expense',raw:s};
}
const isoDay=ms=>{const d=new Date(ms);return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
function addFromSms(text,fallbackIso){
  const out=[],bad=[];

    const key=chunk.replace(/\s+/g,' ');
    if(S.seen.includes(key)){bad.push('duplicate');continue}
    const p=parseSms(chunk,fallbackIso);
    if(!p){bad.push('unreadable');continue}
    const a=p.last4&&S.accounts.find(a=>a.last4&&a.last4===p.last4);
    const low=p.raw.toLowerCase(),isCard=a&&accType(a)==='card';
    let kind=p.kind,to='',cat=p.cat;
    if(p.type==='debit'&&/\batm\b|cash withdrawal|cash wdl/.test(low)){const c=S.accounts.find(x=>accType(x)==='cash');if(c){kind='transfer';to=c.id;cat='Other'}}
    else if(p.type==='debit'&&!isCard&&/credit card|card bill|cc bill|card payment|card outstanding/.test(low)){const cs=S.accounts.filter(x=>accType(x)==='card');if(cs.length===1){kind='transfer';to=cs[0].id;cat='Other'}}
    else if(p.type==='credit'&&isCard){
      if(/refund|reversal/.test(low)){kind='expense';cat='Shopping'}
      else{S.seen.push(key);bad.push('card payment');continue}
    }
    const t={id:uid(),date:p.date,type:p.type,amt:p.amt,acc:a?a.id:'',to,kind,cat,note:p.note,party:'',pool:false,src:'sms'};
    S.tx.push(t);S.seen.push(key);out.push({t,last4:p.last4,matched:!!a});
  }

const MON=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];

  if(m=x.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return isoYMD(+m[1],+m[2],+m[3]);

const numOf=x=>{const m=String(x||'').replace(/[,₹\s]/g,'').match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):0};

  const cnt=d=>head.split(d).length-1;
  const delim=[',',';','\t'].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c==='"')q=true;
    else if(c===delim){row.push(cell);cell=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(x=>x.trim()))rows.push(row);row=[]}
    else cell+=c}
  row.push(cell);if(row.some(x=>x.trim()))rows.push(row);

}

const dayDiff=(x,y)=>Math.abs((new Date(x+'T12:00')-new Date(y+'T12:00'))/864e5);
function buildStmt(accId,rows){

  const cash=S.accounts.find(x=>accType(x)==='cash'),cards=S.accounts.filter(x=>accType(x)==='card');
  for(const r of rows){
    const ex=S.tx.find(t=>!used.has(t.id)&&((t.acc===accId&&t.date===r.date&&t.amt===r.amt&&t.type===r.type)||(r.type==='credit'&&t.to===accId&&t.amt===r.amt&&dayDiff(t.date,r.date)<=2)));
    if(ex){used.add(ex.id);dup++;continue}
    const low=r.desc.toLowerCase();
    const c={...r,on:true,kind:r.type==='credit'?'income':'expense',to:'',cat:r.type==='credit'?(/salary/.test(low)?'Salary':'Other'):guessCat(r.desc),pair:'',mergeInto:'',tag:''};

      if(r.type==='debit'){
        const m=S.tx.find(t=>!pairedUsed.has(t.id)&&t.type==='credit'&&(t.kind==='income'||t.kind==='other')&&t.acc&&t.acc!==accId&&t.amt===r.amt&&dayDiff(t.date,r.date)<=2);
        if(m){pairedUsed.add(m.id);c.pair=m.id;c.kind='transfer';c.to=m.acc;c.cat='Other';c.tag='Internal transfer → '+acc(m.acc).name}
      }else{
        const m=S.tx.find(t=>!pairedUsed.has(t.id)&&t.type==='debit'&&t.kind==='expense'&&t.acc&&t.acc!==accId&&t.amt===r.amt&&dayDiff(t.date,r.date)<=2);

/* ---- PDF statements (pdf.js is bundled in the Android app; loaded from a CDN in a plain browser) ---- */
const PDF_CDN='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
async function loadPdfJs(){
  if(window.pdfjsLib)return window.pdfjsLib;
  const add=src=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=no;document.head.appendChild(e)});
  let base='pdfjs/';
  try{await add(base+'pdf.min.js')}catch(e){base=PDF_CDN;await add(base+'pdf.min.js')}
  const code=await (await fetch(base+'pdf.worker.min.js')).text();
  pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
  return pdfjsLib;
}
const AMT_TOKEN=/^\(?-?[\d,]*\d\.\d{2}\)?(?:\s?(?:Dr|Cr)\.?)?$/i;
async function pdfRows(buf){
  const lib=await loadPdfJs();
  let doc,pw;
  for(;;){
    try{doc=await lib.getDocument({data:new Uint8Array(buf.slice(0)),password:pw}).promise;break}
    catch(e){
      if(e&&e.name==='PasswordException'){
        pw=await askText(e.code===2?'Wrong password. Try again':'This PDF is password protected. Enter its password (banks often use customer ID, date of birth or a mix)','','Password','password');
        if(pw==null)throw new Error('cancelled');continue;
      }
      throw e;
    }
  }
  const lines=[];
  for(let n=1;n<=doc.numPages;n++){
    const tc=await (await doc.getPage(n)).getTextContent();
    const items=[];
    tc.items.forEach(i=>{
      const t=(i.str||'').trim();if(!t)return;
      const parts=t.split(/\s+/),w=i.width||0,len=t.length;let off=0;
      parts.forEach(pt=>{const at=t.indexOf(pt,off);items.push({s:pt,x:i.transform[4]+(len?w*at/len:0),y:i.transform[5]-(n-1)*10000});off=at+pt.length});
    });
    items.sort((a,b)=>b.y-a.y||a.x-b.x);
    let cur=null;
    for(const it of items){
      if(cur&&Math.abs(cur.y-it.y)<=2.5)cur.items.push(it);
      else{cur={y:it.y,items:[it]};lines.push(cur)}
    }
    lines.forEach(l=>{l.items.sort((a,b)=>a.x-b.x);
      // glue a lone Dr/Cr token onto the amount before it
      const m=[];l.items.forEach(it=>{if(/^(dr|cr)\.?$/i.test(it.s)&&m.length&&AMT_TOKEN.test(m[m.length-1].s))m[m.length-1].s+=' '+it.s;else m.push(it)});l.items=m;
    });

}
function linesToRows(lines){
  const rows=[];let dx=null,cx=null,prevBal=null,pending=[];
  const DATE=/^(?:\d{1,2}[\/\-. ](?:\d{1,2}|[A-Za-z]{3})[\/\-. ]\d{2,4}|\d{4}-\d{1,2}-\d{1,2})$/;
  const JUNK=/page \d|statement|total|closing|summary|branch|ifsc|customer|a\/c|account no|generated|computer|opening/i;
  // a wrapped narration line may sit above or below the amounts line: give it to the nearer row
  const flush=(next)=>{
    for(const L of pending){
      const prev=rows[rows.length-1];
      const dp=prev?prev.y-L.y:Infinity,dn=next?L.y-next.y:Infinity;
      if(next&&dn<dp)next.pre.push(L.t);else if(prev)prev.post.push(L.t);
    }
    pending=[];
  };
  for(const ln of lines){
    const txt=ln.items.map(i=>i.s).join(' ');
    if(/debit|withdrawal/i.test(txt)&&/credit|deposit/i.test(txt)){
      const d=ln.items.find(i=>/debit|withdrawal|^dr$/i.test(i.s)),c=ln.items.find(i=>/credit|deposit|^cr$/i.test(i.s));
      if(d&&c){dx=d.x;cx=c.x;continue}
    }
    let date=null,used=0;
    for(let st=0;st<=2&&!date;st++){
      for(let k=1;k<=3&&!date;k++){
        const t=ln.items.slice(st,st+k).map(i=>i.s).join(' ');
        if(DATE.test(t)){date=parseAnyDate(t);if(date)used=st+k}
      }
    }
    const amts=ln.items.slice(used).filter(i=>AMT_TOKEN.test(i.s));
    if(!date){
      if(/opening balance|b\/f|brought forward/i.test(txt)&&amts.length)prevBal=numOf(amts[amts.length-1].s);
      else if(!amts.length&&txt.length<90&&!JUNK.test(txt))pending.push({y:ln.y,t:txt});
      continue;
    }
    if(!amts.length)continue;
    const rest=ln.items.slice(used).filter(i=>!AMT_TOKEN.test(i.s));
    const skip=rest.length&&DATE.test(rest[0].s)?1:0;                      // value-date column
    const desc=rest.slice(skip).map(i=>i.s).join(' ');
    if(/opening balance|b\/f|brought forward/i.test(desc)){prevBal=numOf(amts[amts.length-1].s);continue}
    let txn=amts[0],bal=null;
    if(amts.length>=2){bal=amts[amts.length-1];txn=amts[amts.length-2]}
    const amt=Math.abs(numOf(txn.s));if(!(amt>0))continue;
    let type=null;
    const suf=txn.s.match(/(dr|cr)\.?$/i);if(suf)type=suf[1].toLowerCase()==='cr'?'credit':'debit';
    if(!type&&dx!=null&&cx!=null)type=Math.abs(txn.x-dx)<=Math.abs(txn.x-cx)?'debit':'credit';
    if(bal&&prevBal!=null){const delta=numOf(bal.s)-prevBal;if(Math.abs(Math.abs(delta)-amt)<0.02)type=delta>0?'credit':'debit'}
    if(bal)prevBal=numOf(bal.s);

    flush(row);
    if(!type)row.guess=true;
    rows.push(row);
  }
  flush(null);
  return rows.map(r=>{
    const desc=[...r.pre,r.desc,...r.post].join(' ').replace(/\s+/g,' ').trim();
    const type=r.type||(/salary|credit|received|deposit|refund|interest|\bcr\b/i.test(desc)?'credit':'debit');
    return {date:r.date,type,amt:r.amt,desc,note:shortNote(desc)};
  });
}

/* ---------- EMI on a credit card ---------- */
function addMonthsISO(iso,n){
  const [y,m,d]=iso.split('-').map(Number),t=new Date(y,m-1+n,1),last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();

const todayISO=()=>isoDay(Date.now());
/* paid = instalments already paid before using the app + those whose date has passed. The purchase amount blocks

function emiState(p){
  const today=todayISO();let paid=p.before||0;

  const left=p.closed?0:p.months-paid;

/* each instalment that has fallen due becomes an expense on the card (category EMI), once */
function applyEmis(){
  const today=todayISO();let changed=false;
  S.emis.forEach(p=>{
    if(p.closed)return;
    for(let i=p.before||0;i<p.months;i++){
      const date=addMonthsISO(p.first,i);
      if(date>today)break;
      if(!S.tx.some(t=>t.emiId===p.id&&t.emiNo===i+1)){
        S.tx.push({id:uid(),date,type:'debit',amt:p.monthly,acc:p.card,to:'',kind:'expense',cat:'EMI',note:`${p.name} EMI ${i+1}/${p.months}`,party:'',pool:false,src:'emi',emiId:p.id,emiNo:i+1});

}

  const perMonth=live.reduce((a,x)=>a+x.p.monthly,0),rem=live.reduce((a,x)=>a+x.s.remainingAmt,0),blk=live.reduce((a,x)=>a+x.s.blocked,0);

  for(let i=0;i<12;i++){
    const d=new Date(t0.getFullYear(),t0.getMonth()+i,1),mk=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');

function removeAccount(id,target){
  const gone=new Set(S.emis.filter(p=>p.card===id).map(p=>p.id));
  S.emis=S.emis.filter(p=>!gone.has(p.id));
  S.tx=S.tx.filter(t=>!gone.has(t.emiId));
  if(target){
    S.tx.forEach(t=>{if(t.acc===id)t.acc=target;if(t.to===id)t.to=target});
    S.tx=S.tx.filter(t=>!(t.kind==='transfer'&&t.acc&&t.acc===t.to));   // a transfer into itself means nothing
  }else S.tx=S.tx.filter(t=>t.acc!==id&&t.to!==id);
  S.accounts=S.accounts.filter(x=>x.id!==id);

function spendSeries(r){
  const spent=iso=>S.tx.filter(t=>t.date===iso&&t.kind==='expense').reduce((a,t)=>a+(t.type==='debit'?t.amt:-t.amt),0);
  const out=[],now=new Date();
  if(r==='12m'){
    for(let i=11;i>=0;i--){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1),m=d.toISOString().slice(0,7);
      const v=S.tx.filter(t=>t.date.slice(0,7)===m&&t.kind==='expense').reduce((a,t)=>a+(t.type==='debit'?t.amt:-t.amt),0);
      const nm=d.toLocaleDateString('en-IN',{month:'short'});
      out.push({v,l:nm.slice(0,1),tip:nm+' '+d.getFullYear()+' · '+inr(v)});
    }

  }
  if(r==='3m'){
    for(let w=12;w>=0;w--){
      let v=0;const e=new Date(now);e.setDate(e.getDate()-w*7);const b=new Date(e);b.setDate(b.getDate()-6);
      for(let k=0;k<7;k++){const d=new Date(e);d.setDate(d.getDate()-k);v+=spent(isoDay(d.getTime()))}
      out.push({v,l:w%3===0?b.getDate()+'/'+(b.getMonth()+1):'',tip:b.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+' – '+e.toLocaleDateString('en-IN',{day:'numeric',month:'short'})+' · '+inr(v)});
    }

  }
  const n=r==='15'?15:r==='30'?30:7;
  for(let i=n-1;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);const v=spent(isoDay(d.getTime()));

  }

function statsExtra(st){

  out+=`<h2>Saved each month</h2><div class="card">${lineChart(ms.map(x=>x.v),ms.map(x=>x.l))}<div class="small mute">Income minus spending. Below the line means you spent more than you earned.</div></div>`;
  // biggest spends + vs last month, in one chart: paired bars per category
  const lm=mstats(shiftMonth(month,-1));
  const keys=[...new Set([...Object.keys(st.cat),...Object.keys(lm.cat)])].filter(k=>(st.cat[k]||0)>0||(lm.cat[k]||0)>0);
  const rows=keys.map(k=>({k,t:st.cat[k]||0,l:lm.cat[k]||0})).sort((x,y)=>Math.max(y.t,y.l)-Math.max(x.t,x.l)).slice(0,7);
  if(rows.length){
    const mx=Math.max(...rows.map(r=>Math.max(r.t,r.l)),1);
    out+=`<h2>Biggest spends: this month vs last</h2><div class="card">${rows.map(r=>{
      const d=r.l>0?Math.round((r.t-r.l)/r.l*100):null;
      const dt=d==null?(r.t>0?'new':''):(d>0?'▲ '+d+'%':d<0?'▼ '+Math.abs(d)+'%':'same');
      return `<div class="pb"><div class="row sp small"><b>${esc(cname(r.k))}</b><span class="num">${inr(r.t)} <span class="mute">vs ${inr(r.l)}</span> <b style="color:${d>0?'var(--debit)':d<0?'var(--credit)':'var(--mute)'}">${dt}</b></span></div>
      <div class="htr" style="margin-top:5px"><i style="width:${Math.max(r.t>0?1.5:0,r.t/mx*100)}%;background:${CATCOL[r.k]||'var(--brand)'}"></i></div>
      <div class="htr" style="margin-top:3px;height:6px"><i style="width:${Math.max(r.l>0?1.5:0,r.l/mx*100)}%;background:var(--mute);opacity:.45"></i></div></div>`}).join('')}
    <div class="small mute" style="margin-top:6px">Coloured bar = ${mlabel(month)}, grey bar = ${mlabel(shiftMonth(month,-1))}. Red arrow means you spent more than last month.</div></div>`;
  }
  // weekday pattern (last 90 days)
  const sum=Array(7).fill(0),cnt=Array(7).fill(0);
  for(let i=0;i<90;i++){const d=new Date();d.setDate(d.getDate()-i);const wd=(d.getDay()+6)%7,iso=isoDay(d.getTime());cnt[wd]++;sum[wd]+=S.tx.filter(t=>t.date===iso&&t.kind==='expense').reduce((s,t)=>s+(t.type==='debit'?t.amt:-t.amt),0)}
  const avg=sum.map((v,i)=>v/cnt[i]),days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  if(avg.some(v=>v>0)){const hi=avg.indexOf(Math.max(...avg));out+=`<h2>Which days you spend</h2><div class="card">${barChart(avg,days.map(d=>d[0]),{tips:avg.map((v,i)=>days[i]+' · avg '+inr(v)),hl:hi})}<div class="small mute">Average per day, last 90 days. You spend most on ${days[hi]}s.</div></div>`}
  // where money sits
  const sits=S.accounts.map((a,i)=>({k:a.name,v:accBal(a.id),c:COLORS[i%6],ty:accType(a)})).filter(x=>x.ty!=='card'&&x.v>0);
  if(sits.length)out+=`<h2>Where your money sits</h2><div class="card">${miniDonut(sits)}</div>`;
  // card utilisation
  const cards=S.accounts.filter(a=>accType(a)==='card'&&a.limit>0);
  if(cards.length)out+=`<h2>Credit card use</h2><div class="card">${hbars(cards.map(a=>{const due=Math.max(0,-accBal(a.id))+emiBlocked(a.id);return{label:esc(a.name),v:due,max:a.limit,color:due/a.limit>.5?'var(--debit)':'var(--brand)',right:Math.round(due/a.limit*100)+'% of '+inr(a.limit)}}))}<div class="small mute">Keeping this under 30% is good for your credit score.</div></div>`;
  return out;
}

const hpush=s=>{try{history.pushState(s,'')}catch(e){}};
const hrep=(s,u)=>{try{history.replaceState(s,'',u)}catch(e){}};
const hgo=n=>{try{history.go(n)}catch(e){}};
let sheetEntry=false,dlgEntry=false,dlgDone=null,staleSheets=0,suppressPop=0,viewDepth=0;
const dlgIsOpen=()=>!!$('#dlg').innerHTML;
const sheetIsOpen=()=>!!$('#layer').innerHTML;
function openSheet(html){
  $('#layer').innerHTML=`<div class="sheet-bg" data-a="close"><div class="sheet" data-stop>${html}</div></div>`;
  if(!sheetEntry){
    if(staleSheets>0)staleSheets--;                 // reuse a history entry left by a sheet that was just closed in code
    else hpush({k:'sheet'});
    sheetEntry=true;
  }
}
function closeSheet(){
  $('#layer').innerHTML='';
  if(sheetEntry){sheetEntry=false;staleSheets++;setTimeout(settleHistory,0)}
}
// drop leftover sheet entries once no sheet is open again
function settleHistory(){
  if(!sheetIsOpen()&&!dlgIsOpen()&&staleSheets>0){const n=staleSheets;staleSheets=0;suppressPop++;hgo(-n)}
}
/* in-app dialogs: window.confirm/prompt do not work in every webview, so Arthaly draws its own */
function dlgShow(html,done){
  $('#dlg').innerHTML=`<div class="dlg-bg" data-a="dlgcancel"><div class="dlg" data-stop>${html}</div></div>`;dlgDone=done;
  if(!dlgEntry){if(staleSheets>0)staleSheets--;else hpush({k:'sheet'});dlgEntry=true}
}
function dlgClose(val){
  const d=dlgDone;dlgDone=null;$('#dlg').innerHTML='';
  if(dlgEntry){dlgEntry=false;staleSheets++;setTimeout(settleHistory,0)}
  if(d)d(val);
}

  <div class="row" style="gap:10px;margin-top:16px"><button class="btn ghost" data-a="dlgno" style="margin:0">Cancel</button><button class="btn ${danger?'danger':''}" data-a="dlgyes" style="margin:0">${esc(ok||'OK')}</button></div>`,v=>res(v===true)));

function navTo(id){
  accFilter='';scrollTo(0,0);
  if(id!==view){
    if(id==='home'){if(viewDepth>0){viewDepth=0;suppressPop++;hgo(-1)}}
    else if(viewDepth===0){viewDepth=1;hpush({k:'view',v:id})}
    else hrep({k:'view',v:id});
    view=id;
  }
  render();
}
hrep({k:'view',v:'home'});
window.addEventListener('popstate',e=>{
  if(suppressPop>0){suppressPop--;return}
  if(dlgIsOpen()){const d=dlgDone;dlgDone=null;$('#dlg').innerHTML='';dlgEntry=false;if(d)d(null);return}   // back cancels a dialog
  if(sheetIsOpen()){
    $('#layer').innerHTML='';sheetEntry=false;                                                       // back closes the open sheet
    if(staleSheets>0){const n=staleSheets;staleSheets=0;suppressPop++;hgo(-n)}
    return;
  }
  const st=e.state;
  if(st&&st.k==='sheet'){if(staleSheets>0)staleSheets--;hgo(-1);return}                              // skip a leftover entry
  view=(st&&st.k==='view')?st.v:'home';viewDepth=view==='home'?0:1;accFilter='';render();
});

    out.push({date:d(11),type:'debit',amt:rnd(500,1800),acc:cardId,kind:'expense',cat:'Shopping',note:'Flipkart'});
    out.push({date:d(18),type:'debit',amt:rnd(300,700),acc:cardId,kind:'expense',cat:'Food',note:'Swiggy'});
    out.push({date:d(25),type:'debit',amt:rnd(1500,2500),acc:ids[0],to:cardId,kind:'transfer',cat:'Other',note:'Credit card bill'});
  }
  out.push({date:new Date().toISOString().slice(0,10),type:'debit',amt:4660,acc:ids[0],kind:'expense',cat:'Medical',note:'Medical',pool:true});
  const today=new Date().toISOString().slice(0,10);
  const dcard=S.accounts.find(a=>a.type==='card');
  if(dcard&&!S.emis.length){if(!dcard.limit)dcard.limit=100000;S.emis.push({id:uid(),name:'Phone',card:dcard.id,amount:24000,months:12,monthly:2200,first:addMonthsISO(todayISO(),-2),before:0,closed:false})}
  out.filter(t=>t.date<=today).forEach(t=>S.tx.push({id:uid(),pool:false,party:'',to:'',src:'manual',...t}));save();
}
document.addEventListener('pointermove',e=>{
  const sv=e.target.closest&&e.target.closest('svg.pace');if(!sv||!window.__pace)return;
  const P=__pace,r=sv.getBoundingClientRect(),f=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
  const d=Math.min(P.upto,Math.max(1,Math.round(f*(P.dim-1))+1)),pt=P.pts[d-1];if(!pt)return;
  const x=(d-1)/(P.dim-1)*(P.W-10)+5,cur=sv.querySelector('#cur');cur.setAttribute('x1',x);cur.setAttribute('x2',x);cur.setAttribute('opacity',.5);
  const tip=$('#tip');tip.style.display='block';tip.textContent=`Day ${d} · ${inr(pt[1])} so far`;
  tip.style.left=Math.min(r.width-120,Math.max(0,x/P.W*r.width-50))+'px';tip.style.top='-6px';
});

/* text shared to the installed web app (e.g. a bank SMS: Share -> Arthaly) arrives as ?text=... */
(function(){
  const q=new URLSearchParams(location.search),sh=q.get('text')||q.get('title')||q.get('url');
  if(!sh)return;
  hrep({k:'view',v:'home'},location.pathname);
  const r=addFromSms(sh);
  if(r.out.length){render();toast(`Added ${r.out.length}: ${r.out[0].t.type==='debit'?'−':'+'}${inr(r.out[0].t.amt)}${r.out[0].matched?'':' (assign account)'}`)}
  else if(r.bad[0]==='duplicate')toast('Already added');
  else smsFallback(sh);
})();
/* installable web app: works offline after the first load (skipped inside the Android app and for local files) */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&location.hostname!=='localhost'&&!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())){navigator.serviceWorker.register('sw.js').catch(()=>{})}
