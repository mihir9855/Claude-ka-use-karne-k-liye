<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Paisa – Expense & Budget Tracker</title>
<style>
:root{
  --bg:#f6f7f5;--card:#fff;--ink:#14201d;--mute:#6b7773;--line:#e6e9e6;
  --brand:#0f766e;--brand-soft:#d9efec;--debit:#d1495b;--credit:#1a9f6b;--warn:#d98e04;
  --shadow:0 1px 2px rgba(20,32,29,.05),0 6px 20px rgba(20,32,29,.06);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0e1514;--card:#16201e;--ink:#e8efed;--mute:#8fa09b;--line:#233230;
  --brand:#2bb5a8;--brand-soft:#17332f;--debit:#ef6f7f;--credit:#3ccf93;--warn:#f0b43a;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom));min-height:100vh}
h1{font-size:20px;margin:0}h2{font-size:13px;margin:22px 0 10px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.grow{flex:1;min-width:0}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.mute{color:var(--mute)}.small{font-size:12px}.num{font-variant-numeric:tabular-nums}
.debit{color:var(--debit)}.credit{color:var(--credit)}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.month{display:flex;align-items:center;gap:6px}
.icon-btn{border:0;background:var(--card);color:var(--ink);width:34px;height:34px;border-radius:50%;box-shadow:var(--shadow);font-size:16px;cursor:pointer}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--brand-soft);color:var(--brand);font-size:11px;font-weight:600}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;border-radius:9px;background:var(--brand)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:18px;margin-top:2px}
.hscroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.acc{flex:0 0 78%;scroll-snap-align:start;border-radius:18px;padding:14px 16px;color:#fff;position:relative;overflow:hidden;cursor:pointer}
.acc small{opacity:.85}.acc b{display:block;font-size:22px;margin:6px 0 8px}
.acc .io{display:flex;gap:14px;font-size:12px;opacity:.95}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.tx:last-child{border:0}
.dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:17px;background:var(--brand-soft);flex:none}
.tx .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center}
nav button{border:0;background:none;color:var(--mute);padding:6px 0;font:inherit;font-size:11px;cursor:pointer}
nav button span{display:block;font-size:19px;line-height:1.2}nav button.on{color:var(--brand);font-weight:600}
.fab{width:54px;height:54px;border-radius:50%;background:var(--brand)!important;color:#fff!important;font-size:28px!important;margin:-26px auto 0;box-shadow:0 6px 16px color-mix(in srgb,var(--brand) 45%,transparent);display:grid;place-items:center;padding:0!important}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font:inherit;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom))}
label{display:block;font-size:12px;color:var(--mute);margin:12px 0 5px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
textarea{min-height:130px;resize:vertical}
.btn{width:100%;border:0;border-radius:14px;padding:13px;font:inherit;font-weight:600;background:var(--brand);color:#fff;margin-top:16px;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}.btn.red{background:none;color:var(--debit);margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#14201d;color:#fff;padding:10px 16px;border-radius:12px;z-index:20;max-width:90%;font-size:13px}
.legend{display:grid;gap:8px;margin-top:12px}.legend div{display:flex;align-items:center;gap:8px}.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.empty{text-align:center;color:var(--mute);padding:28px 10px}
svg text{fill:var(--mute);font-size:9px}

.hero{background:linear-gradient(140deg,var(--hero1,#16322e) 0%,var(--hero2,#0f766e) 70%,var(--hero3,#2bb5a8) 130%);color:#fff;border-radius:26px;padding:18px;box-shadow:0 14px 30px -14px var(--hero2,#0f766e)}
.hero .big{color:#fff}.hero .sub{opacity:.75;font-size:12px}
.hero .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.hero .chips span{background:rgba(255,255,255,.14);border-radius:12px;padding:6px 10px;font-size:12px;white-space:nowrap}
.eye{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:50%;width:34px;height:34px;font-size:15px;cursor:pointer}
.qa{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.qa button{border:0;border-radius:18px;padding:12px 2px 10px;color:#fff;font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.qa button span{font-size:20px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;overflow:hidden;border-radius:22px;padding:14px;color:#fff;min-height:138px;cursor:pointer;box-shadow:0 10px 24px -10px var(--c)}
.tile .wm{position:absolute;right:-4px;bottom:-12px;font-size:64px;opacity:.2}
.tile h3{margin:0;font-size:14px;font-weight:700}.tile .pc{position:absolute;right:12px;top:12px;font-size:11px;font-weight:700;background:rgba(255,255,255,.22);border-radius:99px;padding:2px 8px}
.tile .amt{font-size:18px;font-weight:700;margin-top:16px}.tile .of{font-size:11px;opacity:.85}
.tile .tb{height:6px;background:rgba(255,255,255,.3);border-radius:9px;margin-top:10px;overflow:hidden}.tile .tb i{display:block;width:var(--p,0%);height:100%;background:#fff;border-radius:9px}
.tile.over{outline:2px solid #ff4d6d;outline-offset:-2px}
.tile.add{background:var(--card)!important;color:var(--mute);border:2px dashed var(--line);display:grid;place-items:center;box-shadow:none;text-align:center}
.tile.nolim{opacity:.72}
.seg-bar{display:flex;height:10px;border-radius:9px;overflow:hidden;gap:2px;background:rgba(255,255,255,.18)}
.seg-bar i{display:block;height:100%}
.alert{background:#f97316;color:#fff;border-radius:16px;padding:11px 14px;font-size:13px;margin-top:12px}
.alert.ok{background:var(--credit)}
.chips2{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--c,var(--brand));border-color:transparent;color:#fff}
.amt-in{font-size:30px;font-weight:700;border:0;background:var(--card);text-align:center;padding:14px}
.hint{background:#fff7e0;color:#7a5a00;border-radius:12px;padding:8px 12px;font-size:12px;margin-top:8px}
.search{margin-top:10px}
#tip{position:absolute;pointer-events:none;background:#14201d;color:#fff;border-radius:8px;padding:4px 8px;font-size:11px;white-space:nowrap;display:none;z-index:2}

/* ===== Theme 2: Neon (dark, glowing, vertical-bar tiles) ===== */
:root[data-theme=neon]{color-scheme:dark;
  --bg:#0a0a10;--card:#17171f;--ink:#f3f3f8;--mute:#8d8d9e;--line:#262632;
  --brand:#8b6cff;--brand-soft:#2a2352;--debit:#ff6b86;--credit:#4ade80;--warn:#fbbf24;--shadow:none}
[data-theme=neon] body{background:radial-gradient(520px 320px at 85% -60px,#2b1f6e 0,transparent 70%),radial-gradient(420px 260px at -10% 30%,#10343a 0,transparent 70%),var(--bg);background-attachment:fixed}
[data-theme=neon] .hero{background:linear-gradient(140deg,var(--hero1,#1d1740),var(--hero2,#3b2a9c) 75%,var(--hero3,#6d4cff) 140%);box-shadow:0 0 40px -10px var(--hero3,#7c5cff)}
[data-theme=neon] .card,[data-theme=neon] .stat{border:1px solid #20202b}
[data-theme=neon] .tiles{display:flex;overflow-x:auto;gap:14px;margin:0 -16px;padding:8px 16px 26px;scroll-snap-type:x mandatory;scrollbar-width:none}
[data-theme=neon] .tiles::-webkit-scrollbar{display:none}
[data-theme=neon] .tile{flex:0 0 44%;min-height:230px;border-radius:32px;scroll-snap-align:start;box-shadow:0 0 34px -6px var(--c)}
[data-theme=neon] .tile .pc{left:14px;right:auto;top:auto;bottom:46px;background:none;padding:0;font-size:12px;opacity:.9}
[data-theme=neon] .tile .amt{position:absolute;left:14px;bottom:16px;margin:0;font-size:15px}
[data-theme=neon] .tile .of{display:none}
[data-theme=neon] .tile h3{font-size:17px;max-width:70%;line-height:1.2}
[data-theme=neon] .tile .wm{right:auto;left:-6px;bottom:50px;font-size:78px;opacity:.16}
[data-theme=neon] .tile .tb{position:absolute;right:16px;top:20px;bottom:20px;width:6px;height:auto;margin:0;background:rgba(255,255,255,.28)}
[data-theme=neon] .tile .tb i{position:absolute;left:0;right:0;bottom:0;width:100%;height:var(--p,0%)}
[data-theme=neon] .tile.add{flex:0 0 40%;background:#12121a!important;border-color:#2a2a38}
[data-theme=neon] #txlist{background:none!important;box-shadow:none!important;padding:0!important;border:0!important}
[data-theme=neon] .tx{background:var(--card);border-radius:20px;padding:13px 14px;margin-bottom:10px;border:0}
[data-theme=neon] .dot{border-radius:50%}
[data-theme=neon] nav{left:50%;right:auto;width:min(456px,calc(100% - 24px));transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));border-radius:34px;background:#000;border:1px solid #24242f;padding:8px 10px}
[data-theme=neon] nav button{color:#7d7d8c}[data-theme=neon] nav button.on{color:#fff}
[data-theme=neon] .fab{background:#fff!important;color:#000!important;margin:0 auto;box-shadow:0 0 22px -2px rgba(255,255,255,.55);width:50px;height:50px}
[data-theme=neon] .sheet{background:#0f0f16}
[data-theme=neon] .toast{background:#fff;color:#000}
[data-theme=neon] #app{padding-bottom:calc(112px + env(safe-area-inset-bottom))}
[data-theme=neon] .alert{background:#7c2d12;color:#ffd7b0}[data-theme=neon] .alert.ok{background:#14532d;color:#bbf7d0}
[data-theme=neon] .hint{background:#3a2f0a;color:#fde68a}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.themes button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:10px;font:inherit;cursor:pointer;text-align:left}
.themes button.on{border-color:var(--brand)}
.themes i{display:block;height:46px;border-radius:10px;margin-bottom:6px}

.ic{display:block;flex:none}
nav button span{display:flex;justify-content:center}
.qa button span{display:flex}
.icon-btn{display:inline-grid;place-items:center;padding:0}
.chip{display:inline-flex;align-items:center;gap:6px}
.legend .ic{display:inline-block}
.picker{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.picker button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;height:46px;display:grid;place-items:center;cursor:pointer;padding:0}
.picker button.on{border-color:var(--brand);color:var(--brand)}

/* ===== Theme 3: Black (pure AMOLED black, flat, monochrome) ===== */
:root[data-theme=black]{color-scheme:dark;
  --bg:#000;--card:#111;--ink:#fff;--mute:#8a8a8a;--line:#1f1f1f;
  --brand:#fff;--brand-soft:#1e1e1e;--debit:#ff6b6b;--credit:#4ade80;--warn:#fbbf24;--shadow:none}
[data-theme=black] body{background:#000}
[data-theme=black] .card,[data-theme=black] .stat,[data-theme=black] .acc,[data-theme=black] .qa button{border:1px solid #1f1f1f}
[data-theme=black] .hero{background:#111;border:1px solid #1f1f1f;box-shadow:none;color:#fff}
[data-theme=black] .hero .chips span,[data-theme=black] .eye{background:#1e1e1e}
[data-theme=black] .acc{background:#111!important}
[data-theme=black] .qa button{background:#111!important;color:#fff}
[data-theme=black] .qa button:nth-child(1) span{color:#a78bfa}
[data-theme=black] .qa button:nth-child(2) span{color:#4ade80}
[data-theme=black] .qa button:nth-child(3) span{color:#2dd4bf}
[data-theme=black] .qa button:nth-child(4) span{color:#60a5fa}
[data-theme=black] .qa button:nth-child(5) span{color:#fb923c}
[data-theme=black] .tile{background:#111!important;color:#fff;box-shadow:none;border:1px solid #1f1f1f}
[data-theme=black] .tile .pc{background:none;color:var(--c);padding:0}
[data-theme=black] .tile .tb{background:#242424}
[data-theme=black] .tile .tb i{background:var(--c)}
[data-theme=black] .tile .wm{color:var(--c);opacity:.2}
[data-theme=black] .tile.over{outline:1.5px solid #ff6b6b}
[data-theme=black] .tile.add{background:#000!important;border:2px dashed #2a2a2a}
[data-theme=black] .bar{background:#222}
[data-theme=black] nav{background:#000;border-top:1px solid #1a1a1a}
[data-theme=black] nav button.on{color:#fff}
[data-theme=black] .fab{background:#fff!important;color:#000!important;box-shadow:none}
[data-theme=black] .btn{background:#fff;color:#000}
[data-theme=black] .btn.ghost{background:#161616;color:#fff}
[data-theme=black] .btn.red{background:none;color:var(--debit)}
[data-theme=black] .seg{background:#161616}[data-theme=black] .seg button.on{background:#2a2a2a;color:#fff;box-shadow:none}
[data-theme=black] .sheet{background:#0a0a0a}
[data-theme=black] input,[data-theme=black] select,[data-theme=black] textarea{background:#111;border-color:#242424}
[data-theme=black] input:focus,[data-theme=black] select:focus,[data-theme=black] textarea:focus{border-color:#fff}
[data-theme=black] .chip.on{color:#000}
[data-theme=black] .pill{background:#1e1e1e;color:#fff}
[data-theme=black] .toast{background:#fff;color:#000}
[data-theme=black] .alert{background:#2a1608;color:#ffcf9f;border:1px solid #4a2a10}[data-theme=black] .alert.ok{background:#0b2414;color:#bbf7d0;border:1px solid #14452a}
[data-theme=black] .hint{background:#241d05;color:#fde68a}
[data-theme=black] .picker button.on{border-color:#fff;color:#fff}
.themes{grid-template-columns:repeat(3,1fr)}

.bh{border-radius:12px;padding:8px 12px;font-size:12px;margin-top:8px}
.bh.ok{background:var(--brand-soft);color:var(--ink)}
.bh.warn{background:rgba(251,191,36,.16);color:var(--warn)}
.bh.over{background:rgba(255,107,107,.16);color:var(--debit)}
.alert.soft{background:rgba(251,191,36,.18);color:var(--warn)}
.attn{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.attn:last-child{border:0}

.chart{position:relative}
.gtip{position:absolute;background:#14201d;color:#fff;font-size:11px;padding:3px 8px;border-radius:8px;pointer-events:none;white-space:nowrap;z-index:3}
.pb{margin:12px 0}
.hb{display:grid;grid-template-columns:86px 1fr auto;gap:8px;align-items:center;margin:9px 0;font-size:12px}
.hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.htr{position:relative;height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.htr i{display:block;height:100%;border-radius:9px}
.htr u{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.75}
.ctitle{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.ctitle b{font-size:15px}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.swatches button.on{border-color:var(--ink)}
</style>
</head>
<body>
<div id="app"></div>
<nav><div class="in" id="nav"></div></nav>
<div id="layer"></div>
<script>
/* ---------- storage ---------- */
const KEY='paisa.v1';
const COLORS=['#0f766e','#6366f1','#d97706','#be185d','#0369a1','#7c3aed'];
const ICONS={
 home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
 target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2"/>',
 chart:'<path d="M5 20V11M12 20V4M19 20v-6"/>',
 users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14c2.9 0 4.8 1.9 4.8 4.5"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',

 sliders:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
 palette:'<path d="M12 3a9 9 0 1 0 0 18c1.2 0 2-.8 2-1.8 0-.5-.2-.9-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4C21 6.4 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7.5" r="1"/><circle cx="14.5" cy="7.5" r="1"/>',
 eye:'<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 eyeoff:'<path d="M3 3l18 18"/><path d="M10.6 6.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7c1.7 0 3.2-.4 4.5-1"/>',
 food:'<path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10"/><path d="M17 3c-2 1.5-3 4-3 7h3v11"/>',
 cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l2-8H6"/>',
 fuel:'<path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16"/><path d="M3 21h12M6 8h6"/><path d="M14 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V9l-3-3"/>',
 bag:'<path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
 bulb:'<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>',
 medical:'<path d="M10 4h4v6h6v4h-6v6h-4v-6H4v-4h6z"/>',
 train:'<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14"/><circle cx="9" cy="14" r=".8"/><circle cx="15" cy="14" r=".8"/><path d="M8 17l-2 4M16 17l2 4"/>',
 trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',

    const ex=S.tx.find(t=>!used.has(t.id)&&((t.acc===accId&&t.date===r.date&&t.amt===r.amt&&t.type===r.type)||(r.type==='credit'&&t.to===accId&&t.amt===r.amt&&dayDiff(t.date,r.date)<=2)));
    if(ex){used.add(ex.id);dup++;continue}
    const low=r.desc.toLowerCase();
    const c={...r,on:true,kind:r.type==='credit'?'income':'expense',to:'',cat:r.type==='credit'?(/salary/.test(low)?'Salary':'Other'):guessCat(r.desc),pair:'',mergeInto:'',tag:''};
    if(r.type==='debit'&&/\batm\b|cash withdrawal|cash wdl|\bnwd\b|\bnfs\b/.test(low)&&cash&&cash.id!==accId){c.kind='transfer';c.to=cash.id;c.cat='Other';c.tag='ATM → '+cash.name}
    else if(r.type==='debit'&&!isCard&&/credit card|card bill|cc bill|card payment|card outstanding|cred club/.test(low)&&cards.length===1){c.kind='transfer';c.to=cards[0].id;c.cat='Other';c.tag='Card bill → '+cards[0].name}
    else if(r.type==='credit'&&isCard){c.kind='transfer';c.cat='Other';c.tag='Card payment received'}
    if(c.kind==='expense'||c.kind==='income'){

        if(m){pairedUsed.add(m.id);c.pair=m.id;c.kind='transfer';c.to=m.acc;c.cat='Other';c.tag='Internal transfer → '+acc(m.acc).name}
      }else{
        const m=S.tx.find(t=>!pairedUsed.has(t.id)&&t.type==='debit'&&t.kind==='expense'&&t.acc&&t.acc!==accId&&t.amt===r.amt&&dayDiff(t.date,r.date)<=2);
        if(m){pairedUsed.add(m.id);c.mergeInto=m.id;c.tag='Same as '+acc(m.acc).name+' debit: becomes a transfer'}

/* ---- PDF statements (pdf.js is bundled in the Android app; loaded from a CDN in a plain browser) ---- */
const PDF_CDN='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
async function loadPdfJs(){
  if(window.pdfjsLib)return window.pdfjsLib;
  const add=src=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=src;e.onload=ok;e.onerror=no;document.head.appendChild(e)});
  let base='pdfjs/';
  try{await add(base+'pdf.min.js')}catch(e){base=PDF_CDN;await add(base+'pdf.min.js')}
  const code=await (await fetch(base+'pdf.worker.min.js')).text();
  pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
  return pdfjsLib;
}
const AMT_TOKEN=/^\(?-?[\d,]*\d\.\d{2}\)?(?:\s?(?:Dr|Cr)\.?)?$/i;
async function pdfRows(buf){
  const lib=await loadPdfJs();
  let doc,pw;
  for(;;){
    try{doc=await lib.getDocument({data:new Uint8Array(buf.slice(0)),password:pw}).promise;break}
    catch(e){
      if(e&&e.name==='PasswordException'){
        pw=prompt(e.code===2?'Wrong password. Try again:':'This PDF is password protected. Enter its password (banks often use customer ID, date of birth or a mix):');
        if(pw==null)throw new Error('cancelled');continue;
      }
      throw e;
    }
  }
  const lines=[];
  for(let n=1;n<=doc.numPages;n++){
    const tc=await (await doc.getPage(n)).getTextContent();
    const items=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str.trim(),x:i.transform[4],y:i.transform[5]-(n-1)*10000}));
    items.sort((a,b)=>b.y-a.y||a.x-b.x);
    let cur=null;
    for(const it of items){
      if(cur&&Math.abs(cur.y-it.y)<=2.5)cur.items.push(it);
      else{cur={y:it.y,items:[it]};lines.push(cur)}
    }
    lines.forEach(l=>l.items.sort((a,b)=>a.x-b.x));
  }
  return linesToRows(lines);
}
function linesToRows(lines){
  const rows=[];let dx=null,cx=null,prevBal=null,pending=[];
  const DATE=/^\d{1,2}[\/\-. ](?:\d{1,2}|[A-Za-z]{3})[\/\-. ]\d{2,4}$/;
  const JUNK=/page \d|statement|total|closing|summary|branch|ifsc|customer|a\/c|account no|generated|computer|opening/i;
  // a wrapped narration line may sit above or below the amounts line: give it to the nearer row
  const flush=(next)=>{
    for(const L of pending){
      const prev=rows[rows.length-1];
      const dp=prev?prev.y-L.y:Infinity,dn=next?L.y-next.y:Infinity;
      if(next&&dn<dp)next.pre.push(L.t);else if(prev)prev.post.push(L.t);
    }
    pending=[];
  };
  for(const ln of lines){
    const txt=ln.items.map(i=>i.s).join(' ');
    if(/debit|withdrawal/i.test(txt)&&/credit|deposit/i.test(txt)){
      const d=ln.items.find(i=>/debit|withdrawal|^dr$/i.test(i.s)),c=ln.items.find(i=>/credit|deposit|^cr$/i.test(i.s));
      if(d&&c){dx=d.x;cx=c.x}
    }
    let date=null,used=0;
    for(let k=1;k<=3&&!date;k++){
      const t=ln.items.slice(0,k).map(i=>i.s).join(' ');
      if(DATE.test(t)){date=parseAnyDate(t);used=k}
    }
    const amts=ln.items.slice(used).filter(i=>AMT_TOKEN.test(i.s));
    if(!date){
      if(/opening balance|b\/f|brought forward/i.test(txt)&&amts.length)prevBal=numOf(amts[amts.length-1].s);
      else if(!amts.length&&txt.length<90&&!JUNK.test(txt))pending.push({y:ln.y,t:txt});
      continue;
    }
    if(!amts.length)continue;
    const rest=ln.items.slice(used).filter(i=>!AMT_TOKEN.test(i.s));
    const skip=rest.length&&DATE.test(rest[0].s)?1:0;                      // value-date column
    const desc=rest.slice(skip).map(i=>i.s).join(' ');
    if(/opening balance|b\/f|brought forward/i.test(desc)){prevBal=numOf(amts[amts.length-1].s);continue}
    let txn=amts[0],bal=null;
    if(amts.length>=2){bal=amts[amts.length-1];txn=amts[amts.length-2]}
    const amt=Math.abs(numOf(txn.s));if(!(amt>0))continue;
    let type=null;
    const suf=txn.s.match(/(dr|cr)\.?$/i);if(suf)type=suf[1].toLowerCase()==='cr'?'credit':'debit';
    if(!type&&dx!=null&&cx!=null)type=Math.abs(txn.x-dx)<=Math.abs(txn.x-cx)?'debit':'credit';
    if(bal&&prevBal!=null){const delta=numOf(bal.s)-prevBal;if(Math.abs(Math.abs(delta)-amt)<0.02)type=delta>0?'credit':'debit'}
    if(bal)prevBal=numOf(bal.s);
    const row={date,amt:Math.round(amt*100)/100,y:ln.y,desc,type,pre:[],post:[]};
    flush(row);
    if(!type)row.guess=true;
    rows.push(row);
  }
  flush(null);
  return rows.map(r=>{
    const desc=[...r.pre,r.desc,...r.post].join(' ').replace(/\s+/g,' ').trim();
    const type=r.type||(/salary|credit|received|deposit|refund|interest|\bcr\b/i.test(desc)?'credit':'debit');
    return {date:r.date,type,amt:r.amt,desc,note:shortNote(desc)};
  });
}

function doStmt(){

/* ---------- internal transfer finder ---------- */
function findPairs(){
  const used=new Set(),out=[];
  const ds=S.tx.filter(t=>t.type==='debit'&&t.kind==='expense'&&t.acc).sort((a,b)=>a.date.localeCompare(b.date));
  for(const d of ds){
    const c=S.tx.find(t=>!used.has(t.id)&&t.type==='credit'&&(t.kind==='income'||t.kind==='other')&&t.acc&&t.acc!==d.acc&&t.amt===d.amt&&dayDiff(t.date,d.date)<=2);
    if(c&&!S.ignored.includes(d.id+c.id)){used.add(c.id);out.push({d,c})}
  }
  return out;
}
function mergePair(dId,cId){
  const d=S.tx.find(t=>t.id===dId),c=S.tx.find(t=>t.id===cId);if(!d||!c)return;

}

  for(const t of S.tx){
    if(!t.date.startsWith(mk))continue;
    const v=t.type==='debit'?t.amt:-t.amt;

}

function donut(data){

function bars(ms){
  const vals=ms.flatMap(m=>[m.inc+m.oth,m.exp]);const max=Math.max(...vals,1);const W=300,H=120,bw=14,gap=(W-ms.length*bw*2)/(ms.length+1);

  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${out}</svg><div class="row small mute" style="gap:14px"><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--credit)"></i> Income</span><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--debit)"></i> Spent</span></div>`;

function pace(mk,st){
  const [y,mo]=mk.split('-').map(Number);const dim=new Date(y,mo,0).getDate();

}

function dailyCard(st){
  const [y,mo]=month.split('-').map(Number),dim=new Date(y,mo,0).getDate();
  const vals=Array.from({length:dim},(_,i)=>st.day[i+1]||0);
  const now=new Date(),upto=month===now.toISOString().slice(0,7)?now.getDate():dim;
  const avg=vals.slice(0,upto).reduce((a,b)=>a+b,0)/Math.max(1,upto),mx=Math.max(...vals),top=vals.indexOf(mx);
  return `<h2>Daily spending</h2><div class="card">${barChart(vals,vals.map((_,i)=>(i===0||(i+1)%5===0)?String(i+1):''),{tips:vals.map((v,i)=>`${i+1} ${mlabel(month).slice(0,3)} · ${inr(v)}`),colors:vals.map(v=>v>avg*1.8&&v>0?'var(--warn)':'var(--brand)'),line:avg})}<div class="small mute">${mx>0?`Biggest day: ${top+1} ${mlabel(month).slice(0,3)} (${inr(mx)}). Amber bars are well above your average.`:'No spending this month yet.'}</div></div>`;
}
function statsExtra(st){
  let out='';
  // savings trend
  const ms=[];for(let i=5;i>=0;i--){const m=shiftMonth(month,-i),x=mstats(m);ms.push({l:mlabel(m).slice(0,3),v:x.inc+x.oth-x.exp})}
  out+=`<h2>Saved each month</h2><div class="card">${lineChart(ms.map(x=>x.v),ms.map(x=>x.l))}<div class="small mute">Income minus spending. Below the line means you spent more than you earned.</div></div>`;
  // biggest spends + vs last month, in one chart: paired bars per category
  const lm=mstats(shiftMonth(month,-1));
  const keys=[...new Set([...Object.keys(st.cat),...Object.keys(lm.cat)])].filter(k=>(st.cat[k]||0)>0||(lm.cat[k]||0)>0);
  const rows=keys.map(k=>({k,t:st.cat[k]||0,l:lm.cat[k]||0})).sort((x,y)=>Math.max(y.t,y.l)-Math.max(x.t,x.l)).slice(0,7);
  if(rows.length){
    const mx=Math.max(...rows.map(r=>Math.max(r.t,r.l)),1);
    out+=`<h2>Biggest spends: this month vs last</h2><div class="card">${rows.map(r=>{
      const d=r.l>0?Math.round((r.t-r.l)/r.l*100):null;
      const dt=d==null?(r.t>0?'new':''):(d>0?'▲ '+d+'%':d<0?'▼ '+Math.abs(d)+'%':'same');
      return `<div class="pb"><div class="row sp small"><b>${esc(cname(r.k))}</b><span class="num">${inr(r.t)} <span class="mute">vs ${inr(r.l)}</span> <b style="color:${d>0?'var(--debit)':d<0?'var(--credit)':'var(--mute)'}">${dt}</b></span></div>
      <div class="htr" style="margin-top:5px"><i style="width:${Math.max(r.t>0?1.5:0,r.t/mx*100)}%;background:${CATCOL[r.k]||'var(--brand)'}"></i></div>
      <div class="htr" style="margin-top:3px;height:6px"><i style="width:${Math.max(r.l>0?1.5:0,r.l/mx*100)}%;background:var(--mute);opacity:.45"></i></div></div>`}).join('')}
    <div class="small mute" style="margin-top:6px">Coloured bar = ${mlabel(month)}, grey bar = ${mlabel(shiftMonth(month,-1))}. Red arrow means you spent more than last month.</div></div>`;
  }
  // weekday pattern (last 90 days)
  const sum=Array(7).fill(0),cnt=Array(7).fill(0);
  for(let i=0;i<90;i++){const d=new Date();d.setDate(d.getDate()-i);const wd=(d.getDay()+6)%7,iso=isoDay(d.getTime());cnt[wd]++;sum[wd]+=S.tx.filter(t=>t.date===iso&&t.kind==='expense').reduce((s,t)=>s+(t.type==='debit'?t.amt:-t.amt),0)}
  const avg=sum.map((v,i)=>v/cnt[i]),days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  if(avg.some(v=>v>0)){const hi=avg.indexOf(Math.max(...avg));out+=`<h2>Which days you spend</h2><div class="card">${barChart(avg,days.map(d=>d[0]),{tips:avg.map((v,i)=>days[i]+' · avg '+inr(v)),hl:hi})}<div class="small mute">Average per day, last 90 days. You spend most on ${days[hi]}s.</div></div>`}
  // where money sits
  const sits=S.accounts.map((a,i)=>({k:a.name,v:accBal(a.id),c:COLORS[i%6],ty:accType(a)})).filter(x=>x.ty!=='card'&&x.v>0);
  if(sits.length)out+=`<h2>Where your money sits</h2><div class="card">${miniDonut(sits)}</div>`;
  // card utilisation
  const cards=S.accounts.filter(a=>accType(a)==='card'&&a.limit>0);
  if(cards.length)out+=`<h2>Credit card use</h2><div class="card">${hbars(cards.map(a=>{const due=Math.max(0,-accBal(a.id));return{label:esc(a.name),v:due,max:a.limit,color:due/a.limit>.5?'var(--debit)':'var(--brand)',right:Math.round(due/a.limit*100)+'% of '+inr(a.limit)}}))}<div class="small mute">Keeping this under 30% is good for your credit score.</div></div>`;
  return out;
}

  <div id="w-poolsrc" hidden><label>From which income source</label><select id="f-poolsrc">${srcOptions(t.poolSrc||'')}</select></div></div>
  <div id="w-source"><label>Income source</label><select id="f-source">${srcOptions(t.source===undefined?(isNew&&S.sources[0]?S.sources[0].id:''):t.source)}</select></div>
  <div id="w-party"><label>Person / party</label><select id="f-party">${opts(S.people.map(p=>[p.id,p.name]),t.party)}</select></div>
  <label>Note</label><input id="f-note" value="${esc(t.note)}" placeholder="e.g. DMart groceries">
  <label>Date</label><input id="f-date" type="date" value="${t.date}">
  <button class="btn" data-a="savetx" data-id="${t.id}">Save</button>${isNew?'':`<button class="btn red" data-a="deltx" data-id="${t.id}">Delete</button>`}</div>
  <div id="tab-s" hidden><label>Paste bank SMS (separate several with a blank line)</label><textarea id="f-sms" placeholder="Rs.4337.86 debited from A/c XX3370 on 29-09-26 to DMART. Avl bal Rs.5200"></textarea>
  <button class="btn" data-a="parse">Detect & add</button></div>
  <div id="tab-st" hidden><label>Import a bank statement (CSV) into</label><select id="st-acc">${opts(S.accounts.filter(a=>accType(a)!=='cash').map(a=>[a.id,a.name+(a.last4?' ••'+a.last4:'')]),(S.accounts.find(a=>accType(a)==='bank')||{}).id)}</select>
  <p class="small mute">Choose the statement as PDF or CSV from net banking (PDFs with a password are fine, you will be asked). Everything is read on your phone, nothing is uploaded. Rows already in the app are skipped; ATM, card-bill and internal transfers are spotted.</p>
  <button class="btn" data-a="stmtpick">Choose statement (PDF or CSV)</button></div>`);
  syncKind();
  if(preset&&preset.tab==='s'){$('#tab-m').hidden=true;$('#tab-s').hidden=false;document.querySelectorAll('#tabseg button').forEach((b,i)=>b.classList.toggle('on',i===1))}
  else if(isNew)setTimeout(()=>{const a=$('#f-amt');a&&a.focus()},60);
}
function syncKind(){
  const k=$('#f-kind');if(!k)return;const v=k.value;
  $('#w-cat').style.display=(v==='pass'||v==='transfer')?'none':'';$('#w-party').style.display=v==='pass'?'':'none';
  $('#w-to').hidden=v!=='transfer';$('#acc-label').textContent=v==='transfer'?'From account':'Account';
  $('#w-pool').style.display=v==='expense'?'':'none';$('#cat-label').textContent=v==='expense'?'Category':'Income type';
  $('#w-source').style.display=v==='other'?'':'none';$('#w-poolsrc').hidden=!(v==='expense'&&$('#f-pool').checked);
  const list=v==='expense'?CATS:ICATS,cur=$('#f-cat').value;
  if(!(cur in list))$('#f-cat').value=v==='expense'?'Other':v==='other'?'Freelance':'Salary';
  $('#f-cats').innerHTML=chipsHTML(v,$('#f-cat').value);$('#smart').innerHTML='';updateBHint();
}

/* ---------- render & events ---------- */
function render(){
  $('#app').innerHTML={home,stats,people:khata,accounts,budget:budgetView}[view]();
  const nav=[['home','home','Home'],['budget','target','Budget'],['add','+',''],['stats','chart','Insights'],['people','users','Ledger']];
  $('#nav').innerHTML=nav.map(([k,i,l])=>k==='add'?`<button class="fab" data-a="new">+</button>`:`<button class="${view===k?'on':''}" data-a="nav" data-id="${k}"><span>${ic(i,22)}</span>${l}</button>`).join('');
}
let tt='debit';
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.dataset.a==='close'&&e.target.closest('[data-stop]')&&!e.target.closest('button[data-a=close]'))return;
  const a=el.dataset.a,id=el.dataset.id;
  if(a==='nav'){view=id;accFilter='';render();scrollTo(0,0)}
  else if(a==='mprev'){month=shiftMonth(month,-1);render()}
  else if(a==='mnext'){month=shiftMonth(month,1);render()}
  else if(a==='filter'){accFilter=accFilter===id?'':id;render()}
  else if(a==='seg'){seg=id;render()}
  else if(a==='new'){txSheet()}
  else if(a==='accent'){S.accents[S.theme]=id;save();applyAccent();render()}
  else if(a==='theme'){S.theme=id==='toggle'?({fresh:'neon',neon:'black',black:'fresh'}[S.theme]):id;save();applyTheme();render()}
  else if(a==='eye'){S.hide=!S.hide;save();render()}
  else if(a==='qa'){
    if(id==='exp')txSheet();
    else if(id==='inc')txSheet(null,{type:'credit',kind:'income'});
    else if(id==='party')txSheet(null,{kind:'pass'});
    else if(id==='xfer'){const c=S.accounts.find(x=>accType(x)==='cash');txSheet(null,{kind:'transfer',to:c?c.id:''})}
    else txSheet(null,{tab:'s'});
  }
  else if(a==='tile')catSheet(id);
  else if(a==='addbudget'){newIcon='star';budgetSheet()}
  else if(a==='pickicon'){newIcon=id;document.querySelectorAll('#b-icons button').forEach(b=>b.classList.toggle('on',b.dataset.id===id))}
  else if(a==='seticon'){const [ck,ik]=id.split('|');S.icons[ck]=ik;CATS[ck]=ik;save();render();catSheet(ck)}
  else if(a==='savelim'){const v=parseFloat($('#f-lim').value)||0;if(v>0)S.budgets[id]=v;else delete S.budgets[id];save();closeSheet();render()}
  else if(a==='rmlim'){delete S.budgets[id];save();closeSheet();render()}
  else if(a==='addin'){closeSheet();txSheet(null,{cat:id})}
  else if(a==='savebudget'){
    const sel=$('#b-cat').value,lim=parseFloat($('#b-lim').value);
    const k=sel==='__new'?addCategory($('#b-name').value,newIcon):sel;
    if(!k||!(lim>0)){toast('Pick a category and enter a limit');return}
    S.budgets[k]=lim;save();closeSheet();render();
  }
  else if(a==='cat'){catTouched=true;$('#f-cat').value=id;document.querySelectorAll('#f-cats .chip').forEach(b=>b.classList.toggle('on',b.dataset.id===id));$('#smart').innerHTML='';updateBHint()}
  else if(a==='newcat'){
    const n=prompt('New category name?');if(!n||!n.trim())return;
    const k=addCategory(n,'star');
    if(!document.querySelector(`#f-cats [data-id="${k}"]`))el.insertAdjacentHTML('beforebegin',`<button type="button" class="chip" data-a="cat" data-id="${esc(k)}" style="--c:${CATCOL[k]}">${ic(CATS[k],16)}${esc(k)}</button>`);
    document.querySelector(`#f-cats [data-id="${k}"]`).click();
  }
  else if(a==='edit'){const t=S.tx.find(x=>x.id===id);tt=t.type;txSheet(t)}
  else if(a==='close')closeSheet();
  else if(a==='tab'){document.querySelectorAll('#tabseg button').forEach(b=>b.classList.toggle('on',b===el));$('#tab-m').hidden=id!=='m';$('#tab-s').hidden=id!=='s';$('#tab-st').hidden=id!=='st'}
  else if(a==='type'){tt=id;document.querySelectorAll('#typeseg button').forEach(b=>b.classList.toggle('on',b.dataset.id===id));if(id==='credit'&&$('#f-kind').value==='expense'){$('#f-kind').value='income';syncKind()}updateBHint()}
  else if(a==='savetx'){
    const amt=parseFloat($('#f-amt').value);if(!(amt>0)){toast('Enter an amount');return}
    const kind=$('#f-kind').value;
    if(kind==='transfer'&&(!$('#f-acc').value||!$('#f-to').value||$('#f-acc').value===$('#f-to').value)){toast('Pick two different accounts');return}
    const t={id:id||uid(),date:$('#f-date').value,type:kind==='transfer'?'debit':tt,to:kind==='transfer'?$('#f-to').value:'',amt,acc:$('#f-acc').value,kind,cat:kind==='pass'?'Other':$('#f-cat').value,source:kind==='other'?$('#f-source').value:'',poolSrc:(kind==='expense'&&$('#f-pool').checked)?$('#f-poolsrc').value:'',note:$('#f-note').value.trim(),party:kind==='pass'?$('#f-party').value:'',pool:kind==='expense'&&$('#f-pool').checked,src:'manual'};
    const i=S.tx.findIndex(x=>x.id===id);if(i>=0){t.src=S.tx[i].src;S.tx[i]=t}else S.tx.push(t);
    save();closeSheet();render();
    let msg='Saved',ms;
    if(t.kind==='expense'&&t.type==='debit'&&S.budgets[t.cat]>0){
      const lim=S.budgets[t.cat],mk=t.date.slice(0,7),before=catUsed(t.cat,mk,t.id),after=before+t.amt;
      if(after>lim){msg=`${cname(t.cat)} is over budget by ${inr(after-lim)}. Open Budget to cover it.`;ms=5000}
      else if(after/lim>=.8&&before/lim<.8){msg=`${cname(t.cat)} is at ${Math.round(after/lim*100)}% of its budget.`;ms=4000}
    }
    toast(msg,ms);checkBudgetNotify();
  }
  else if(a==='deltx'){S.tx=S.tx.filter(x=>x.id!==id);save();closeSheet();render()}
  else if(a==='parse'){
    const r=addFromSms($('#f-sms').value);closeSheet();render();
    if(r.out.length){const f=r.out[0];toast(`Added ${r.out.length}: ${f.t.type==='debit'?'−':'+'}${inr(f.t.amt)}${f.matched?'':' (assign account)'}`)}
    else toast(r.bad[0]==='duplicate'?'Already added':r.bad[0]==='card payment'?'Card payment received. Counted from your bank SMS.':'Couldn’t read that SMS');
  }
  else if(a==='addsource'){const n=prompt('Income source name? (e.g. a client or project)');if(n&&n.trim()){S.sources.push({id:uid(),name:n.trim()});save();render()}}
  else if(a==='source')sourceSheet(id);
  else if(a==='srcadd'){closeSheet();txSheet(null,{type:'credit',kind:'other',source:id})}
  else if(a==='srcren'){const x=S.sources.find(y=>y.id===id),n=prompt('Rename source',x.name);if(n&&n.trim()){x.name=n.trim();save();closeSheet();render()}}
  else if(a==='srcdel'){
    if(S.tx.some(t=>t.source===id||t.poolSrc===id)){toast('Has entries. Edit or delete them first.');return}
    S.sources=S.sources.filter(y=>y.id!==id);save();closeSheet();render()}
  else if(a==='stmt')pickStatement(id);
  else if(a==='stmtpick')pickStatement($('#st-acc').value);
  else if(a==='stmtrow'){stmt.rows[+id].on=el.checked;const b=$('#stmt-go');if(b)b.textContent='Import '+stmt.rows.filter(r=>r.on).length}
  else if(a==='stmtgo')doStmt();
  else if(a==='pairs')pairsSheet();
  else if(a==='pairmerge'){const [d,c]=id.split('|');mergePair(d,c);save();pairsSheet();render()}
  else if(a==='pairskip'){S.ignored.push(id.replace('|',''));save();pairsSheet();render()}
  else if(a==='pairall'){findPairs().forEach(({d,c})=>mergePair(d.id,c.id));save();closeSheet();render();toast('Merged')}
  else if(a==='fix')fixSheet(id);
  else if(a==='fxmove'){
    const [k,from]=id.split('|'),st=mstats(month),left=(S.budgets[from]||0)-(st.cat[from]||0);
    const amt=Math.min(parseFloat($('#fx-amt').value)||0,left);if(!(amt>0)){toast('Enter an amount');return}
    S.budgets[from]-=amt;S.budgets[k]=(S.budgets[k]||0)+amt;save();closeSheet();render();toast(`Moved ${inr(amt)} from ${cname(from)} to ${cname(k)}`);
  }
  else if(a==='fxbuf'){
    const buf=bufferLeft(month),amt=Math.min(parseFloat($('#fx-amt').value)||0,buf);
    if(!(amt>0)){toast(buf>0?'Enter an amount':'No buffer left');return}
    S.budgets[id]=(S.budgets[id]||0)+amt;save();closeSheet();render();toast(`Added ${inr(amt)} from buffer to ${cname(id)}`);
  }
  else if(a==='notifon'){
    (async()=>{
      if(S.notify){S.notify=false;save();note.sync();render();return}
      if(await note.ask()){S.notify=true;save();note.sync();render();toast('Notifications are on')}
      else toast('Permission denied. Allow notifications in phone settings.');
    })();
  }
  else if(a==='notiftest'){if(!S.notify)return toast('Turn notifications on first');note.send('Paisa','Notifications are working.',99)}
  else if(a==='addperson'){const n=prompt('Name?');if(n&&n.trim()){S.people.push({id:uid(),name:n.trim()});save();render()}}
  else if(a==='person'){personSheet(id)}
  else if(a==='smson')enableSms();
  else if(a==='smsimport')importInbox();
  else if(a==='addacc'){S.accounts.push({id:uid(),name:id==='cash'?'Cash':id==='card'?'Credit card':'Account '+(S.accounts.length+1),type:id||'bank',last4:'',open:0,limit:0});save();render()}
  else if(a==='export'){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='paisa-backup.json';l.click()}
  else if(a==='import'){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>i.files[0].text().then(x=>{try{S=JSON.parse(x);normalize();save();render();toast('Imported')}catch(e){toast('Invalid file')}});i.click()}
  else if(a==='demo'){demo();render();toast('Demo data loaded')}
  else if(a==='reset'){if(confirm('Erase all data?')){S=defaults();normalize();save();render()}}
});
document.addEventListener('input',e=>{
  if(e.target.id==='f-amt')updateBHint();
  if(e.target.id==='q'){q=e.target.value;$('#txlist').innerHTML=txListHTML()}
  else if(e.target.id==='f-note'&&!catTouched&&$('#f-kind').value==='expense'){
    const g=guessCat(e.target.value);
    if(g!=='Other'){$('#f-cat').value=g;document.querySelectorAll('#f-cats .chip').forEach(b=>b.classList.toggle('on',b.dataset.id===g));$('#smart').innerHTML=`<div class="hint">Smart category: ${g}. Tap another chip to change.</div>`}
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='f-date')updateBHint();
  if(e.target.id==='f-pool')$('#w-poolsrc').hidden=!e.target.checked;
  if((e.target.id==='f-source'||e.target.id==='f-poolsrc')&&e.target.value==='__new'){
    const n=prompt('Income source name? (e.g. a client or project)');
    if(n&&n.trim()){const id=uid();S.sources.push({id,name:n.trim()});save();['f-source','f-poolsrc'].forEach(i=>{const el=$('#'+i);el.innerHTML=srcOptions(id)})}
    else e.target.value=S.sources[0]?S.sources[0].id:'';
  }
  if(e.target.id==='b-cat')$('#b-new').hidden=e.target.value!=='__new';
  if(e.target.id==='f-kind'){
    const v=e.target.value,want=(v==='income'||v==='other')?'credit':(v==='expense'||v==='transfer')?'debit':tt;
    if(want!==tt){tt=want;document.querySelectorAll('#typeseg button').forEach(b=>b.classList.toggle('on',b.dataset.id===want))}
    syncKind();
  }
  const f=e.target.dataset.f;if(!f)return;
  if(f==='budget'){S.budget=parseFloat(e.target.value)||0}
  else if(f==='salary'){S.salary=parseFloat(e.target.value)||0}
  else{const a=acc(e.target.dataset.id),v=e.target.value;if(f==='opendue')a.open=-(parseFloat(v)||0);else if(f==='open'||f==='limit')a[f]=parseFloat(v)||0;else a[f]=v.trim()}
  save();render();
});
function sourceSheet(id){
  const name=srcName(id),st=srcStats(id);
  const list=S.tx.filter(t=>(t.kind==='other'&&(t.source||'')===id)||(t.pool&&t.kind==='expense'&&(t.poolSrc||'')===id)).sort((a,b)=>b.date.localeCompare(a.date));
  openSheet(`<div class="row sp"><h1>${esc(name)}</h1><button class="icon-btn" data-a="close">✕</button></div>
   <div class="card" style="margin-top:14px"><div class="big ${st.left<0?'debit':'credit'}">${inr(st.left)}</div><div class="small mute">left to use</div><div class="row sp small mute" style="margin-top:6px"><span>Earned ${inr(st.inc)}</span><span>Used ${inr(st.used)}</span></div></div>
   <button class="btn" data-a="srcadd" data-id="${esc(id)}">+ Add income to ${esc(name)}</button>
   ${id?`<button class="btn ghost" data-a="srcren" data-id="${esc(id)}">Rename</button><button class="btn red" data-a="srcdel" data-id="${esc(id)}">Delete source</button>`:''}
   <h2>History</h2><div class="card" style="padding:4px 16px">${list.length?list.map(txRow).join(''):'<div class="empty">No entries yet</div>'}</div>`);
}
function personSheet(id){
  const p=person(id),list=S.tx.filter(t=>t.kind==='pass'&&t.party===id).sort((a,b)=>b.date.localeCompare(a.date)),b=personBal(id);
  openSheet(`<div class="row sp"><h1>${esc(p.name)}</h1><button class="icon-btn" data-a="close">✕</button></div>
   <div class="card" style="margin-top:14px"><div class="big ${b>0?'debit':'credit'}">${inr(Math.abs(b))}</div><div class="small mute">${b>0?'owes you':b<0?'you owe':'all settled'}</div></div>
   <h2>History</h2><div class="card" style="padding:4px 16px">${list.length?list.map(txRow).join(''):'<div class="empty">No entries. Add a transaction with type “Party / pass-through”.</div>'}</div>`);
}

/* ---------- demo data ---------- */
function demo(){
  const rnd=(a,b)=>Math.round(a+Math.random()*(b-a));const ids=S.accounts.map(a=>a.id);const out=[];
  for(let k=5;k>=0;k--){
    const m=shiftMonth(new Date().toISOString().slice(0,7),-k);const d=n=>m+'-'+String(Math.min(n,28)).padStart(2,'0');
    out.push({date:d(4),type:'credit',amt:48000,acc:ids[0],kind:'income',cat:'Other',note:'Salary'});
    out.push({date:d(5),type:'debit',amt:13500,acc:ids[0],kind:'expense',cat:'Rent',note:'Rent'});
    out.push({date:d(5),type:'debit',amt:1500,acc:ids[0],kind:'expense',cat:'Rent',note:'Society maintenance'});
    out.push({date:d(6),type:'debit',amt:5000,acc:ids[0],kind:'expense',cat:'Investment',note:'Mutual fund SIP'});
    [['DMart',rnd(1800,2600),'Groceries'],['Blinkit',rnd(900,1500),'Groceries'],['Zomato',rnd(250,600),'Food'],['RPS Pizzeria',rnd(500,800),'Food'],['Petrol pump',rnd(900,1200),'Fuel'],['Jio recharge',rnd(299,749),'Bills'],['Amazon',rnd(400,1800),'Shopping']].forEach(([n,a,c],i)=>out.push({date:d(8+i*3),type:'debit',amt:a,acc:ids[i%2],kind:'expense',cat:c,note:n}));
    out.push({date:d(12),type:'debit',amt:rnd(3000,6000),acc:ids[0],kind:'pass',cat:'Other',note:'UPI for business',party:'p1'});
    out.push({date:d(16),type:'credit',amt:rnd(3000,6000),acc:ids[0],kind:'pass',cat:'Other',note:'Papa deposit',party:'p1'});
    if(k%2===0)out.push({date:d(20),type:'credit',amt:rnd(3000,9000),acc:ids[1],kind:'other',cat:'Other',note:'Freelance project'});
  }
  const cashId=(S.accounts.find(x=>accType(x)==='cash')||{}).id,cardId=(S.accounts.find(x=>accType(x)==='card')||{}).id;
  if(cashId&&cardId)for(let k=5;k>=0;k--){
    const m=shiftMonth(new Date().toISOString().slice(0,7),-k);const d=n=>m+'-'+String(Math.min(n,28)).padStart(2,'0');
    out.push({date:d(9),type:'debit',amt:2000,acc:ids[0],to:cashId,kind:'transfer',cat:'Other',note:'ATM withdrawal'});
    out.push({date:d(10),type:'debit',amt:rnd(150,350),acc:cashId,kind:'expense',cat:'Groceries',note:'Vegetables'});
    out.push({date:d(14),type:'debit',amt:rnd(80,200),acc:cashId,kind:'expense',cat:'Travel',note:'Auto'});
    out.push({date:d(11),type:'debit',amt:rnd(500,1800),acc:cardId,kind:'expense',cat:'Shopping',note:'Flipkart'});
    out.push({date:d(18),type:'debit',amt:rnd(300,700),acc:cardId,kind:'expense',cat:'Food',note:'Swiggy'});
    out.push({date:d(25),type:'debit',amt:rnd(1500,2500),acc:ids[0],to:cardId,kind:'transfer',cat:'Other',note:'Credit card bill'});
  }
  out.push({date:new Date().toISOString().slice(0,10),type:'debit',amt:4660,acc:ids[0],kind:'expense',cat:'Medical',note:'Medical',pool:true});
  const today=new Date().toISOString().slice(0,10);
  out.filter(t=>t.date<=today).forEach(t=>S.tx.push({id:uid(),pool:false,party:'',to:'',src:'manual',...t}));save();
}
document.addEventListener('pointermove',e=>{
  const sv=e.target.closest&&e.target.closest('svg.pace');if(!sv||!window.__pace)return;
  const P=__pace,r=sv.getBoundingClientRect(),f=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));
  const d=Math.min(P.upto,Math.max(1,Math.round(f*(P.dim-1))+1)),pt=P.pts[d-1];if(!pt)return;
  const x=(d-1)/(P.dim-1)*(P.W-10)+5,cur=sv.querySelector('#cur');cur.setAttribute('x1',x);cur.setAttribute('x2',x);cur.setAttribute('opacity',.5);
  const tip=$('#tip');tip.style.display='block';tip.textContent=`Day ${d} · ${inr(pt[1])} so far`;
  tip.style.left=Math.min(r.width-120,Math.max(0,x/P.W*r.width-50))+'px';tip.style.top='-6px';
});
render();
drainSms();
