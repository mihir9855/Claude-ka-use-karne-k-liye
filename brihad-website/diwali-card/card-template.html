<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>Happy Diwali | Brihad Temple Construction Co.</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Serif+Gujarati:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Theme: ?theme=night (default) or ?theme=light */
:root{--bg1:#1A1238;--bg2:#3A1640;--bg3:#0E0B22;--gold:#F2C66D;--gold2:#FFE3A3;--text:#FFF6E6;--muted:rgba(255,246,230,.75);--panel:rgba(255,255,255,.07);--line:rgba(242,198,109,.45);--rang1:#F2C66D;--rang2:#E86A8A;--rang3:#8FD3FF;--rang4:#B58CFF}
html.light{--bg1:#FFF4EA;--bg2:#FDE3E6;--bg3:#FFF9F2;--gold:#B7802A;--gold2:#8E5A12;--text:#3A2418;--muted:rgba(58,36,24,.72);--panel:rgba(255,255,255,.75);--line:rgba(183,128,42,.45);--rang1:#E3A23B;--rang2:#E0607E;--rang3:#4FA3D9;--rang4:#8F6BDB}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
body{position:relative;font-family:Inter,sans-serif;color:var(--text);
  background:radial-gradient(900px 700px at 50% 38%,var(--bg2),transparent 70%),linear-gradient(180deg,var(--bg1),var(--bg3))}
.frame{position:absolute;inset:26px;border:2px solid var(--line);border-radius:34px;pointer-events:none}
.frame::after{content:"";position:absolute;inset:10px;border:1px solid var(--line);border-radius:26px;opacity:.6}
/* string lights */
.lights{position:absolute;left:0;right:0;top:0;height:170px}
/* sparkles */
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold2);box-shadow:0 0 12px 3px var(--gold)}
/* top: mantra + emblem */
.mantra{position:absolute;left:50%;top:150px;transform:translateX(-50%);width:230px;aspect-ratio:623/110;background:var(--gold);
  -webkit-mask:url("{{IMG:mantra}}") center/100% 100% no-repeat;mask:url("{{IMG:mantra}}") center/100% 100% no-repeat}
/* rangoli behind the title */
.rangoli{position:absolute;left:50%;top:600px;width:560px;height:560px;transform:translate(-50%,-50%);opacity:.5;-webkit-mask:radial-gradient(circle,#000 60%,transparent 72%);mask:radial-gradient(circle,#000 60%,transparent 72%)}
.rangoli{top:800px;width:500px;height:500px}
html.light .rangoli{opacity:.55}
.title{position:absolute;left:0;right:0;top:236px;text-align:center}
.title h1{margin:0;font:400 150px/1.05 "Great Vibes",cursive;color:var(--gold2);text-shadow:0 0 30px rgba(242,198,109,.55),0 4px 0 rgba(0,0,0,.15)}
html.light .title h1{text-shadow:0 2px 0 rgba(255,255,255,.8)}
.title .gu{margin:6px 0 0;font:600 46px/1.35 "Noto Serif Gujarati",serif;color:var(--gold)}
.title .msg{max-width:780px;margin:26px auto 0;font:400 25px/1.6 Inter,sans-serif;color:var(--muted)}
/* diyas */
.diyas{position:absolute;left:0;right:0;top:740px;display:flex;justify-content:center;gap:56px;align-items:flex-end}
.diya{position:relative;width:150px;height:150px}
.diya.small{width:112px;height:112px}
.diya .glow{position:absolute;left:50%;top:0;width:190px;height:190px;transform:translate(-50%,-38%);border-radius:50%;background:radial-gradient(circle,rgba(255,196,90,.75),rgba(255,140,40,.18) 45%,transparent 70%)}
html.light .diya .glow{background:radial-gradient(circle,rgba(255,180,70,.55),rgba(255,140,40,.12) 45%,transparent 70%)}
.diya svg{position:relative;width:100%;height:100%;overflow:visible}
.flame{transform-origin:75px 70px;animation:flick 1.2s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(1.06,.96) rotate(2deg)}}
/* brand + contact */
.brand{position:absolute;left:66px;right:66px;bottom:66px;display:grid;grid-template-columns:190px 1fr;gap:28px;align-items:center;padding:30px 36px;border-radius:28px;background:var(--panel);border:1.5px solid var(--line);backdrop-filter:blur(6px)}
.emblem{width:190px;aspect-ratio:720/466;background:url("{{IMG:contact_bg}}") center/contain no-repeat}
html:not(.light) .emblem{filter:brightness(1.15)}
.name b{display:block;font:700 40px/1.05 Cinzel,serif;letter-spacing:.06em;color:var(--gold2)}
.name small{display:block;margin-top:6px;font:600 17px/1 Cinzel,serif;letter-spacing:.24em;color:var(--gold)}
.contacts{display:grid;grid-template-columns:auto auto;justify-content:space-between;gap:12px 18px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.contacts div{display:flex;align-items:center;gap:10px;font:600 19.5px/1.2 Inter,sans-serif;white-space:nowrap}
.contacts svg{flex:none;width:30px;height:30px;padding:6px;border-radius:50%;background:var(--gold);color:var(--bg1)}
html.light .contacts svg{color:#fff}
</style>
</head>
<body>
<div class="frame"></div>
<svg class="lights" id="lights" viewBox="0 0 1080 170" preserveAspectRatio="none"></svg>
<div id="sparks"></div>
<svg class="rangoli" id="rangoli" viewBox="-320 -320 640 640"></svg>
<div class="mantra" role="img" aria-label="Shree Ganeshaya Namah"></div>

<div class="title">
 <h1>Happy Diwali</h1>
 <p class="gu">શુભ દીપાવલી · નૂતન વર્ષાભિનંદન</p>
 <p class="msg">May the light of every diya fill your home and your temple with peace, joy and prosperity.</p>
</div>

<div class="diyas">
 <div class="diya small"><div class="glow"></div><svg viewBox="0 0 150 150"></svg></div>
 <div class="diya"><div class="glow"></div><svg viewBox="0 0 150 150"></svg></div>
 <div class="diya small"><div class="glow"></div><svg viewBox="0 0 150 150"></svg></div>
</div>

<div class="brand">
 <div class="emblem" aria-hidden="true"></div>
 <div>
  <div class="name"><b>BRIHAD</b><b style="font-size:27px;letter-spacing:.08em;margin-top:6px">TEMPLE CONSTRUCTION CO.</b><small>SCULPTURE TO STRUCTURE · SINCE 1999</small></div>
  <div class="contacts">
   <div>{{ICON:phone}}{{PHONE1}}</div>
   <div>{{ICON:phone}}{{PHONE2}}</div>
   <div>{{ICON:mail}}{{EMAIL}}</div>
   <div>{{ICON:web}}{{WEBSITE}}</div>
  </div>
 </div>
</div>

<script>
const light=new URLSearchParams(location.search).get('theme')==='light';
if(light)document.documentElement.classList.add('light');
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const NS='http://www.w3.org/2000/svg',el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};

/* rangoli: rings of petals and dots */
const R=document.getElementById('rangoli');
[[300,24,'--rang4',52],[250,20,'--rang3',46],[196,16,'--rang2',42],[140,12,'--rang1',40],[86,8,'--rang2',30]].forEach(([r,n,c,len],k)=>{
 el('circle',{r,fill:'none',stroke:css('--rang1'),'stroke-width':1.5,'stroke-dasharray':'2 8'},R);
 for(let i=0;i<n;i++){const a=i*360/n+(k%2?180/n:0);const g=el('g',{transform:`rotate(${a}) translate(0 ${-r+len/2})`},R);
  el('path',{d:`M0 ${-len/2} C ${len*.42} ${-len/6}, ${len*.42} ${len/6}, 0 ${len/2} C ${-len*.42} ${len/6}, ${-len*.42} ${-len/6}, 0 ${-len/2}Z`,fill:css(c),opacity:.9},g);
  el('circle',{cy:-len/2-8,r:3.5,fill:css('--rang1')},g)}});
el('circle',{r:40,fill:css('--rang1'),opacity:.9},R);el('circle',{r:22,fill:css('--rang2')},R);

/* string lights: two drooping wires with bulbs */
const L=document.getElementById('lights'),cols=['--rang1','--rang2','--rang3','--rang4'];
[[34,110],[18,70]].forEach(([y1,sag],w)=>{
 const d=`M-10 ${y1} Q 265 ${y1+sag} 540 ${y1} Q 815 ${y1+sag} 1090 ${y1}`;el('path',{d,fill:'none',stroke:light?'rgba(80,50,30,.45)':'rgba(255,230,180,.35)','stroke-width':2},L);
 const p=L.lastChild,len=p.getTotalLength();for(let i=1;i<22;i++){const pt=p.getPointAtLength(len*i/22),c=css(cols[(i+w)%4]);
  el('circle',{cx:pt.x,cy:pt.y+10,r:9,fill:c,style:`filter:drop-shadow(0 0 8px ${c})`},L);el('rect',{x:pt.x-4,y:pt.y-2,width:8,height:8,rx:2,fill:light?'#7a5a3a':'#d9c08a'},L)}});

/* sparkles */
const S=document.getElementById('sparks');let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
for(let i=0;i<46;i++){const s=document.createElement('i');s.className='spark';const x=rnd()*1000+40,y=200+rnd()*700;if(x>150&&x<930&&y>240&&y<660)continue;
 const z=2+rnd()*5;s.style.cssText=`left:${x}px;top:${y}px;width:${z}px;height:${z}px;opacity:${.35+rnd()*.6}`;S.appendChild(s)}

/* diyas: clay bowl, painted band, flame */
document.querySelectorAll('.diya svg').forEach(sv=>{
 const defs=el('defs',{},sv);
 const g1=el('linearGradient',{id:'clay'+Math.random(),x1:0,y1:0,x2:0,y2:1},defs);el('stop',{offset:0,'stop-color':'#D9733A'},g1);el('stop',{offset:1,'stop-color':'#7E3216'},g1);
 const g2=el('radialGradient',{id:'fl'+Math.random(),cx:.5,cy:.7,r:.6},defs);el('stop',{offset:0,'stop-color':'#FFFBE0'},g2);el('stop',{offset:.45,'stop-color':'#FFD15A'},g2);el('stop',{offset:1,'stop-color':'#FF7A1A'},g2);
 const fl=el('g',{class:'flame'},sv);
 el('path',{d:'M75 22 C 92 48, 92 66, 75 76 C 58 66, 58 48, 75 22Z',fill:`url(#${g2.id})`,style:'filter:drop-shadow(0 0 10px rgba(255,170,60,.9))'},fl);
 el('path',{d:'M75 46 C 82 58, 81 67, 75 72 C 69 67, 68 58, 75 46Z',fill:'#FFFDF0'},fl);
 el('path',{d:'M14 82 Q 75 70 136 82 Q 128 132 75 134 Q 22 132 14 82Z',fill:`url(#${g1.id})`},sv);
 el('path',{d:'M14 82 Q 75 70 136 82 Q 75 96 14 82Z',fill:'#5A220E'},sv);
 el('path',{d:'M24 98 Q 75 112 126 98',fill:'none',stroke:'#F2C66D','stroke-width':4,'stroke-dasharray':'1 9','stroke-linecap':'round'},sv);
 el('path',{d:'M30 112 Q 75 124 120 112',fill:'none',stroke:'#F6E3B0','stroke-width':2.5},sv);
});
</script>
</body>
</html>
