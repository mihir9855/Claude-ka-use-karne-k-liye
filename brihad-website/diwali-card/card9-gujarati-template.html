<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<title>નૂતન વર્ષાભિનંદન | બૃહદ ટેમ્પલ કન્સ્ટ્રક્શન કં.</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+Gujarati:wght@500;600;700&family=Hind+Vadodara:wght@500;600&family=Cormorant+Garamond:ital,wght@0,600;1,500;1,600&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ivory:#FFFAF1;--maroon:#7A1426;--gold:#A8741E;--gold2:#C99A45;--text:#4A2416;
  --foil:linear-gradient(115deg,#8A5A16 0%,#C9932F 22%,#F6DE9A 42%,#C08A2A 60%,#F2D58A 78%,#9A6A1E 100%)}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
body{position:relative;background:radial-gradient(760px 640px at 50% 32%,#FFF1D9,transparent 70%),var(--ivory);font-family:Inter,sans-serif;color:var(--text)}
.abs{position:absolute}
/* faint line work */
.wheel{background:#B98A3E;-webkit-mask:url("{{WHEELURI}}") center/contain no-repeat;mask:url("{{WHEELURI}}") center/contain no-repeat}

.mantra{left:50%;top:44px;width:230px;transform:translateX(-50%);aspect-ratio:623/110;background:#754437;
  -webkit-mask:url("{{IMG:mantra}}") center/100% 100% no-repeat;mask:url("{{IMG:mantra}}") center/100% 100% no-repeat}
/* aura behind the heads */
.aura{left:295px;top:200px;width:490px;height:490px;border-radius:50%;background:radial-gradient(circle at 50% 42%,#FFE6B8,#F6C27A 58%,#E5A055);
  box-shadow:0 0 0 9px var(--ivory),0 0 0 12px var(--gold2),0 0 0 20px var(--ivory),0 0 0 22px rgba(201,154,69,.55),0 30px 70px -30px rgba(150,80,20,.5)}
.aura::after{content:"";position:absolute;inset:22px;border-radius:50%;border:1px dashed rgba(255,255,255,.7)}
.auraw{left:320px;top:225px;width:440px;height:440px;opacity:.16;background:#FFF6E0}
.dots{display:grid;gap:14px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--gold2)}
.g{left:257px;bottom:calc(1350px - 858px);width:328px}
.l{left:509px;bottom:calc(1350px - 858px);width:383px}
.shadow{left:250px;top:838px;width:580px;height:30px;border-radius:50%;background:radial-gradient(closest-side,rgba(120,60,20,.25),transparent)}
h1{left:0;right:0;top:858px;margin:0;text-align:center;font:600 62px/1 Cinzel,serif;letter-spacing:.14em;color:var(--maroon)}
.sub{left:0;right:0;top:928px;margin:0;text-align:center;font:italic 500 33px/1 "Cormorant Garamond",serif;color:var(--gold)}
.msg{left:200px;right:200px;top:968px;margin:0;text-align:center;font:italic 500 27px/1.3 "Cormorant Garamond",serif;color:#6A3B2A;text-wrap:balance}
.diyas{left:0;top:1046px;width:1080px;height:110px;overflow:visible}
.foot{left:46px;right:46px;bottom:40px;display:grid;grid-template-columns:175px auto 1px auto;gap:18px;align-items:center;justify-content:center;padding-top:22px}
.foot::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold2) 12%,var(--gold2) 88%,transparent)}
.logo{width:175px;aspect-ratio:720/466;background:url("{{IMG:contact_bg}}") center/contain no-repeat}
.name{font:700 23px/1.12 Cinzel,serif;letter-spacing:.03em;color:var(--maroon)}
.tag{margin-top:6px;font:italic 600 18px/1 "Cormorant Garamond",serif;color:var(--gold)}
.bar{align-self:stretch;background:rgba(201,154,69,.55)}
.grid{display:grid;grid-template-columns:auto auto;gap:10px 14px}
.ic{display:flex;align-items:center;gap:8px;font:600 15.5px/1.2 Inter,sans-serif;white-space:nowrap}
.ic svg{flex:none;width:26px;height:26px;padding:5px;border-radius:50%;background:var(--gold);color:#fff}
.deities{left:155px;top:150px;width:770px}

h1{font:700 64px/1.2 "Noto Serif Gujarati",serif!important;letter-spacing:0!important;top:846px!important}
.sub{font:600 34px/1.2 "Noto Serif Gujarati",serif!important;font-style:normal!important;top:930px!important}
.msg{font:500 26px/1.5 "Hind Vadodara",sans-serif!important;font-style:normal!important;top:978px!important;left:180px!important;right:180px!important}
.name.gu{font:700 28px/1.25 "Noto Serif Gujarati",serif;letter-spacing:0}
.vs{left:0;right:0;top:100px;margin:0;text-align:center;font:600 21px/1 "Hind Vadodara",sans-serif;color:#A8741E;letter-spacing:.04em}
.vs::before,.vs::after{content:"";display:inline-block;width:40px;height:1px;background:#C99A45;vertical-align:middle;margin:0 12px}
.sl{top:470px;display:flex;flex-direction:column;align-items:center;gap:8px}
.sl svg{width:44px;height:44px}.sl b{font:700 34px/1 "Noto Serif Gujarati",serif;color:#8A1F1F}
.sl.l1{left:72px}.sl.r1{right:72px}
</style>
</head>
<body>
<div class="abs wheel" style="left:-170px;top:-120px;width:400px;height:400px;opacity:.26;transform:rotate(14deg)"></div>
<div class="abs wheel" style="left:880px;top:-60px;width:240px;height:240px;opacity:.22;transform:rotate(-22deg)"></div>
<div class="abs wheel" style="left:905px;top:330px;width:330px;height:330px;opacity:.24;transform:rotate(31deg)"></div>
<div class="abs wheel" style="left:-110px;top:560px;width:270px;height:270px;opacity:.22;transform:rotate(-8deg)"></div>
<div class="abs wheel" style="left:60px;top:330px;width:120px;height:120px;opacity:.2;transform:rotate(18deg)"></div>
<div class="abs wheel" style="left:940px;top:820px;width:190px;height:190px;opacity:.22;transform:rotate(-35deg)"></div>
<div class="abs wheel" style="left:-60px;top:950px;width:160px;height:160px;opacity:.2;transform:rotate(25deg)"></div>
<svg class="abs" id="lines" style="left:0;top:0;width:1080px;height:1350px" viewBox="0 0 1080 1350"></svg>
<div class="abs mantra" role="img" aria-label="Shree Ganeshaya Namah"></div>
<div class="abs shadow"></div>
<img class="abs deities" src="{{IMG:deities}}" alt="Shree Ganesh ji and Shree Lakshmi ji">
<p class="abs vs">વિક્રમ સંવત ૨૦૮૩</p>
<div class="abs sl l1"><svg viewBox="0 0 40 40"><path d="M20 4v32M4 20h32M20 4h12M36 20v12M20 36H8M4 20V8" fill="none" stroke="#A8741E" stroke-width="3" stroke-linecap="round"/><circle cx="12" cy="12" r="2" fill="#A8741E"/><circle cx="28" cy="12" r="2" fill="#A8741E"/><circle cx="12" cy="28" r="2" fill="#A8741E"/><circle cx="28" cy="28" r="2" fill="#A8741E"/></svg><b>શુભ</b></div>
<div class="abs sl r1"><svg viewBox="0 0 40 40"><path d="M20 4v32M4 20h32M20 4h12M36 20v12M20 36H8M4 20V8" fill="none" stroke="#A8741E" stroke-width="3" stroke-linecap="round"/><circle cx="12" cy="12" r="2" fill="#A8741E"/><circle cx="28" cy="12" r="2" fill="#A8741E"/><circle cx="12" cy="28" r="2" fill="#A8741E"/><circle cx="28" cy="28" r="2" fill="#A8741E"/></svg><b>લાભ</b></div>
<h1 class="abs">નૂતન વર્ષાભિનંદન</h1>
<p class="abs sub">સાલ મુબારક</p>
<p class="abs msg">નવું વર્ષ આપના ઘર-પરિવારમાં સુખ, શાંતિ અને સમૃદ્ધિ લાવે.</p>
<svg class="abs diyas" id="diyas" viewBox="0 0 1080 110"></svg>
<div class="abs foot">
 <div class="logo" role="img" aria-label="Brihad logo"></div>
 <div><div class="name gu">બૃહદ ટેમ્પલ<br>કન્સ્ટ્રક્શન કં.</div><div class="tag">Sculpture to Structure · Since 1999</div></div>
 <i class="bar"></i>
 <div class="grid"><div class="ic">{{ICON:phone}}{{PHONE1}}</div><div class="ic">{{ICON:phone}}{{PHONE2}}</div><div class="ic">{{ICON:mail}}{{EMAIL}}</div><div class="ic">{{ICON:web}}{{WEBSITE}}</div></div>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
/* faint jali lattice and double border */
const L=document.getElementById('lines');const d0=el('defs',{},L);
const pat=el('pattern',{id:'jl',width:46,height:46,patternUnits:'userSpaceOnUse'},d0);
el('path',{d:'M23 0 L46 23 L23 46 L0 23Z',fill:'none',stroke:'#B98A3E','stroke-width':.8},pat);el('circle',{cx:23,cy:23,r:3.5,fill:'none',stroke:'#B98A3E','stroke-width':.8},pat);

el('rect',{x:22,y:22,width:1036,height:1306,rx:22,fill:'none',stroke:'#C99A45','stroke-width':1.5,opacity:.55},L);
el('rect',{x:32,y:32,width:1016,height:1286,rx:16,fill:'none',stroke:'#C99A45','stroke-width':.8,'stroke-dasharray':'2 6',opacity:.5},L);
/* five ornate gold diyas */
const D=document.getElementById('diyas');const dd=el('defs',{},D);
dd.innerHTML='<linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7DE9E"/><stop offset=".45" stop-color="#D3A043"/><stop offset="1" stop-color="#8A5A16"/></linearGradient>'+
 '<linearGradient id="rim" x1="0" x2="1"><stop offset="0" stop-color="#9A6A1E"/><stop offset=".5" stop-color="#FFF0C4"/><stop offset="1" stop-color="#A8741E"/></linearGradient>'+
 '<radialGradient id="glow"><stop offset="0" stop-color="rgba(255,196,90,.75)"/><stop offset=".55" stop-color="rgba(255,170,60,.18)"/><stop offset="1" stop-color="rgba(255,170,60,0)"/></radialGradient>'+
 '<radialGradient id="flame" cx=".5" cy=".75" r=".65"><stop offset="0" stop-color="#FFFDF0"/><stop offset=".35" stop-color="#FFE27A"/><stop offset=".7" stop-color="#FFA53A"/><stop offset="1" stop-color="#F06A12"/></radialGradient>';
[[310,.72],[425,.8],[540,.92],[655,.8],[770,.72]].forEach(([x,s])=>{const g=el('g',{transform:`translate(${x} 92) scale(${s})`},D);
 el('ellipse',{cx:0,cy:-40,rx:62,ry:62,fill:'url(#glow)'},g);
 // flame with inner core and wick
 el('path',{d:'M0 -78 C 14 -58 15 -42 0 -30 C -15 -42 -14 -58 0 -78Z',fill:'url(#flame)'},g);
 el('path',{d:'M0 -56 C 6 -47 6 -40 0 -34 C -6 -40 -6 -47 0 -56Z',fill:'#FFFFF4'},g);
 el('line',{x1:0,y1:-32,x2:0,y2:-24,stroke:'#5A3A12','stroke-width':2},g);
 // bowl: leaf-shaped with spout, scalloped lip, petal band and a small foot
 el('path',{d:'M-46 -22 Q -40 2 0 8 Q 40 2 46 -22 Q 58 -26 64 -32 Q 52 -18 46 -22 Z',fill:'url(#bowl)'},g);
 el('path',{d:'M-46 -22 Q 0 -32 46 -22 Q 0 -14 -46 -22Z',fill:'#6B4412'},g);
 let lip='M-46 -22';for(let i=0;i<8;i++){const x0=-46+i*11.5;lip+=` Q ${x0+5.75} -30 ${x0+11.5} -22`}
 el('path',{d:lip,fill:'none',stroke:'url(#rim)','stroke-width':2.4},g);
 for(let i=-3;i<=3;i++)el('path',{d:`M${i*11} -10 q 4 -7 0 -12 q -4 5 0 12Z`,fill:'#FFF0C4',opacity:.85},g);
 el('path',{d:'M-30 -4 Q 0 6 30 -4',fill:'none',stroke:'#8A5A16','stroke-width':1.2,'stroke-dasharray':'1 4','stroke-linecap':'round'},g);
 el('path',{d:'M-14 8 L -18 16 L 18 16 L 14 8 Z',fill:'url(#bowl)'},g);
 el('ellipse',{cx:0,cy:16,rx:20,ry:3,fill:'#8A5A16'},g)});
</script>
</body>
</html>
