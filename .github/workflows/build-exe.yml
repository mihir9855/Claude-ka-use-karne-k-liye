name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [claude/project-finance-app-pzfrcs]
    paths: [web/**, desktop/**, assets/**, .github/workflows/build-exe.yml]

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the app (React)
        working-directory: web
        run: |
          npm ci
          npm run build:single
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install
      - name: Prepare app files
        working-directory: desktop
        run: |
          mkdir -p app
          cp ../web/dist-single/index.html app/index.html
      - name: Build EXE (portable and installer)
        working-directory: desktop
        run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Brihad-Temple-Finance-exe
          path: desktop/dist/*.exe
      - name: Publish a direct download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Brihad Finance - latest APK and EXE
          body: Always the newest build. Download Brihad-Finance.apk for the phone, and the Setup or Portable exe for Windows.
          files: desktop/dist/*.exe
