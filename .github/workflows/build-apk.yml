name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [claude/project-finance-app-pzfrcs]
    paths: [www/**, assets/**, capacitor.config.json, package.json, .github/workflows/build-apk.yml]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Make app icons
        run: |
          npm install --no-save @capacitor/assets@3.0.5
          npx capacitor-assets generate --android --iconBackgroundColor '#4A4E8C' --iconBackgroundColorDark '#4A4E8C'
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Brihad-Temple-Finance-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
