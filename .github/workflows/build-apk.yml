name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [web/**, scripts/**, android-native/**, capacitor.config.json, package.json, .github/workflows/build-apk.yml]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build the app (React)
        working-directory: web
        run: |
          npm ci
          npm run build:single
      - run: npm install
      - run: npx cap add android
      - name: Add native file tools (save to Downloads, print)
        run: |
          D=android/app/src/main/java/com/mihir/mileagelog
          mkdir -p $D
          cp android-native/FileTools.java android-native/MainActivity.java $D/
      - name: Make app icons
        run: |
          npm install --no-save @capacitor/assets@3.0.5 sharp
          node scripts/make-icon.cjs
          npx capacitor-assets generate --android --iconBackgroundColor '#1f6f5f' --iconBackgroundColorDark '#1f6f5f'
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Mileage-Log-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
