name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ["android-app/**", ".github/workflows/build-apk.yml"]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - name: App icon
        run: npx capacitor-assets generate --android --iconBackgroundColor '#060914' --splashBackgroundColor '#060914'
        continue-on-error: true
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ../DalalStreetArena.apk
      - uses: actions/upload-artifact@v4
        with: { name: DalalStreetArena-apk, path: DalalStreetArena.apk }
      - name: Publish to Release
        env: { GH_TOKEN: "${{ github.token }}" }
        working-directory: .
        run: |
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest DalalStreetArena.apk --title "Dalal Street Arena APK" --notes "Latest Android build. Download DalalStreetArena.apk and install." --target "${{ github.sha }}"
