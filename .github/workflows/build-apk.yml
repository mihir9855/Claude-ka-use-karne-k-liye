name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [claude/project-finance-app-pzfrcs]
    paths: [web/**, assets/**, android-native/**, capacitor.config.json, package.json, .github/workflows/build-apk.yml]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build the app (React)
        working-directory: web
        run: |
          npm ci
          npm run build:single
      - run: npm install
      - run: npx cap add android
      - name: Add native file tools (save to Downloads, print)
        run: |
          D=android/app/src/main/java/com/brihad/templefinance
          mkdir -p $D
          cp android-native/FileTools.java android-native/MainActivity.java $D/
      - name: Make app icons
        run: |
          npm install --no-save @capacitor/assets@3.0.5
          npx capacitor-assets generate --android --iconBackgroundColor '#4A4E8C' --iconBackgroundColorDark '#4A4E8C'
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Brihad-Temple-Finance-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Copy APK with a clean name
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Brihad-Finance.apk
      - name: Publish a direct download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Brihad Finance - latest APK and EXE
          body: Always the newest build. Download Brihad-Finance.apk for the phone, and the Setup or Portable exe for Windows.
          files: Brihad-Finance.apk
