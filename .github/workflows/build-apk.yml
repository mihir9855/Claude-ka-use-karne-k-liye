name: Build Android APK

on:
  push:
    branches: [ccr-c05281a1-0o8b90]
    paths: ['app/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      # A higher number each build, so a new APK installs over the old one.
      - name: Set version code
        run: sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk hamari-thali.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hamari-thali-apk
          path: app/hamari-thali.apk

      - name: Publish a release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" hamari-thali.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Hamari Thali build ${{ github.run_number }}" \
            --notes "Android APK. Download hamari-thali.apk on the phone and install it."
