name: Build English Teacher APK

on:
  workflow_dispatch:
  push:
    paths: [english-teacher/**, .github/workflows/build-english-teacher-apk.yml]

permissions:
  contents: write

# One build at a time per branch: a build may commit new voice clips, and the next one must see them.
concurrency:
  group: english-teacher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: english-teacher
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get voice clips recorded by an earlier build
        run: git pull --rebase origin "$GITHUB_REF_NAME"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app dependencies
        run: npm ci
      # Natural voice: record any sentence that has no clip yet with the Kokoro neural voice,
      # and save the clips in the repo so the next builds (and Android Studio) reuse them.
      - name: Record natural voice for new sentences
        run: |
          npm run voice-list
          MISSING=$(python scripts/make-voices.py --count)
          echo "Clips to record: $MISSING"
          if [ "$MISSING" != "0" ]; then
            sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg
            pip install -q torch --index-url https://download.pytorch.org/whl/cpu
            pip install -q "kokoro==0.9.4" soundfile
            python scripts/make-voices.py
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git add voice
            git commit -m "English Teacher: record natural voice clips"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Build the app
        run: |
          npm run build
          cp dist/index.html English-Teacher.html
          npm run build:apk
          npx cap sync android
      - name: Build debug APK
        working-directory: english-teacher/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../English-Teacher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: English-Teacher-apk
          path: |
            english-teacher/English-Teacher.apk
            english-teacher/English-Teacher.html
      # Also attach the APK to a release, so it downloads straight to a phone (no zip).
      - name: Publish to the "English Teacher (latest)" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: english-teacher-latest
          name: English Teacher (latest)
          prerelease: true
          make_latest: false
          body: |
            Latest English Teacher APK, built from ${{ github.sha }} on ${{ github.ref_name }}.
            Open this page on your Android phone, tap **English-Teacher.apk**, then install it.
            **English-Teacher.html** is the same app as one file: open it in Chrome on a phone or computer.
          files: |
            english-teacher/English-Teacher.apk
            english-teacher/English-Teacher.html
