name: Build Android APK

on:
  push:
    paths: ['index.html', 'app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install and sync web app into Android project
        working-directory: app
        run: |
          npm ci
          npm run sync
      - name: Build debug APKs (lite and full)
        working-directory: app/android
        run: ./gradlew assembleLiteDebug assembleFullDebug --no-daemon
      - name: Inspect APKs (package, permissions, signing)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          for F in lite full; do
            APK=app/android/app/build/outputs/apk/$F/debug/app-$F-debug.apk
            echo "######## $F ########"; ls -l "$APK"
            "$BT/aapt" dump badging "$APK" | grep -E "^(package|uses-permission|sdkVersion|targetSdkVersion)"
            "$BT/apksigner" verify --verbose "$APK" 2>&1 | grep -E "^(Verifies|Verified using v[123] )" || true
            "$BT/zipalign" -c -v 4 "$APK" | tail -1 || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: arthaly-lite-apk
          path: app/android/app/build/outputs/apk/lite/debug/app-lite-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: arthaly-full-apk
          path: app/android/app/build/outputs/apk/full/debug/app-full-debug.apk
