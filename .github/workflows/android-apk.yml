name: Build Android APK

on:
  push:
    paths: ['index.html', 'app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install and sync web app into Android project
        working-directory: app
        run: |
          npm ci
          npm run sync
      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Inspect APK (signing, SDK levels, manifest)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=app/android/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          echo "== badging =="; "$BT/aapt" dump badging "$APK" | head -60
          echo "== signature =="; "$BT/apksigner" verify --verbose --print-certs "$APK" || true
          echo "== alignment =="; "$BT/zipalign" -c -v 4 "$APK" | tail -3 || true
          echo "== native libs =="; unzip -l "$APK" | grep -E "\.so$" | head || true
          echo "== manifest =="; "$BT/aapt" dump xmltree "$APK" AndroidManifest.xml | head -150
      - uses: actions/upload-artifact@v4
        with:
          name: arthaly-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
