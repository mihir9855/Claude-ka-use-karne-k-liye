name: Build Khana Diary APK

# A build starts only on purpose: from "Run workflow", or when the marker file diary/BUILD_APK is changed on this branch.
# Ordinary pushes never build.
on:
  workflow_dispatch:
  push:
    branches: [ccr-c05281a1-0o8b90]
    paths: ['diary/BUILD_APK']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: diary
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: diary/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      # A higher number each build, so a new APK installs over the old one.
      - name: Set version code
        run: sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build release APK
        working-directory: diary/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk khana-diary.apk

      - uses: actions/upload-artifact@v4
        with:
          name: khana-diary-apk
          path: diary/khana-diary.apk

      - name: Publish a release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "diary-${{ github.run_number }}" khana-diary.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Khana Diary build ${{ github.run_number }}" \
            --notes "Android APK. Download khana-diary.apk on the phone and install it."
