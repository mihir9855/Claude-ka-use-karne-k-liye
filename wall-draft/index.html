<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WallDraft</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: drafting sheet on the right (top on phones), property panel on the left like a CAD inspector. */
:root {
  --paper: #f3f5f3; --panel: #ffffff; --ink: #1a2220; --muted: #5b6965; --line: #d3dbd8; --soft: #e8ecea;
  --accent: #1f5fd0; --accent-ink: #ffffff; --dim: #0b7a69; --door: #8a5523; --win: #1c73c4;
  --warn: #c2410c; --sel: #c77700; --wallfill: #e2e8e5; --grid: #e2e7e4; --hatch: #b9c4c0;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-head: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f1514; --panel: #161e1c; --ink: #e2eae7; --muted: #92a29d; --line: #2a3633; --soft: #1e2826;
  --accent: #6b9fff; --accent-ink: #0b1220; --dim: #3fcfb2; --door: #d79c63; --win: #66b5f5;
  --warn: #fb8c4a; --sel: #fbbf24; --wallfill: #1c2624; --grid: #172020; --hatch: #33413e; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0f1514; --panel: #161e1c; --ink: #e2eae7; --muted: #92a29d; --line: #2a3633; --soft: #1e2826;
  --accent: #6b9fff; --accent-ink: #0b1220; --dim: #3fcfb2; --door: #d79c63; --win: #66b5f5;
  --warn: #fb8c4a; --sel: #fbbf24; --wallfill: #1c2624; --grid: #172020; --hatch: #33413e; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.45 var(--f-ui); -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; height: 100%; grid-template-columns: 370px 1fr; grid-template-areas: "panel sheet"; }
.sheet { grid-area: sheet; position: relative; min-width: 0; overflow: hidden;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; }
.panel { grid-area: panel; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line);
  padding-block: 0 40px; }
.panel-in { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; display: grid; gap: 18px; }

svg#draw { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
svg#draw.panning { cursor: grabbing; }

/* Toolbar floating over the sheet */
.tools { position: absolute; top: 10px; left: 10px; right: max(10px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none; }
.tools > * { pointer-events: auto; }
.tgroup { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; box-shadow: 0 1px 2px rgb(0 0 0 / .06); }
.tgroup button { border: 0; background: transparent; padding: 7px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; font-size: 13px; }
.tgroup button + button { border-left: 1px solid var(--line); }
.tgroup button:hover { background: var(--soft); }
.tgroup button:disabled { opacity: .4; cursor: default; background: transparent; }
.tgroup button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.sw { width: 10px; height: 10px; border-radius: 2px; border: 2px solid currentColor; display: inline-block; }
.sw.door { color: var(--door); } .sw.window { color: var(--win); } .sw.vent { color: var(--dim); } .sw.opening { color: var(--muted); border-style: dashed; }
.hint { position: absolute; left: 10px; bottom: 10px; font: 12px var(--f-mono); color: var(--muted); background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 4px 8px; border-radius: 6px; pointer-events: none; }

/* Panel */
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding-block: 16px 2px; }
.brand h1 { font: 600 22px/1 var(--f-head); letter-spacing: .01em; margin: 0; }
.brand h1 b { color: var(--accent); font-weight: 600; }
.brand small { color: var(--muted); font-size: 12px; }
section h2 { font: 600 12px var(--f-head); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px 10px; }
.full { grid-column: 1 / -1; }
label.f { display: grid; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
label.f input, label.f select { width: 100%; min-width: 0; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); font: 14px var(--f-mono); }
label.f select { font-family: var(--f-ui); }
label.f input.err { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, var(--paper)); }
.note { font-size: 12px; color: var(--muted); margin: 6px 0 0; }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab { border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px; }
.tab[aria-current="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.tab.add { border-style: dashed; color: var(--muted); }
.row-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--warn); }
.btn.danger.armed { background: var(--warn); color: #fff; border-color: var(--warn); }

.olist { display: grid; gap: 4px; }
.orow { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 7px 8px; border: 1px solid transparent; border-radius: 6px; cursor: pointer; text-align: left; background: transparent; width: 100%; }
.orow:hover { background: var(--soft); }
.orow[aria-selected="true"] { border-color: var(--sel); background: color-mix(in srgb, var(--sel) 10%, transparent); }
.tag { font: 500 12px var(--f-mono); padding: 2px 6px; border-radius: 4px; border: 1.5px solid currentColor; min-width: 34px; text-align: center; }
.tag.door { color: var(--door); } .tag.window { color: var(--win); } .tag.vent { color: var(--dim); } .tag.opening { color: var(--muted); }
.orow .meta { font: 12.5px var(--f-mono); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.orow .meta span { color: var(--muted); }
.warnchip { font-size: 11px; color: var(--warn); border: 1px solid var(--warn); border-radius: 99px; padding: 1px 7px; white-space: nowrap; }
.empty { color: var(--muted); font-size: 13px; border: 1px dashed var(--line); border-radius: 6px; padding: 10px; }

.editor { border: 1px solid var(--sel); border-radius: 8px; padding: 12px; background: color-mix(in srgb, var(--sel) 5%, var(--panel)); }
.issues { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.issues li { font-size: 12px; color: var(--warn); }

table.q { width: 100%; border-collapse: collapse; font: 12.5px var(--f-mono); font-variant-numeric: tabular-nums; }
table.q td, table.q th { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: right; }
table.q th { font: 600 11px var(--f-head); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
table.q td:first-child, table.q th:first-child { text-align: left; }
table.q tr.tot td { font-weight: 500; border-bottom: 0; }
.scroll-x { overflow-x: auto; }

.modal { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal .box { background: var(--panel); color: var(--ink); border-radius: 10px; width: min(720px, 100%); max-height: 90%; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; border: 1px solid var(--line); }
.modal header { padding: 12px 14px; font: 600 16px var(--f-head); border-bottom: 1px solid var(--line); }
.modal .body { overflow: auto; padding: 14px; min-height: 0; }
.modal .body img { display: block; max-width: 100%; margin: 0 auto; border: 1px solid var(--line); background: #fff; }
.modal .body textarea { width: 100%; min-height: 260px; font: 12px var(--f-mono); padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); }
.modal footer { padding: 10px 14px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; border-top: 1px solid var(--line); }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 60; }

/* Drawing classes (on screen use tokens; exports embed literal colors) */
#draw .wall { fill: url(#hatch); stroke: var(--ink); stroke-width: 2; }
#draw .wallbg { fill: var(--wallfill); }
#draw .hl { stroke: var(--hatch); stroke-width: 1; }
#draw .gnd { stroke: var(--ink); stroke-width: 2; }
#draw .gh { stroke: var(--muted); stroke-width: 1; }
#draw .op { fill: var(--paper); stroke: var(--ink); stroke-width: 1.5; }
#draw .door { stroke: var(--door); fill: none; stroke-width: 1.3; }
#draw .window { stroke: var(--win); fill: none; stroke-width: 1.3; }
#draw .vent { stroke: var(--dim); fill: none; stroke-width: 1.1; }
#draw .opening { stroke: var(--muted); fill: none; stroke-width: 1; stroke-dasharray: 6 4; }
#draw .dash { stroke-dasharray: 7 5; }
#draw .dim { stroke: var(--dim); stroke-width: 1; fill: none; }
#draw .ext { stroke: var(--dim); stroke-width: .7; opacity: .8; }
#draw .dt { fill: var(--dim); font-family: var(--f-mono); }
#draw .lb { fill: var(--ink); font-family: var(--f-mono); font-weight: 500; }
#draw .lbs { fill: var(--muted); font-family: var(--f-mono); }
#draw .cap { fill: var(--ink); font-family: var(--f-head); font-weight: 600; letter-spacing: .08em; }
#draw .tb { fill: var(--panel); stroke: var(--ink); stroke-width: 1.3; }
#draw .tbl { stroke: var(--ink); stroke-width: .8; }
#draw .sel { fill: none; stroke: var(--sel); stroke-width: 2.5; }
#draw .bad { fill: none; stroke: var(--warn); stroke-width: 2.5; stroke-dasharray: 5 3; }
#draw .hit { fill: transparent; cursor: move; }
#draw .pwall { fill: var(--wallfill); stroke: var(--ink); stroke-width: 1.5; }

@media (max-width: 820px) {
  html, body { height: auto; }
  .app { display: block; height: auto; }
  .sheet { position: sticky; top: env(safe-area-inset-top, 0px); height: 50vh; min-height: 300px; z-index: 5; border-bottom: 1px solid var(--line); }
  .panel { border-right: 0; overflow: visible; }
  .panel-in { padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
  .tgroup button { padding: 7px 8px; }
  .tgroup .lbl-l { display: none; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: no-preference) { .tab, .btn, .orow { transition: background-color .12s; } }
</style>
</head>
<body>
<div class="app">
  <main class="sheet" id="sheet">
    <svg id="draw" xmlns="http://www.w3.org/2000/svg" aria-label="Wall elevation drawing"></svg>
    <div class="tools">
      <div class="tgroup" role="group" aria-label="Add opening">
        <button data-add="door" title="Add door"><span class="sw door"></span>Door</button>
        <button data-add="window" title="Add window"><span class="sw window"></span>Window</button>
        <button data-add="vent" title="Add ventilator"><span class="sw vent"></span>Vent</button>
        <button data-add="opening" title="Add plain opening"><span class="sw opening"></span>Opening</button>
      </div>
      <div class="tgroup" role="group" aria-label="History and view">
        <button id="undo" title="Undo (Ctrl+Z)">↶<span class="lbl-l">Undo</span></button>
        <button id="redo" title="Redo (Ctrl+Y)">↷<span class="lbl-l">Redo</span></button>
        <button id="fit" title="Fit drawing to screen">⤢ Fit</button>
      </div>
      <div class="tgroup" role="group" aria-label="Show">
        <button id="tg-plan" aria-pressed="true" title="Show plan strip with door swings">Plan</button>
        <button id="tg-hts" aria-pressed="true" title="Show sill and head heights of each opening">Heights</button>
      </div>
    </div>
    <div class="hint" id="hint">Drag an opening to move it · pinch or scroll to zoom</div>
  </main>

  <aside class="panel">
    <div class="panel-in">
      <div class="brand"><h1>Wall<b>Draft</b></h1><small>site wall elevations</small></div>

      <section>
        <h2>Project</h2>
        <div class="grid2">
          <label class="f full">Project / site name<input id="p-name" type="text" autocomplete="off"></label>
          <label class="f">Units
            <select id="p-unit">
              <option value="mm">Millimetre (mm)</option>
              <option value="cm">Centimetre (cm)</option>
              <option value="m">Metre (m)</option>
              <option value="ftin">Feet-inch (5'6")</option>
              <option value="in">Inch (in)</option>
            </select>
          </label>
          <label class="f">Snap when dragging
            <select id="p-snap">
              <option value="1">Fine</option>
              <option value="10">Normal</option>
              <option value="50">Coarse</option>
            </select>
          </label>
        </div>
      </section>

      <section>
        <h2>Walls</h2>
        <div class="tabs" id="w-tabs"></div>
        <div class="grid2" style="margin-top:10px">
          <label class="f full">Wall name<input id="w-name" type="text" autocomplete="off"></label>
          <label class="f">Length<input id="w-len" class="len" inputmode="decimal" autocomplete="off"></label>
          <label class="f">Height<input id="w-ht" class="len" inputmode="decimal" autocomplete="off"></label>
          <label class="f">Thickness<input id="w-th" class="len" inputmode="decimal" autocomplete="off"></label>
        </div>
        <p class="note" id="unit-note"></p>
        <div class="row-btns">
          <button class="btn" id="w-dup">Duplicate wall</button>
          <button class="btn danger" id="w-del">Delete wall</button>
        </div>
      </section>

      <section>
        <h2>Openings <span id="o-count" style="letter-spacing:0;text-transform:none;font-family:var(--f-mono)"></span></h2>
        <div class="olist" id="o-list" role="listbox" aria-label="Openings on this wall"></div>
      </section>

      <section id="ed" hidden>
        <div class="editor">
          <h2 style="color:var(--ink)">Selected opening <span class="tag" id="e-tag"></span></h2>
          <div class="grid2">
            <label class="f">Type
              <select id="e-type">
                <option value="door">Door</option>
                <option value="window">Window</option>
                <option value="vent">Ventilator</option>
                <option value="opening">Plain opening</option>
              </select>
            </label>
            <label class="f">Mark<input id="e-label" type="text" maxlength="8" autocomplete="off"></label>
            <label class="f">Width<input id="e-w" class="len" inputmode="decimal" autocomplete="off"></label>
            <label class="f">Height<input id="e-h" class="len" inputmode="decimal" autocomplete="off"></label>
            <label class="f">From left end<input id="e-left" class="len" inputmode="decimal" autocomplete="off"></label>
            <label class="f">From right end<input id="e-right" class="len" inputmode="decimal" autocomplete="off"></label>
            <label class="f">Sill (from floor)<input id="e-sill" class="len" inputmode="decimal" autocomplete="off"></label>
            <label class="f">Head (from floor)<input id="e-head" class="len" inputmode="decimal" autocomplete="off"></label>
            <label class="f door-only">Hinge side
              <select id="e-hinge"><option value="L">Left</option><option value="R">Right</option></select>
            </label>
            <label class="f door-only">Opens
              <select id="e-swing"><option value="in">Inside (down in plan)</option><option value="out">Outside (up in plan)</option></select>
            </label>
          </div>
          <ul class="issues" id="e-issues"></ul>
          <div class="row-btns">
            <button class="btn" id="e-center">Center on wall</button>
            <button class="btn" id="e-dup">Duplicate</button>
            <button class="btn danger" id="e-del">Delete</button>
          </div>
        </div>
      </section>

      <section>
        <h2>Areas</h2>
        <div class="scroll-x"><table class="q" id="q-area"></table></div>
      </section>

      <section>
        <h2>Door &amp; window schedule</h2>
        <div class="scroll-x"><table class="q" id="q-sched"></table></div>
      </section>

      <section>
        <h2>Share &amp; backup</h2>
        <div class="row-btns" style="margin-top:0">
          <button class="btn primary" id="x-png">Drawing image</button>
          <button class="btn" id="x-svg">SVG file</button>
          <button class="btn" id="x-text">Copy measurements</button>
          <button class="btn" id="x-json">Backup</button>
          <label class="btn" for="x-import" style="display:inline-block">Restore backup</label>
          <input type="file" id="x-import" accept=".json,application/json" hidden>
          <button class="btn danger" id="x-new">New project</button>
        </div>
        <p class="note">Work is saved on this device automatically. Use Backup to keep a copy or move it to another phone.</p>
      </section>
    </div>
  </aside>
</div>

<div class="modal" id="modal" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <header id="m-title"></header>
    <div class="body" id="m-body"></div>
    <footer id="m-foot"></footer>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';
const KEY = 'walldraft.v1';
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const TYPES = {
  door:    { name: 'Door',       prefix: 'D', w: 900,  h: 2100, sill: 0 },
  window:  { name: 'Window',     prefix: 'W', w: 1200, h: 1200, sill: 900 },
  vent:    { name: 'Ventilator', prefix: 'V', w: 600,  h: 450,  sill: 2100 },
  opening: { name: 'Opening',    prefix: 'O', w: 1000, h: 2100, sill: 0 },
};
const UNIT_NAME = { mm: 'mm', cm: 'cm', m: 'm', ftin: 'ft-in', in: 'inch' };
const FACT = { mm: 1, cm: 10, m: 1000, in: 25.4, ft: 304.8 };
const uid = () => Math.random().toString(36).slice(2, 9);

/* ---------- data ---------- */
function sample() {
  const a = uid(), b = uid();
  return {
    v: 1, name: 'Example site (replace with your measurements)', unit: 'mm', snap: 10,
    showPlan: true, showHts: true, active: a, sel: null,
    walls: [
      { id: a, name: 'Wall A – Living room front', length: 4800, height: 3000, thickness: 230, openings: [
        { id: uid(), type: 'door', label: 'D1', x: 450, w: 1000, h: 2100, sill: 0, hinge: 'L', swing: 'in' },
        { id: uid(), type: 'window', label: 'W1', x: 2050, w: 1500, h: 1200, sill: 900 },
        { id: uid(), type: 'vent', label: 'V1', x: 4000, w: 600, h: 450, sill: 2100 },
      ]},
      { id: b, name: 'Wall B – Bedroom side', length: 3600, height: 3000, thickness: 115, openings: [
        { id: uid(), type: 'window', label: 'W2', x: 1200, w: 1200, h: 1200, sill: 900 },
      ]},
    ],
  };
}
function newProject() {
  const a = uid();
  return { v: 1, name: 'New site', unit: state ? state.unit : 'mm', snap: 10, showPlan: true, showHts: true, active: a, sel: null,
    walls: [{ id: a, name: 'Wall A', length: 3000, height: 3000, thickness: 230, openings: [] }] };
}
function validProject(p) {
  return p && Array.isArray(p.walls) && p.walls.length && p.walls.every(w => isFinite(w.length) && isFinite(w.height) && Array.isArray(w.openings));
}
function load() {
  try { const s = localStorage.getItem(KEY); if (s) { const p = JSON.parse(s); if (validProject(p)) return p; } } catch (e) {}
  return sample();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

let state = load();
let hist = [], fut = [];
const wall = () => state.walls.find(w => w.id === state.active) || state.walls[0];
const selOp = () => wall().openings.find(o => o.id === state.sel) || null;

function snapshot() { hist.push(JSON.stringify(state)); if (hist.length > 200) hist.shift(); fut = []; }
function commit(fn) { snapshot(); fn(); save(); render(); }
function undo() { if (!hist.length) return; fut.push(JSON.stringify(state)); state = JSON.parse(hist.pop()); save(); render(); }
function redo() { if (!fut.length) return; hist.push(JSON.stringify(state)); state = JSON.parse(fut.pop()); save(); render(); }

/* ---------- units ---------- */
function evalExpr(src) {
  const s = src.replace(/\s+/g, ''); let i = 0;
  const num = () => {
    if (s[i] === '(') { i++; const v = expr(); if (s[i] !== ')') throw 0; i++; return v; }
    if (s[i] === '-') { i++; return -num(); }
    const m = /^\d*\.?\d+/.exec(s.slice(i)); if (!m) throw 0; i += m[0].length; return parseFloat(m[0]);
  };
  const term = () => { let v = num(); while (s[i] === '*' || s[i] === '/' || s[i] === 'x') { const o = s[i++]; const r = num(); v = o === '/' ? v / r : v * r; } return v; };

  'e-h':    { get: () => selOp().h,        set: v => { if (v <= 0) return false; selOp().h = v; } },
  'e-left': { get: () => selOp().x,        set: v => { selOp().x = v; } },
  'e-right':{ get: () => wall().length - selOp().x - selOp().w, set: v => { const o = selOp(); o.x = wall().length - o.w - v; } },
  'e-sill': { get: () => selOp().sill,     set: v => { selOp().sill = v; } },
  'e-head': { get: () => selOp().sill + selOp().h, set: v => { const o = selOp(); o.sill = v - o.h; } },
};
for (const [id, b] of Object.entries(lenInputs)) {
  const el = document.getElementById(id);
  el.addEventListener('change', () => {
    const v = parseLen(el.value);
    if (!isFinite(v)) { el.classList.add('err'); toast('Could not read "' + el.value + '". ' + unitExample()); return; }
    const before = JSON.stringify(state);
    snapshot();
    if (b.set(Math.round(v * 100) / 100) === false) { hist.pop(); el.classList.add('err'); toast('Value must be more than zero'); return; }
    if (JSON.stringify(state) === before) hist.pop();
    el.classList.remove('err'); save(); render();
  });
  el.addEventListener('keydown', e => { if (e.key === 'Enter') el.blur(); });
  el.addEventListener('input', () => el.classList.remove('err'));
}
function unitExample() {
  return { mm: 'Type mm, e.g. 1200 or 900+300', cm: 'Type cm, e.g. 120.5', m: 'Type metres, e.g. 1.2', in: 'Type inches, e.g. 47 1/2', ftin: "Type feet-inch, e.g. 5'6\" or 5-6 or 5' 6 1/2\"" }[state.unit];
}
function bindText(id, get, set) {
  const el = document.getElementById(id);
  el.addEventListener('change', () => commit(() => set(el.value)));
  el.addEventListener('keydown', e => { if (e.key === 'Enter') el.blur(); });
  return () => { if (document.activeElement !== el) el.value = get(); };
}
const syncers = [
  bindText('p-name', () => state.name, v => state.name = v.trim()),
  bindText('w-name', () => wall().name, v => wall().name = v.trim() || 'Wall'),
];
$('#p-unit').addEventListener('change', e => commit(() => state.unit = e.target.value));
$('#p-snap').addEventListener('change', e => commit(() => state.snap = +e.target.value));
const syncEd = [
  bindText('e-label', () => selOp() ? selOp().label : '', v => { if (selOp()) selOp().label = v.trim().toUpperCase(); }),
];
$('#e-type').addEventListener('change', e => commit(() => {
  const o = selOp(); const t = e.target.value; o.type = t;
  o.label = nextLabel(t, o.id);
  if (t === 'door' || t === 'opening') o.sill = 0;
  if (t === 'door') { o.hinge = o.hinge || 'L'; o.swing = o.swing || 'in'; }
}));
$('#e-hinge').addEventListener('change', e => commit(() => selOp().hinge = e.target.value));
$('#e-swing').addEventListener('change', e => commit(() => selOp().swing = e.target.value));

function nextLabel(type, exceptId) {
  const pre = TYPES[type].prefix; let max = 0;
  for (const w of state.walls) for (const o of w.openings) {
    if (o.id === exceptId) continue;
    const m = new RegExp('^' + pre + '(\\d+)$').exec(o.label || ''); if (m) max = Math.max(max, +m[1]);
  }
  return pre + (max + 1);
}
function freeX(w, width) {
  const ops = [...w.openings].sort((a, b) => a.x - b.x); const gap = Math.min(300, w.length * 0.08);
  let cur = 0;
  for (const o of ops) { if (o.x - cur >= width + 2 * gap) return cur + gap; cur = Math.max(cur, o.x + o.w); }
  if (w.length - cur >= width + 2 * gap) return cur + gap;
  return Math.max(0, (w.length - width) / 2);
}
function addOpening(type) {
  commit(() => {
    const w = wall(), t = TYPES[type];
    const o = { id: uid(), type, label: nextLabel(type), w: Math.min(t.w, w.length), h: Math.min(t.h, w.height), sill: t.sill, x: 0 };
    if (o.sill + o.h > w.height) o.sill = Math.max(0, w.height - o.h);
    if (type === 'door') { o.hinge = 'L'; o.swing = 'in'; }
    o.x = Math.round(freeX(w, o.w));
    w.openings.push(o); state.sel = o.id;
  });
  if (window.matchMedia('(max-width: 820px)').matches) $('#ed').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
$$('[data-add]').forEach(b => b.addEventListener('click', () => addOpening(b.dataset.add)));

function armDelete(btn, label, fn) {
  btn.addEventListener('click', () => {
    if (btn.classList.contains('armed')) { btn.classList.remove('armed'); btn.textContent = label; clearTimeout(btn._t); fn(); return; }
    btn.classList.add('armed'); btn.textContent = 'Tap again to confirm';
    clearTimeout(btn._t); btn._t = setTimeout(() => { btn.classList.remove('armed'); btn.textContent = label; }, 3000);
  });
}
armDelete($('#w-del'), 'Delete wall', () => commit(() => {
  if (state.walls.length === 1) { const w = state.walls[0]; w.openings = []; w.name = 'Wall A'; return; }
  state.walls = state.walls.filter(w => w.id !== state.active); state.active = state.walls[0].id; state.sel = null;
}));
$('#w-dup').addEventListener('click', () => commit(() => {
  const w = JSON.parse(JSON.stringify(wall())); w.id = uid(); w.name += ' (copy)';
  w.openings.forEach(o => { o.id = uid(); o.label = ''; });
  const i = state.walls.findIndex(q => q.id === state.active);
  state.walls.splice(i + 1, 0, w);
  w.openings.forEach(o => { o.label = nextLabel(o.type, o.id); });   // keep marks unique across the project
  state.active = w.id; state.sel = null;
}));
armDelete($('#e-del'), 'Delete', () => commit(() => { const w = wall(); w.openings = w.openings.filter(o => o.id !== state.sel); state.sel = null; }));
$('#e-dup').addEventListener('click', () => commit(() => {
  const w = wall(), o = selOp(); const c = { ...o, id: uid(), label: nextLabel(o.type) };
  c.x = Math.round(freeX(w, c.w)); w.openings.push(c); state.sel = c.id;
}));
$('#e-center').addEventListener('click', () => commit(() => { const o = selOp(); o.x = Math.round((wall().length - o.w) / 2 * 100) / 100; }));

$('#w-tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.wid) { state.active = b.dataset.wid; state.sel = null; save(); render(); fit(); }
  else {
    commit(() => {
      const letter = String.fromCharCode(65 + (state.walls.length % 26));
      const prev = wall();
      const w = { id: uid(), name: 'Wall ' + letter, length: 3000, height: prev.height, thickness: prev.thickness, openings: [] };
      state.walls.push(w); state.active = w.id; state.sel = null;
    });
    fit();
  }
});
$('#o-list').addEventListener('click', e => {
  const b = e.target.closest('[data-oid]'); if (!b) return;
  state.sel = state.sel === b.dataset.oid ? null : b.dataset.oid; save(); render();
});
$('#undo').addEventListener('click', undo);
$('#redo').addEventListener('click', redo);
$('#fit').addEventListener('click', fit);
$('#tg-plan').addEventListener('click', () => { commit(() => state.showPlan = !state.showPlan); fit(); });
$('#tg-hts').addEventListener('click', () => commit(() => state.showHts = !state.showHts));

document.addEventListener('keydown', e => {
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing) { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y' && !typing) { e.preventDefault(); redo(); return; }
  if (typing || !$('#modal').hidden) { if (e.key === 'Escape') closeModal(); return; }
  const o = selOp(); if (!o) return;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); commit(() => { wall().openings = wall().openings.filter(q => q.id !== o.id); state.sel = null; }); }
  const step = snapStep() * (e.shiftKey ? 10 : 1);
  const mv = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, step], ArrowDown: [0, -step] }[e.key];
  if (mv) { e.preventDefault(); commit(() => { o.x += mv[0]; if (o.type === 'window' || o.type === 'vent') o.sill = Math.max(0, o.sill + mv[1]); }); }
  if (e.key === 'Escape') { state.sel = null; save(); render(); }
});

/* ---------- render ---------- */
function render(drawOnly) {
  const w = wall();
  const dr = buildDrawing(w, { interactive: true });
  svg.innerHTML = dr.svg;
  const boxChanged = !lastBox || JSON.stringify(lastBox) !== JSON.stringify(dr.box);
  const prevBox = lastBox; lastBox = dr.box;
  if (!view) fit();
  else if (boxChanged && !drawOnly && prevBox && Math.abs(prevBox.w - dr.box.w) / prevBox.w > 0.15) fit();
  $('#undo').disabled = !hist.length; $('#redo').disabled = !fut.length;
  $('#tg-plan').setAttribute('aria-pressed', String(!!state.showPlan));
  $('#tg-hts').setAttribute('aria-pressed', String(!!state.showHts));

  // inputs
  for (const [id, b] of Object.entries(lenInputs)) {
    const el = document.getElementById(id);
    if (id.startsWith('e-') && !selOp()) continue;
    if (document.activeElement !== el || drawOnly) el.value = fmt(b.get());
    el.placeholder = state.unit === 'ftin' ? "e.g. 3'6\"" : UNIT_NAME[state.unit];
    el.inputMode = state.unit === 'ftin' || state.unit === 'in' ? 'text' : 'decimal';
  }
  if (drawOnly) return;
  syncers.forEach(f => f());
  $('#p-unit').value = state.unit; $('#p-snap').value = String(state.snap || 10);
  $('#unit-note').textContent = unitExample() + '. You can also type another unit, e.g. 4.2m or 10\'6".';

  $('#w-tabs').innerHTML = state.walls.map(q => `<button class="tab" data-wid="${q.id}" aria-current="${q.id === w.id}">${esc(q.name)}</button>`).join('') + '<button class="tab add">+ Wall</button>';

  const ops = [...w.openings].sort((a, b) => a.x - b.x);
  $('#o-count').textContent = ops.length ? ops.length + '' : '';
  $('#o-list').innerHTML = ops.length ? ops.map(o => {
    const iss = issuesFor(w, o);
    return `<button class="orow" role="option" data-oid="${o.id}" aria-selected="${o.id === state.sel}">
      <span class="tag ${o.type}">${esc(o.label || TYPES[o.type].prefix)}</span>
      <span class="meta">${fmt(o.w)}×${fmt(o.h)} <span>· ${TYPES[o.type].name.toLowerCase()} · ${fmt(o.x)} from left${o.sill ? ' · sill ' + fmt(o.sill) : ''}</span></span>
      ${iss.length ? `<span class="warnchip" title="${esc(iss.join('; '))}">check</span>` : '<span></span>'}
    </button>`;
  }).join('') : '<div class="empty">No openings yet. Use Door, Window, Vent or Opening above the drawing to add one, then type the sizes you measured.</div>';

  const o = selOp();
  $('#ed').hidden = !o;
  if (o) {
    $('#e-type').value = o.type; $('#e-hinge').value = o.hinge || 'L'; $('#e-swing').value = o.swing || 'in';
    syncEd.forEach(f => f());
    const tag = $('#e-tag'); tag.className = 'tag ' + o.type; tag.textContent = o.label || TYPES[o.type].prefix;
    $$('.door-only').forEach(el => el.hidden = o.type !== 'door');
    $('#e-issues').innerHTML = issuesFor(w, o).map(s => `<li>⚠ ${esc(s)}</li>`).join('');
  }

  // areas
  const rows = state.walls.map(q => {
    const g = q.length * q.height, op = q.openings.reduce((s, p) => s + p.w * p.h, 0);
    return { q, g, op, n: g - op };
  });
  const tot = rows.reduce((s, r) => ({ g: s.g + r.g, op: s.op + r.op, n: s.n + r.n }), { g: 0, op: 0, n: 0 });
  const a2 = v => area(v).m2.toFixed(2);
  $('#q-area').innerHTML = `<tr><th>Wall</th><th>Gross m²</th><th>Openings m²</th><th>Net m²</th><th>Net ft²</th></tr>` +
    rows.map(r => `<tr${r.q.id === w.id ? ' style="font-weight:500"' : ''}><td>${esc(r.q.name)}</td><td>${a2(r.g)}</td><td>${a2(r.op)}</td><td>${a2(r.n)}</td><td>${area(r.n).ft2.toFixed(1)}</td></tr>`).join('') +
    (rows.length > 1 ? `<tr class="tot"><td>Total</td><td>${a2(tot.g)}</td><td>${a2(tot.op)}</td><td>${a2(tot.n)}</td><td>${area(tot.n).ft2.toFixed(1)}</td></tr>` : '');

  // schedule
  const sched = {};
  for (const q of state.walls) for (const p of q.openings) {
    const k = [p.type, Math.round(p.w), Math.round(p.h), Math.round(p.sill)].join('|');
    (sched[k] = sched[k] || { p, marks: [], n: 0 }).n++;
    sched[k].marks.push(p.label || TYPES[p.type].prefix);
  }
  const sl = Object.values(sched).sort((a, b) => a.p.type.localeCompare(b.p.type) || a.p.w - b.p.w);
  $('#q-sched').innerHTML = sl.length ? `<tr><th>Marks</th><th>Type</th><th>W × H</th><th>Sill</th><th>Nos</th></tr>` +
    sl.map(s => `<tr><td>${esc(s.marks.join(', '))}</td><td>${TYPES[s.p.type].name}</td><td>${fmt(s.p.w)} × ${fmt(s.p.h)}</td><td>${fmt(s.p.sill)}</td><td>${s.n}</td></tr>`).join('')
    : '<tr><td class="note">Openings you add appear here with their sizes and counts.</td></tr>';
}

/* ---------- export ---------- */
const LIGHT = { paper: '#ffffff', panel: '#ffffff', ink: '#1a2220', muted: '#5b6965', dim: '#0b7a69', door: '#8a5523', win: '#1c73c4', warn: '#c2410c', wallfill: '#e2e8e5', hatch: '#b9c4c0' };
function exportSVG() {
  const dr = buildDrawing(wall(), { interactive: false });
  const c = LIGHT, b = dr.box, mono = "'IBM Plex Mono',Menlo,Consolas,monospace", head = "'IBM Plex Sans Condensed','Arial Narrow',Arial,sans-serif";
  const css = `.wall{fill:url(#hatch);stroke:${c.ink};stroke-width:2}.wallbg{fill:${c.wallfill}}.hl{stroke:${c.hatch};stroke-width:1}.gnd{stroke:${c.ink};stroke-width:2}.gh{stroke:${c.muted};stroke-width:1}
.op{fill:${c.paper};stroke:${c.ink};stroke-width:1.5}.door{stroke:${c.door};fill:none;stroke-width:1.3}.window{stroke:${c.win};fill:none;stroke-width:1.3}.vent{stroke:${c.dim};fill:none;stroke-width:1.1}
.opening{stroke:${c.muted};fill:none;stroke-width:1;stroke-dasharray:6 4}.dash{stroke-dasharray:7 5}.dim{stroke:${c.dim};stroke-width:1;fill:none}.ext{stroke:${c.dim};stroke-width:.7}
.dt{fill:${c.dim};font-family:${mono}}.lb{fill:${c.ink};font-family:${mono};font-weight:500}.lbs{fill:${c.muted};font-family:${mono}}.cap{fill:${c.ink};font-family:${head};font-weight:600;letter-spacing:.08em}
.tb{fill:${c.panel};stroke:${c.ink};stroke-width:1.3}.tbl{stroke:${c.ink};stroke-width:.8}.bad{fill:none;stroke:${c.warn};stroke-width:2.5;stroke-dasharray:5 3}.hit{fill:none}.pwall{fill:${c.wallfill};stroke:${c.ink};stroke-width:1.5}`;
  const W = 2400, Hh = Math.round(W * b.h / b.w);
  return { str: `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${Hh}" viewBox="${b.x} ${b.y} ${b.w} ${b.h}"><style>${css}</style><rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="#ffffff"/>${dr.svg}</svg>`, W, H: Hh };
}
const fileBase = () => ((state.name || 'walldraft') + ' ' + (wall().name || '')).replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-').slice(0, 60) || 'walldraft';
function tryDownload(href, name) { try { const a = document.createElement('a'); a.href = href; a.download = name; document.body.appendChild(a); a.click(); a.remove(); } catch (e) {} }
function openModal(title, bodyHTML, buttons) {
  $('#m-title').textContent = title; $('#m-body').innerHTML = bodyHTML; const f = $('#m-foot'); f.innerHTML = '';
  for (const [label, fn, cls] of buttons) { const b = document.createElement('button'); b.className = 'btn ' + (cls || ''); b.textContent = label; b.onclick = fn; f.appendChild(b); }
  $('#modal').hidden = false;
}
function closeModal() { $('#modal').hidden = true; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
async function copyText(txt, ta) {
  try { await navigator.clipboard.writeText(txt); toast('Copied'); }
  catch (e) { if (ta) { ta.focus(); ta.select(); toast('Select all and copy'); } }
}

$('#x-png').addEventListener('click', () => {
  const { str, W, H } = exportSVG();
  const img = new Image();
  const url = URL.createObjectURL(new Blob([str], { type: 'image/svg+xml' }));
  img.onload = () => {
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, W, H); g.drawImage(img, 0, 0, W, H);
    URL.revokeObjectURL(url);
    const data = cv.toDataURL('image/png');
    openModal('Drawing image', `<img src="${data}" alt="Wall elevation drawing"><p class="note">Long-press (phone) or right-click (computer) the image to save or share it.</p>`,
      [['Download PNG', () => tryDownload(data, fileBase() + '.png'), 'primary'], ['Close', closeModal]]);
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Could not make the image on this device'); };
  img.src = url;
});
$('#x-svg').addEventListener('click', () => {
  const { str } = exportSVG();
  tryDownload(URL.createObjectURL(new Blob([str], { type: 'image/svg+xml' })), fileBase() + '.svg');
  toast('SVG file saved (opens in browsers, Inkscape, Illustrator)');
});
function summaryText() {
  const u = UNIT_NAME[state.unit]; const out = [`${state.name}`, `All dimensions in ${u}`, ''];
  for (const w of state.walls) {
    const g = w.length * w.height, op = w.openings.reduce((s, p) => s + p.w * p.h, 0);
    out.push(`${w.name}: L ${fmt(w.length)} × H ${fmt(w.height)}, thk ${fmt(w.thickness)}`);
    for (const o of [...w.openings].sort((a, b) => a.x - b.x)) {
      out.push(`  ${o.label} ${TYPES[o.type].name}: ${fmt(o.w)} × ${fmt(o.h)}, ${fmt(o.x)} from left, ${fmt(w.length - o.x - o.w)} from right, sill ${fmt(o.sill)}, head ${fmt(o.sill + o.h)}${o.type === 'door' ? `, hinge ${o.hinge === 'R' ? 'right' : 'left'}` : ''}`);
    }
    out.push(`  Area gross ${area(g).m2.toFixed(2)} m², openings ${area(op).m2.toFixed(2)} m², net ${area(g - op).m2.toFixed(2)} m² (${area(g - op).ft2.toFixed(1)} ft²)`, '');
  }
  return out.join('\n');
}
$('#x-text').addEventListener('click', () => {
  const txt = summaryText();
  openModal('Measurements', `<textarea id="m-ta" readonly>${esc(txt)}</textarea><p class="note">Paste into WhatsApp, email or notes.</p>`,
    [['Copy', () => copyText(txt, $('#m-ta')), 'primary'], ['Close', closeModal]]);
});
$('#x-json').addEventListener('click', () => {
  const txt = JSON.stringify(state, null, 1);
  openModal('Backup', `<textarea id="m-ta" readonly>${esc(txt)}</textarea><p class="note">Save this file, or copy the text. Restore it later with Restore backup.</p>`,
    [['Download file', () => tryDownload(URL.createObjectURL(new Blob([txt], { type: 'application/json' })), fileBase() + '.json'), 'primary'], ['Copy', () => copyText(txt, $('#m-ta'))], ['Close', closeModal]]);
});
$('#x-import').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try { const p = JSON.parse(r.result); if (!validProject(p)) throw 0; commit(() => { state = p; if (!state.walls.find(w => w.id === state.active)) state.active = state.walls[0].id; }); fit(); toast('Backup restored'); }
    catch (err) { toast('That file is not a WallDraft backup'); }
    e.target.value = '';
  };
  r.readAsText(f);
});
armDelete($('#x-new'), 'New project', () => { commit(() => { state = newProject(); }); fit(); toast('New project started. Undo brings the old one back.'); });

let lastSize = null;
new ResizeObserver(() => {
  const r = svg.getBoundingClientRect();
  if (lastSize && Math.abs(r.width - lastSize.w) < 2 && Math.abs(r.height - lastSize.h) < 80) return;  // ignore phone address-bar jiggle
  lastSize = { w: r.width, h: r.height }; if (lastBox) fit();
}).observe($('#sheet'));
render();
requestAnimationFrame(fit);
})();
</script>
</body>
</html>
