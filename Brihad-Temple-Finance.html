<style>
/* Layout: phone = one column + bottom bar; PC = left menu + colourful bento grid.
   Palette: violet, teal, coral, amber, blue, pink tiles on cool neutrals. */
:root{
--bg:#F5F4F0;--surface:#FFFFFF;--surface2:#F0EFEA;--line:#E4E2DB;--ink:#1F2230;--muted:#6A6E7C;
--violet:#4A4E8C;--teal:#2E6F69;--coral:#B0584A;--amber:#D9A441;--blue:#3F6591;--pink:#9C5372;
--on-amber:#1F2230;
--violet-t:#E8E9F4;--teal-t:#E0EEEC;--coral-t:#F5E5E1;--amber-t:#F8EDD5;--blue-t:#E3EBF4;--pink-t:#F3E4EA;
--violet-x:#3B3F78;--teal-x:#245A55;--coral-x:#8F4237;--amber-x:#7A5410;--blue-x:#31527A;--pink-x:#80405C;
--shadow:0 1px 2px rgba(31,34,48,.05),0 12px 26px -20px rgba(31,34,48,.22);
--font-display:'Bricolage Grotesque','Manrope',system-ui,sans-serif;
--font-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#14151C;--surface:#1D1F29;--surface2:#262836;--line:#33364A;--ink:#EEEEF3;--muted:#A3A6B8;
--violet:#6468B0;--teal:#3C8780;--coral:#C46A5B;--amber:#D9A441;--blue:#5683B8;--pink:#B26584;
--violet-t:#2A2D4F;--teal-t:#1F3B39;--coral-t:#412724;--amber-t:#3E3216;--blue-t:#223650;--pink-t:#402633;
--violet-x:#BFC2F2;--teal-x:#8ED3CB;--coral-x:#F0A89C;--amber-x:#EBC77E;--blue-x:#A9C8EE;--pink-x:#E5A9C1;
--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 28px -18px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#14151C;--surface:#1D1F29;--surface2:#262836;--line:#33364A;--ink:#EEEEF3;--muted:#A3A6B8;
--violet:#6468B0;--teal:#3C8780;--coral:#C46A5B;--amber:#D9A441;--blue:#5683B8;--pink:#B26584;
--violet-t:#2A2D4F;--teal-t:#1F3B39;--coral-t:#412724;--amber-t:#3E3216;--blue-t:#223650;--pink-t:#402633;
--violet-x:#BFC2F2;--teal-x:#8ED3CB;--coral-x:#F0A89C;--amber-x:#EBC77E;--blue-x:#A9C8EE;--pink-x:#E5A9C1;
--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 28px -18px rgba(0,0,0,.7);color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
svg{display:block;max-width:100%}
.disp{font-family:var(--font-display);font-weight:800;letter-spacing:-0.03em}
.tn{font-variant-numeric:tabular-nums}
.lbl{font-size:12px;font-weight:700;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* shell */
.shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.side{display:none}
.main{min-width:0;padding-block:16px 150px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.bt{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:700;border-radius:14px}
.bt.on{color:var(--violet-x);background:var(--violet-t)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:21;width:58px;height:58px;border-radius:20px;border:0;background:var(--violet);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 26px -8px var(--violet)}
@media (min-width:980px){
.shell{grid-template-columns:252px minmax(0,1fr)}
.side{display:flex;flex-direction:column;gap:6px;padding:22px 16px;border-right:1px solid var(--line);background:var(--surface);position:sticky;top:0;height:100vh;overflow-y:auto}
.bottom{display:none}
.main{padding-block:28px 56px;padding-inline:max(32px,env(safe-area-inset-left,0px)) max(32px,env(safe-area-inset-right,0px))}
.fab{right:32px;bottom:32px}
}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.logo i{width:40px;height:40px;border-radius:13px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-style:normal}
.navb{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-radius:14px;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:14px;text-align:left;width:100%}
.navb:hover{background:var(--surface2)}
.navb.on{background:var(--violet);color:#fff;box-shadow:0 12px 22px -12px var(--violet)}
.syncbox{margin-top:auto;border:1px solid var(--line);border-radius:18px;padding:14px;background:var(--surface2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:99px;background:var(--teal);margin-right:6px}

/* header */
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.head h1{margin:2px 0 0;font-size:30px;line-height:1.05}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ibtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center}
.btn{min-height:46px;padding:0 20px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:14px}
.btnp{min-height:46px;padding:0 22px;border-radius:99px;border:0;background:var(--violet);color:#fff;font-weight:800;font-size:14px;box-shadow:0 14px 26px -12px var(--violet)}
.btnx{min-height:46px;padding:0 22px;border-radius:99px;border:0;background:var(--ink);color:var(--bg);font-weight:800;font-size:14px}
.hide-s{display:none}
@media (min-width:640px){.hide-s{display:inline-flex}}

/* cards + tiles */
.card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:var(--shadow);min-width:0}
.tile{position:relative;overflow:hidden;border-radius:26px;padding:18px 18px;color:#fff;min-width:0}
.tile .t-l{font-size:12px;font-weight:700;opacity:.9}
.tile .t-v{font-family:var(--font-display);font-weight:800;letter-spacing:-0.03em;font-size:24px;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .t-n{font-size:12px;font-weight:700;opacity:.92;margin-top:2px}
.bg-violet{background:var(--violet)}.bg-teal{background:var(--teal)}.bg-coral{background:var(--coral)}.bg-blue{background:var(--blue)}
.bg-amber{background:var(--amber);color:var(--on-amber)}
.chip{display:inline-block;font-size:11px;font-weight:800;border-radius:99px;padding:4px 10px;white-space:nowrap}
.c-violet{background:var(--violet-t);color:var(--violet-x)}.c-teal{background:var(--teal-t);color:var(--teal-x)}.c-coral{background:var(--coral-t);color:var(--coral-x)}
.c-amber{background:var(--amber-t);color:var(--amber-x)}.c-blue{background:var(--blue-t);color:var(--blue-x)}.c-pink{background:var(--pink-t);color:var(--pink-x)}
.c-mu{background:var(--surface2);color:var(--muted)}
.chipw{background:rgba(255,255,255,.22);color:inherit}
.f-violet{fill:var(--violet)}.f-teal{fill:var(--teal)}.f-coral{fill:var(--coral)}.f-amber{fill:var(--amber)}.f-blue{fill:var(--blue)}.f-pink{fill:var(--pink)}.f-ink{fill:var(--ink)}.f-w{fill:#fff}
.t-ink{fill:var(--ink)}.t-mu{fill:var(--muted)}
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.span2{grid-column:span 2}
.sect{margin-top:12px}
.row2{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:12px}
@media (min-width:980px){
.bento{grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.bento>.cash{grid-column:span 4}.bento>.k{grid-column:span 2}
.row2{grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-top:16px}
.row2>.c7{grid-column:span 7}.row2>.c5{grid-column:span 5}.row2>.c4{grid-column:span 4}.row2>.c3{grid-column:span 3}.row2>.c12{grid-column:span 12}.row2>.c8{grid-column:span 8}.row2>.c6{grid-column:span 6}
}
@media (min-width:640px) and (max-width:979px){.bento{grid-template-columns:repeat(4,minmax(0,1fr))}.bento>.cash{grid-column:span 4}.bento>.k{grid-column:span 1}}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.cardhead h2{margin:0;font-size:20px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:700;font-size:12px}
.pill.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{min-height:46px;width:100%;border:1px solid var(--line);border-radius:14px;background:var(--surface2);padding:0 14px;color:var(--ink);outline:0}
.search:focus,.inp:focus{border-color:var(--violet)}
.inp{min-height:46px;width:100%;border:1px solid var(--line);border-radius:14px;background:var(--surface2);padding:0 14px;color:var(--ink);outline:0}

/* lists */
.li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .m{flex:1;min-width:0}
.li .m b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .m span{font-size:12px;color:var(--muted)}
.av{width:40px;height:40px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.rowb{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:1px solid transparent;border-radius:18px;background:transparent;text-align:left;min-width:0}
.rowb:hover{background:var(--surface2)}
.rowb.on{background:var(--violet-t);border-color:var(--violet)}
.proj{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:22px;padding:16px;background:var(--surface2)}
.proj:hover{border-color:var(--violet)}
.seg{display:flex;gap:4px}.seg i{flex:1;height:6px;border-radius:99px;background:var(--line)}.seg i.d{background:var(--violet)}.seg i.n{background:var(--amber)}
.trk{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.trk>i{display:block;height:100%;border-radius:99px;background:var(--violet)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini{background:var(--surface2);border-radius:14px;padding:9px 12px;min-width:0}
.mini b{display:block;font-size:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .pill{flex-shrink:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:760px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;color:var(--muted);padding:10px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:13px 8px;border-bottom:1px solid var(--line)}
.tbl .r{text-align:right}
.scrollx{overflow-x:auto}

/* stepper */
.step{display:flex}
.step>div{flex:1;text-align:center;position:relative;font-size:10px;font-weight:700}
.step .ln{position:absolute;top:13px;right:50%;width:100%;height:3px;background:var(--line)}
.step .ln.d{background:var(--violet)}.step .ln.f{display:none}
.nd{position:relative;z-index:1;width:28px;height:28px;border-radius:99px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;border:2px solid var(--line);background:var(--surface);color:var(--muted)}
.nd.d{background:var(--violet);border-color:var(--violet);color:#fff}
.nd.n{border-color:var(--violet);color:var(--violet-x);box-shadow:0 0 0 5px var(--violet-t)}

/* heat map */
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.hm span{aspect-ratio:1;border-radius:9px;background:var(--surface2);display:block;min-width:0}
.hm span[data-l="1"]{background:color-mix(in srgb,var(--coral) 26%,var(--surface2))}
.hm span[data-l="2"]{background:color-mix(in srgb,var(--coral) 48%,var(--surface2))}
.hm span[data-l="3"]{background:color-mix(in srgb,var(--coral) 70%,var(--surface2))}
.hm span[data-l="4"]{background:var(--coral)}
.hm span[data-l="5"]{background:color-mix(in srgb,var(--coral) 80%,#000)}
.hm span.fut{background:transparent;border:1.5px dashed var(--line)}
.hm span.today{outline:3px solid var(--ink)}
.hmh{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;text-align:center;font-size:10px;font-weight:800;color:var(--muted)}

/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(15,16,24,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:16px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));animation:up .3s ease}
@media (min-width:640px){.ov{align-items:center}.sheet{border-radius:28px;padding-bottom:24px}}
.grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 12px}
.paper{background:#fff;color:#1F2230;border-radius:18px;padding:20px;box-shadow:0 14px 40px rgba(0,0,0,.25)}
.pl{font-size:10px;font-weight:800;letter-spacing:.06em;color:#7A7FA6}
.signbox{width:100%;height:74px;border:1.5px dashed #B7BBD8;border-radius:12px;background:#FAFAFE;color:#6B70A0;font-weight:700;font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:99px;font-weight:700;font-size:13px;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 14px 30px rgba(0,0,0,.35)}
@media (min-width:980px){.toast{bottom:28px}}
.field{display:block;margin-top:14px}
.field>span{display:block;margin-bottom:6px}
.amt{font-family:var(--font-display);font-weight:800;font-size:34px;letter-spacing:-0.03em;min-height:64px}

@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes sweep{from{stroke-dashoffset:260}}
@keyframes pop{from{transform:scale(.5)}to{transform:none}}
.rise{animation:rise .5s ease both}
.gb{transform-box:fill-box;transform-origin:bottom;animation:grow .8s .2s ease both}
.sw{animation:sweep 1.4s .2s ease both}
.pp{transform-box:fill-box;transform-origin:center;animation:pop .5s ease both}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.stg{border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:8px;background:var(--surface2)}
textarea.inp{width:100%;font-family:inherit;resize:vertical;line-height:1.4}
.field input[type=date]{min-width:0}
</style>
</head>

function derive(){
  var D={projects:[],byId:{},parties:[],pById:{},months:[],heat:{}};
  DB.projects.forEach(function(p){
    var q=Object.assign({},p);q.received=0;q.spent=0;q.billed=0;q.paidParty=0;q.stageRec={};q.sec={};SECTIONS.forEach(function(s){q.sec[s]=0});
    var done=0;q.stages.forEach(function(s){if(s.done)done++});
    q.doneCount=done;q.progress=q.stages.length?Math.round(done/q.stages.length*100):0;
    q.curIdx=-1;for(var i=0;i<q.stages.length;i++){if(!q.stages[i].done){q.curIdx=i;break}}
    q.status=(q.stages.length&&done===q.stages.length)?'done':'active';
    D.byId[p.id]=q;D.projects.push(q)});
  DB.parties.forEach(function(p){var q=Object.assign({},p);q.bills=0;q.paid=0;q.lines=[];D.pById[p.id]=q;D.parties.push(q)});
  var months=[],d=new Date();d.setDate(1);
  for(var i=5;i>=0;i--){var m=new Date(d.getFullYear(),d.getMonth()-i,1);months.push({k:m.getFullYear()+'-'+pad(m.getMonth()+1,2),l:MON[m.getMonth()],inn:0,out:0})}
  D.months=months;
  var curM=today().slice(0,7);
  DB.txns.forEach(function(t){
    var p=D.byId[t.projId];
    if(t.kind==='in'){if(p){p.received+=t.amount;if(t.stageId)p.stageRec[t.stageId]=(p.stageRec[t.stageId]||0)+t.amount}}
    else if(t.kind==='out'){if(p){p.spent+=t.amount;p.sec[t.section]=(p.sec[t.section]||0)+t.amount}}
    var pt=t.partyId&&D.pById[t.partyId];
    if(pt){if(t.kind==='bill'){pt.bills+=t.amount;if(p)p.billed+=t.amount}else if(t.kind==='out'){pt.paid+=t.amount;if(p)p.paidParty+=t.amount}pt.lines.push(t)}
    D.months.forEach(function(m){if(t.date&&t.date.slice(0,7)===m.k){if(t.kind==='in')m.inn+=t.amount;else if(t.kind==='out')m.out+=t.amount}});
    if(t.kind==='out'&&t.date&&t.date.slice(0,7)===curM){var dd=+t.date.slice(8,10);D.heat[dd]=(D.heat[dd]||0)+t.amount}
  });
  D.projects.forEach(function(p){p.due=Math.max(0,p.billed-p.paidParty)});
  D.totalValue=0;D.received=0;D.spent=0;D.toReceive=0;D.sec={};SECTIONS.forEach(function(s){D.sec[s]=0});
  D.projects.forEach(function(p){D.totalValue+=p.value;D.received+=p.received;D.spent+=p.spent;D.toReceive+=Math.max(0,p.value-p.received);SECTIONS.forEach(function(s){D.sec[s]+=p.sec[s]||0})});
  D.cash=D.received-D.spent;
  D.owe=0;D.parties.forEach(function(p){p.bal=p.bills-p.paid;if(p.bal>0)D.owe+=p.bal});
  D.month=D.months[5];
  return D}

/* ---------- forms ---------- */
function openEntry(projId,partyId){
  if(!DB.projects.length){toast('Add a project first, then record payments.');openProject();return}
  var pid=projId||S.projId||DB.projects[0].id,pt=partyId?DB.parties.filter(function(x){return x.id===partyId})[0]:null;
  S.form={kind:'out',projId:pid,stageId:'',section:'Stone',partyId:partyId||'',who:pt?pt.name:'',amount:'',mode:'Cash',date:today(),note:''};S.err='';S.modal='entry';render()}
function openProject(){S.form={name:'',client:'',value:'',start:today(),handover:'',stages:DEF_STAGES.map(function(n){return {id:uid(),name:n,amount:'',date:''}})};S.err='';S.modal='project';render()}
function saveEntry(){
  var f=S.form,amount=num(f.amount),inn=f.kind==='in';
  if(!amount){S.err='Enter an amount greater than zero.';render();return}
  var who=String(f.who||'').trim(),pt=f.partyId?DB.parties.filter(function(x){return x.id===f.partyId})[0]:null;
  if(!inn&&pt)who=pt.name;
  if(!who){S.err=inn?'Enter who paid you.':'Enter who you paid.';render();return}
  if(!f.date){S.err='Choose a date.';render();return}
  DB.vseq=(DB.vseq||0)+1;
  var t={id:uid(),kind:f.kind,projId:f.projId,stageId:inn?f.stageId:'',section:inn?'':f.section,partyId:inn?'':(f.partyId||''),who:who,amount:amount,mode:f.mode,date:f.date,note:String(f.note||'').trim(),vno:'BTC-'+pad(DB.vseq,4)};
  DB.txns.push(t);save();S.vid=t.id;S.form={fresh:1};S.modal='voucher';S.err='';render()}
function saveProject(){
  var f=S.form,value=num(f.value);
  if(!String(f.name).trim()){S.err='Enter the project name.';render();return}
  if(!value){S.err='Enter the total deal value.';render();return}
  var st=f.stages.filter(function(s){return String(s.name).trim()});
  if(!st.length){S.err='Add at least one stage.';render();return}
  DB.projects.push({id:uid(),name:f.name.trim(),client:String(f.client).trim(),value:value,start:f.start,handover:f.handover,stages:st.map(function(s){return {id:s.id,name:s.name.trim(),amount:num(s.amount),date:s.date,done:false}})});
  save();S.modal=null;S.page='projects';S.projId=DB.projects[DB.projects.length-1].id;S.tab='overview';render();window.scrollTo(0,0)}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.getAttribute('data-act'),g=t.getAttribute('data-arg'),f=S.form;
  if(a==='ovclick'){if(e.target===t){S.modal=null;S.confirm='';render()}return}
  switch(a){
  case 'nav':go(g);break;
  case 'openProj':S.page='projects';S.projId=g;S.tab='overview';S.confirm='';render();window.scrollTo(0,0);break;
  case 'closeProj':S.projId=null;S.confirm='';render();break;
  case 'tab':S.tab=g;render();break;
  case 'filter':S.filter=g;render();break;
  case 'pf':S.pf=g;render();break;
  case 'newProject':openProject();break;
  case 'openAdd':openEntry(g&&g!=='undefined'?g:null);break;
  case 'closeModal':S.modal=null;S.confirm='';render();break;
  case 'kind':f.kind=g;f.who='';f.partyId='';f.stageId='';if(g==='in'){var pp=DB.projects.filter(function(x){return x.id===f.projId})[0];f.who=pp?pp.client||'':'';f.mode='Bank'}else f.mode='Cash';render();break;
  case 'section':f.section=g;render();break;
  case 'mode':f.mode=g;render();break;
  case 'ptype':f.type=g;render();break;
  case 'saveEntry':saveEntry();break;
  case 'addStage':f.stages.push({id:uid(),name:'',amount:'',date:''});render();break;
  case 'rmStage':if(f.stages.length>1){f.stages.splice(+g,1);render()}break;
  case 'saveProject':saveProject();break;
  case 'toggleStage':var p=DB.projects.filter(function(x){return x.id===S.projId})[0];p.stages.forEach(function(s){if(s.id===g)s.done=!s.done});save();render();break;
  case 'askConfirm':S.confirm=g;render();break;
  case 'cancelConfirm':S.confirm='';render();break;
  case 'delProj':DB.txns=DB.txns.filter(function(x){return x.projId!==S.projId});DB.projects=DB.projects.filter(function(x){return x.id!==S.projId});save();S.projId=null;S.confirm='';toast('Project deleted');break;
  case 'newParty':S.form={name:'',type:TYPES[0],phone:''};S.err='';S.modal='party';render();break;
  case 'saveParty':if(!String(f.name).trim()){S.err='Enter a name.';render();break}DB.parties.push({id:uid(),name:f.name.trim(),type:f.type,phone:String(f.phone).trim()});save();S.modal=null;toast('Person added');break;
  case 'openParty':S.page='people';S.partyId=g;S.confirm='';render();window.scrollTo(0,0);break;
  case 'closeParty':S.partyId=null;S.confirm='';render();break;
  case 'addBill':if(!DB.projects.length){toast('Add a project first.');break}S.form={partyId:g,projId:S.projId||DB.projects[0].id,amount:'',note:'',date:today()};S.err='';S.modal='bill';render();break;
  case 'saveBill':var am=num(f.amount);if(!am){S.err='Enter an amount greater than zero.';render();break}DB.txns.push({id:uid(),kind:'bill',projId:f.projId,stageId:'',section:'',partyId:f.partyId,who:(DB.parties.filter(function(x){return x.id===f.partyId})[0]||{}).name||'',amount:am,mode:'',date:f.date||today(),note:String(f.note||'').trim(),vno:''});save();S.modal=null;toast('Bill added');break;
  case 'payParty':openEntry(S.projId||null,g);break;
  case 'delParty':DB.parties=DB.parties.filter(function(x){return x.id!==g});save();S.partyId=null;S.confirm='';toast('Person deleted');break;
  case 'openV':S.vid=g;S.form={};S.confirm='';S.modal='voucher';render();break;
  case 'vpdf':pdfVoucher(findTxn(g));break;
  case 'vshare':shareText(voucherText(findTxn(g)),'Voucher');break;
  case 'stmtPdf':pdfStatement(derive().pById[g]);break;
  case 'stmtShare':shareText(stmtText(derive().pById[g]),'Statement');break;
  case 'delTx':DB.txns=DB.txns.filter(function(x){return x.id!==g});save();S.modal=null;S.confirm='';toast('Entry deleted');break;
  case 'theme':case 'setTheme':var nv=a==='theme'?(isDark()?'light':'dark'):g;document.documentElement.setAttribute('data-theme',nv);try{localStorage.setItem('bt-theme',nv)}catch(x){}render();break;
  case 'saveBiz':DB.biz={name:document.getElementById('b-name').value.trim()||'My Business',phone:document.getElementById('b-phone').value.trim(),addr:document.getElementById('b-addr').value.trim()};save();toast('Details saved');break;
  case 'backup':var txt=JSON.stringify(DB);try{navigator.clipboard.writeText(txt).then(function(){toast('Backup copied. Paste it somewhere safe.')},function(){fallbackCopy(txt)})}catch(x){fallbackCopy(txt)}break;
  case 'restore':S.form={};S.err='';S.modal='restore';render();break;
  case 'doRestore':try{var d=JSON.parse(document.getElementById('restorebox').value);if(!d||!d.projects||!d.parties||!d.txns)throw 0;DB=d;DB.biz=DB.biz||blank().biz;save();S.modal=null;S.page='home';S.projId=null;S.partyId=null;toast('Backup restored')}catch(x){S.err='This does not look like a valid backup.';render()}break;
  case 'selectCopy':var cb=document.getElementById('copybox');cb.focus();cb.select();break;
  case 'erase':DB=blank();save();S.confirm='';S.page='home';S.projId=null;S.partyId=null;toast('All data erased');break;
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='pq'){S.q=t.value;document.getElementById('projList').innerHTML=projListHtml(derive());return}
  if(t.id==='payq'){S.pq=t.value;document.getElementById('payList').innerHTML=payListHtml(derive());return}
  if(t.id==='peq'){S.peq=t.value;document.getElementById('peList').innerHTML=peopleListHtml(derive());return}
  if(!S.form)return;
  var k=t.getAttribute&&t.getAttribute('data-f');if(k){S.form[k]=t.value;if(k==='value'){var s=0;S.form.stages&&S.form.stages.forEach(function(x){s+=num(x.amount)});var el=document.getElementById('stgSum');if(el)el.textContent=stgSumText(t.value,s)}return}
  var si=t.getAttribute&&t.getAttribute('data-si');if(si!==null&&si!==undefined&&S.form.stages){S.form.stages[+si][t.getAttribute('data-sf')]=t.value;var s2=0;S.form.stages.forEach(function(x){s2+=num(x.amount)});var el2=document.getElementById('stgSum');if(el2)el2.textContent=stgSumText(S.form.value,s2)}
});
document.addEventListener('change',function(e){
  var t=e.target,k=t.getAttribute&&t.getAttribute('data-f');
  if(k&&S.form&&t.tagName==='SELECT'){S.form[k]=t.value;if(k==='projId'){S.form.stageId=''}if(k==='partyId'&&S.form.kind==='out'){var pt=DB.parties.filter(function(x){return x.id===t.value})[0];S.form.who=pt?pt.name:''}render()}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&S.modal){S.modal=null;S.confirm='';render()}});
render();
})();
</script>
</body>
</html>
